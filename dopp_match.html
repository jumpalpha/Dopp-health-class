<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Sprite Memory</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const W = 420, H = 640;
const LEVELS = [{ cols: 4, rows: 4, time: 75 }, { cols: 4, rows: 5, time: 95 }, { cols: 5, rows: 6, time: 140 }];
const ITEMS = [
  ['apple', 'Apple', 'Apples are full of fiber.'], ['water', 'Water', 'Water helps your brain focus.'], ['carrot', 'Carrot', 'Carrots help keep your eyes healthy.'],
  ['broccoli', 'Broccoli', 'Broccoli is loaded with vitamin C.'], ['banana', 'Banana', 'Bananas have potassium for your muscles.'], ['grape', 'Grapes', 'Grapes count toward your daily fruit.'],
  ['orange', 'Orange', 'Oranges are packed with vitamin C.'], ['strawberry', 'Berry', 'Berries are full of antioxidants.'], ['heart', 'Heart', 'Exercise makes your heart stronger.'],
  ['star', 'Star', 'Small healthy habits make you a star.'], ['shield', 'Shield', 'Sleep and handwashing help shield you from germs.'], ['soda', 'Soda', 'Soda has lots of added sugar. Save it for once in a while.'],
  ['burger', 'Burger', 'Fast food is fine sometimes; balance is key.'], ['donut', 'Donut', 'Donuts are a "sometimes" food.'], ['candy', 'Candy', 'Candy can spike and crash your energy.']
];
let cards, open, lock, level, timeLeft, combo, cursor, flips, phase, phaseT, host, layout;

function buildLevel(n) {
  const L = LEVELS[n], pairs = L.cols * L.rows / 2;
  const pick = ITEMS.slice().sort(() => Math.random() - 0.5).slice(0, pairs);
  const deck = pick.concat(pick).map((it, i) => ({ art: it[0], name: it[1], fact: it[2], up: 0, target: 0, matched: false, shake: 0 }))
    .sort(() => Math.random() - 0.5);
  const gap = 8, top = 112, avail = H - top - 30, cw = Math.min((W - 24 - gap * (L.cols - 1)) / L.cols, (avail - gap * (L.rows - 1)) / L.rows / 1.15);
  const ch = cw * 1.15, gx = (W - (L.cols * cw + gap * (L.cols - 1))) / 2;
  deck.forEach((c, i) => { const col = i % L.cols, row = Math.floor(i / L.cols); c.x = gx + col * (cw + gap); c.y = top + row * (ch + gap); c.w = cw; c.h = ch; });
  cards = deck; open = []; lock = 0; timeLeft = L.time; combo = 0; cursor = 0; flips = 0; phase = 'play'; phaseT = 0;
  // quick peek at the start of each level
  cards.forEach(c => c.target = 1); lock = 1.3; setTimeout(() => { if (cards === deck) deck.forEach(c => { if (!c.matched) c.target = 0; }); }, 1100);
}
function reset(A) { level = 0; host = { t: 0, mood: 'happy', jump: 0 }; buildLevel(0); }
function flip(i, A) {
  if (phase !== 'play' || lock > 0 || A.state !== 'play') return;
  const c = cards[i]; if (!c || c.matched || c.target === 1) return;
  c.target = 1; open.push(c); flips++; A.sfx('swipe');
  if (open.length === 2) {
    const [a, b] = open; lock = 0.6;
    setTimeout(() => {
      if (a.art === b.art) {
        a.matched = b.matched = true; combo++;
        const pts = 100 + (combo - 1) * 50; A.addScore(pts); A.sfx(combo > 2 ? 'medal' : 'coin');
        A.float('+' + pts + (combo > 1 ? ' combo ×' + combo : ''), (a.x + b.x) / 2 + a.w / 2, Math.min(a.y, b.y), '#7CFFB2');
        A.particles.burst(a.x + a.w / 2, a.y + a.h / 2, '#FFD700', 10, 160, 3); A.particles.burst(b.x + b.w / 2, b.y + b.h / 2, '#FFD700', 10, 160, 3);
        if (Math.random() < 0.4) A.toast('💡 ' + a.fact, 2200);
        host.mood = 'happy'; host.jump = 1;
        if (cards.every(c => c.matched)) levelClear(A);
      } else {
        combo = 0; a.shake = b.shake = 0.35; host.mood = 'tired';
        setTimeout(() => { a.target = 0; b.target = 0; }, 350);
      }
      open = [];
    }, 450);
  }
}
function levelClear(A) {
  const bonus = Math.round(timeLeft) * 10;
  A.addScore(250 + bonus); A.sfx('win');
  phase = 'clear'; phaseT = 0;
  if (level === 1) A.win('You cleared 2 memory levels!');
  A.float('Level clear! +' + (250 + bonus), W / 2, 330, '#FFD700');
}
function input(type, A) {
  if (!cards) return;
  const L = LEVELS[level];
  if (phase === 'clear' && phaseT > 1.2 && (type === 'tap' || type === 'up')) { nextLevel(A); return; }
  if (type === 'left') cursor = Math.max(0, cursor - 1);
  else if (type === 'right') cursor = Math.min(cards.length - 1, cursor + 1);
  else if (type === 'up') cursor = Math.max(0, cursor - L.cols);
  else if (type === 'down') cursor = Math.min(cards.length - 1, cursor + L.cols);
  else if (type === 'tap' && !pointerTap) flip(cursor, A);
  pointerTap = false;
}
let pointerTap = false;
function pointer(t, x, y, A) {
  if (t !== 'down') return;
  pointerTap = true;   // the matching 'tap' event from this touch is ignored by input()
  if (phase === 'clear' && phaseT > 1.2) { nextLevel(A); return; }
  const i = cards.findIndex(c => x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h);
  if (i >= 0) { cursor = i; flip(i, A); }
}
function nextLevel(A) { if (level + 1 >= LEVELS.length) { A.gameOver(true); return; } level++; buildLevel(level); A.toast('Level ' + (level + 1) + ': ' + LEVELS[level].cols * LEVELS[level].rows / 2 + ' pairs!'); }
function update(dt, A) {
  if (!cards) return;
  host.t += dt; host.jump = Math.max(0, host.jump - dt * 2);
  cards.forEach(c => { c.up += (c.target - c.up) * Math.min(1, dt * 14); c.shake = Math.max(0, c.shake - dt); });
  if (A.state !== 'play') return;
  phaseT += dt; lock = Math.max(0, lock - dt);
  if (phase === 'play') { timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; phase = 'out'; host.mood = 'tired'; A.gameOver(); } }
}
function draw(ctx, A) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2b1660'); g.addColorStop(1, '#140c36');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!cards) return;
  const L = LEVELS[level];
  ctx.font = '900 14px Nunito,sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#b9b0d6';
  ctx.fillText('Level ' + (level + 1) + '/3 · ' + cards.filter(c => c.matched).length / 2 + '/' + cards.length / 2 + ' pairs', 62, 80);
  // timer bar
  const tp = timeLeft / L.time;
  A.rr(20, 92, W - 40, 10, 5); A.ink('#1f1640', 2);
  if (tp > 0) { A.rr(20, 92, (W - 40) * tp, 10, 5); A.ink(tp > 0.5 ? '#3FCB6B' : tp > 0.25 ? '#FFD23F' : '#FF5C77', 2); }
  ctx.textAlign = 'right'; ctx.fillStyle = tp < 0.25 ? '#FF8FA3' : '#fff'; ctx.fillText(Math.ceil(timeLeft) + 's', W - 62, 80);
  cards.forEach((c, i) => {
    const sx = Math.cos(c.up * Math.PI), front = c.up > 0.5, sh = c.shake ? Math.sin(c.shake * 60) * 4 : 0;
    ctx.save(); ctx.translate(c.x + c.w / 2 + sh, c.y + c.h / 2); ctx.scale(Math.max(0.02, Math.abs(sx)), 1);
    A.rr(-c.w / 2, -c.h / 2, c.w, c.h, 12);
    if (front) {
      A.ink(c.matched ? '#1f6b4a' : '#2a1f55', 2.5);
      ART.draw(ctx, c.art, 0, -c.h * 0.08, c.w * 0.58, host.t);
      ctx.fillStyle = '#fff'; ctx.font = '800 ' + Math.round(c.w * 0.16) + 'px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(c.name, 0, c.h / 2 - c.h * 0.1);
    } else {
      A.ink('#6a3fd1', 2.5);
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; A.rr(-c.w / 2 + 6, -c.h / 2 + 6, c.w - 12, c.h - 12, 8); ctx.stroke();
      A.drawHero(0, 0, c.w * 0.5, 0, 'happy');
    }
    ctx.restore();
    if (i === cursor && kbUsed) { ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 3; A.rr(c.x - 4, c.y - 4, c.w + 8, c.h + 8, 14); ctx.stroke(); }
  });
  if (phase === 'clear' && phaseT > 0.5) {
    ctx.fillStyle = 'rgba(10,6,24,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.font = '900 32px Cinzel,serif'; ctx.lineWidth = 6; ctx.strokeStyle = A.INK;
    const t = level + 1 >= LEVELS.length ? 'All levels cleared!' : 'Level ' + (level + 1) + ' cleared!';
    ctx.strokeText(t, W / 2, 300); ctx.fillStyle = '#FFD700'; ctx.fillText(t, W / 2, 300);
    A.drawHero(W / 2, 370 + Math.sin(host.t * 4) * 6, 80, 0, 'happy');
    if (phaseT > 1.2) { ctx.fillStyle = '#7CFFB2'; ctx.font = '900 17px Nunito,sans-serif'; ctx.fillText('Tap to continue →', W / 2, 450); }
  }
}
let kbUsed = false; window.addEventListener('keydown', e => { if (/Arrow/.test(e.key)) kbUsed = true; });

window.__mem = () => ({ cards, level, phase, timeLeft, lock, flip: i => flip(i, game) });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Sprite Memory', subtitle: 'Match the pairs before time runs out!', W, H, reserveH: 70,
  storageKey: 'sprite_memory', winText: 'You cleared 2 memory levels!', deathDelay: 600, overTitle: 'Time\'s up!',
  medals: [{ at: 2000, name: 'Bronze', icon: '🥉' }, { at: 5000, name: 'Silver', icon: '🥈' }, { at: 9000, name: 'Gold', icon: '🥇' }, { at: 13000, name: 'Legend', icon: '💎' }],
  howTo: 'Tap two cards to flip them. Match the pairs!<br>Matches in a row build a <b>combo</b>. Leftover time is bonus points. <b>Clear 2 levels</b> to win!',
  controls: 'Tap or click cards · or arrows + Space · P pause',
  facts: [
    'Getting enough sleep helps your brain store memories.',
    'Memory games give your working memory a workout.',
    'Exercise increases blood flow to the brain and can help memory.',
    'Learning in short sessions spread out over time helps you remember more.',
    'Hydration helps your brain focus and remember.'
  ],
  reset, update, draw, input, pointer
});
})();
</script>
</body>
</html>
