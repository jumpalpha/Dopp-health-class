<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Sprite Snake</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const COLS = 18, ROWS = 18, CELL = 24, OX = 4, OY = 72;
const W = COLS * CELL + OX * 2, H = OY + ROWS * CELL + 8;
const GOOD = ['apple', 'orange', 'grape', 'carrot', 'broccoli', 'banana', 'water', 'strawberry'];
const BAD = ['soda', 'donut', 'candy', 'fries', 'cookie'];
const TIPS = { apple: 'Apples are full of fiber.', orange: 'Oranges are packed with vitamin C.', grape: 'Grapes count toward your 2 cups of fruit a day.',
  carrot: 'Carrots have vitamin A for healthy eyes.', broccoli: 'Broccoli is loaded with vitamins C and K.', banana: 'Bananas have potassium for your muscles.',
  water: 'Water keeps your brain sharp.', strawberry: 'Strawberries are full of antioxidants.' };

let snake, dir, queue, stepT, interval, food, junk, junkT, eaten, mood, moodT, grow, eatAnim;

function freeCell() {
  for (let tries = 0; tries < 500; tries++) {
    const x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
    if (snake.some(s => s.x === x && s.y === y)) continue;
    if (food && food.x === x && food.y === y) continue;
    if (junk && junk.x === x && junk.y === y) continue;
    return { x, y };
  }
  return { x: 0, y: 0 };
}
function reset(A) {
  snake = [{ x: 6, y: 9 }, { x: 5, y: 9 }, { x: 4, y: 9 }];
  dir = { x: 1, y: 0 }; queue = []; stepT = 0; interval = 0.16; grow = 0;
  food = null; junk = null; food = { ...freeCell(), kind: GOOD[Math.floor(Math.random() * GOOD.length)], t: 0 };
  junkT = 5; eaten = 0; mood = 'happy'; moodT = 0; eatAnim = 0;
}
function input(type, A) {
  const D = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }[type];
  if (!D) return;
  const lastD = queue.length ? queue[queue.length - 1] : dir;
  if (D.x === -lastD.x && D.y === -lastD.y) return;      // can't reverse into yourself
  if (D.x === lastD.x && D.y === lastD.y) return;
  if (queue.length < 2) queue.push(D);
}
function update(dt, A) {
  if (food) food.t += dt;
  if (junk) junk.t += dt;
  if (moodT > 0 && (moodT -= dt) <= 0) mood = 'happy';
  eatAnim = Math.max(0, eatAnim - dt * 4);
  if (A.state !== 'play') return;
  // junk food pops up now and then and spoils after a while
  junkT -= dt;
  if (!junk && junkT <= 0 && eaten >= 2) { junk = { ...freeCell(), kind: BAD[Math.floor(Math.random() * BAD.length)], t: 0 }; junkT = 7; }
  if (junk && junk.t > 8) { junk = null; junkT = 3 + Math.random() * 4; }

  stepT += dt;
  if (stepT < interval) return;
  stepT -= interval;
  if (queue.length) dir = queue.shift();
  const head = snake[0], nx = head.x + dir.x, ny = head.y + dir.y;
  const hitsSelf = snake.slice(0, snake.length - (grow > 0 ? 0 : 1)).some(s => s.x === nx && s.y === ny);
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || hitsSelf) {
    mood = 'ghost'; A.particles.burst(cx(head.x), cy(head.y), '#FFD700', 22, 220, 5); A.gameOver(); return;
  }
  snake.unshift({ x: nx, y: ny });
  if (grow > 0) grow--; else snake.pop();

  if (food && nx === food.x && ny === food.y) {
    eaten++; grow += 1; eatAnim = 1;
    A.addScore(10); A.sfx('coin');
    A.particles.burst(cx(nx), cy(ny), '#7CFFB2', 14, 170, 4);
    A.float('+10', cx(nx), cy(ny) - 14, '#7CFFB2');
    if (eaten % 4 === 0) A.toast('💡 ' + TIPS[food.kind]);
    food = { ...freeCell(), kind: GOOD[Math.floor(Math.random() * GOOD.length)], t: 0 };
    interval = Math.max(0.075, 0.16 - eaten * 0.0035);
  }
  if (junk && nx === junk.x && ny === junk.y) {
    A.sfx('hit'); A.shake(6, 0.2);
    A.particles.burst(cx(nx), cy(ny), '#FF5C77', 14, 170, 4);
    A.float('−2 length', cx(nx), cy(ny) - 14, '#FF8FA3');
    A.toast('🍩 Junk food slows you down!');
    for (let i = 0; i < 2 && snake.length > 3; i++) snake.pop();
    mood = 'sugar'; moodT = 1.5; junk = null; junkT = 4 + Math.random() * 4;
  }
}
const cx = x => OX + x * CELL + CELL / 2, cy = y => OY + y * CELL + CELL / 2;

function draw(ctx, A) {
  // sky band behind the score
  const g = ctx.createLinearGradient(0, 0, 0, OY);
  g.addColorStop(0, '#2b1660'); g.addColorStop(1, '#4a2a7a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // garden: checkerboard grass inside a hedge
  ctx.fillStyle = '#1f6b3a'; ctx.fillRect(0, OY - 6, W, H - OY + 6);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#3f8f4c' : '#47a056';
    ctx.fillRect(OX + x * CELL, OY + y * CELL, CELL, CELL);
  }
  ctx.strokeStyle = A.INK; ctx.lineWidth = 3; ctx.strokeRect(OX - 1.5, OY - 1.5, COLS * CELL + 3, ROWS * CELL + 3);
  // little flowers on the top hedge
  for (let i = 0; i < 9; i++) { ctx.fillStyle = ['#FFD700', '#FF8FC7', '#fff'][i % 3]; ctx.beginPath(); ctx.arc(20 + i * 50, OY - 14, 4, 0, 7); ctx.fill(); }

  // food
  if (food) {
    const b = Math.sin(food.t * 5) * 2;
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(cx(food.x), cy(food.y) + 9, 9, 3, 0, 0, 7); ctx.fill();
    ART.draw(ctx, food.kind, cx(food.x), cy(food.y) - 1 + b, 26, food.t);
  }
  if (junk) {
    const blink = junk.t > 6 && Math.floor(junk.t * 8) % 2;
    if (!blink) {
      ctx.fillStyle = 'rgba(255,59,92,.25)'; ctx.beginPath(); ctx.arc(cx(junk.x), cy(junk.y), 14, 0, 7); ctx.fill();
      ART.draw(ctx, junk.kind, cx(junk.x), cy(junk.y), 26, junk.t);
    }
  }
  // body: a chain of leafy green beads, tail to head
  for (let i = snake.length - 1; i >= 1; i--) {
    const s = snake[i], r = Math.max(6, 11 - i * 0.12);
    const pal = (window.PET_PAL || {})[A.color] || { base: '#2EE6A6', dark: '#0A8F63' };
    ctx.beginPath(); ctx.arc(cx(s.x), cy(s.y), r, 0, 7);
    A.ink(i % 2 ? pal.base : pal.dark, 2.5);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(cx(s.x) - r * 0.3, cy(s.y) - r * 0.35, r * 0.3, 0, 7); ctx.fill();
  }
  // head = your Wellness Sprite
  const h = snake[0];
  A.drawHero(cx(h.x), cy(h.y) - 2, 38 + eatAnim * 8, 0, mood);
}

window.__snake = () => ({ snake, dir, food, junk, COLS, ROWS });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Sprite Snake', subtitle: 'Grow strong in the garden!', W, H, reserveH: 70,
  storageKey: 'sprite_snake', winAt: 150, winText: 'Your sprite is a garden giant!', swipe: true,
  medals: [{ at: 50, name: 'Bronze', icon: '🥉' }, { at: 150, name: 'Silver', icon: '🥈' }, { at: 300, name: 'Gold', icon: '🥇' }, { at: 500, name: 'Legend', icon: '💎' }],
  howTo: '<b>Eat fruit and veggies</b> to grow (+10).<br><b>Junk food</b> shrinks you. Don\'t hit the hedge or your own tail!',
  controls: 'Arrow keys / WASD · swipe on phones · P = pause',
  overTitle: 'Bonk!',
  facts: [
    'Teens should aim for about 2 cups of fruit and 3 cups of veggies a day.',
    'Eating a rainbow of colors gives your body a wider mix of vitamins.',
    'Fiber from fruits and veggies keeps you full longer than sugary snacks.',
    'A medium donut can have around 10 grams of added sugar.',
    'Snacking on fruit instead of candy helps keep your energy steady.'
  ],
  reset, update, draw, input,
  pad: [{ label: '◀', type: 'left' }, { label: '▲', type: 'up' }, { label: '▼', type: 'down' }, { label: '▶', type: 'right' }]
});
})();
</script>
</body>
