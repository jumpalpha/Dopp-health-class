<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Sprite Maze — Dopp's Arcade</title>
<meta name="description" content="Guide your Wellness Sprite through the maze collecting water drops while junk-food monsters give chase. Grab an apple to turn the tables!">
<link rel="canonical" href="https://doppsclass.com/dopp_pacman.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2305070F%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2746%27%20font-size%3D%2736%27%20text-anchor%3D%27middle%27%20fill%3D%27%23FFD700%27%3E%26%239876%3B%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,#0a0618 70%) fixed;color:#f4efff;font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto;padding:10px 16px}
.top a{color:#FFD700;font-weight:800;text-decoration:none}
.top h1{font-family:Cinzel,serif;font-size:20px;color:#FFD700;text-shadow:0 2px 0 #000}
#game{padding:0 8px 16px}
</style>
</head>
<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Sprite Maze</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const MAP = [
  "###################",
  "#o.......#.......o#",
  "#.##.###.#.###.##.#",
  "#.................#",
  "#.##.#.#####.#.##.#",
  "#....#...#...#....#",
  "####.###.#.###.####",
  "####.#.......#.####",
  "####.#.##-##.#.####",
  ".......#GGG#.......",
  "####.#.#####.#.####",
  "####.#.......#.####",
  "####.#.#####.#.####",
  "#........#........#",
  "#.##.###.#.###.##.#",
  "#o.#.....P.....#.o#",
  "##.#.#.#####.#.#.##",
  "#....#...#...#....#",
  "#.######.#.######.#",
  "#.................#",
  "###################"
];
const COLS = 19, ROWS = 21, CELL = 21, OX = 10, OY = 84;
const W = COLS * CELL + OX * 2, H = OY + ROWS * CELL + 14;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const GHOSTS = [
  { art: 'soda', name: 'Soda', color: '#FF5C77', start: [9, 7], release: 0, corner: [17, 1] },
  { art: 'candy', name: 'Candy', color: '#FF7AB6', start: [8, 9], release: 4, corner: [1, 1] },
  { art: 'burger', name: 'Burger', color: '#E9A44C', start: [9, 9], release: 9, corner: [17, 19] },
  { art: 'donut', name: 'Donut', color: '#B57CFF', start: [10, 9], release: 15, corner: [1, 19] }
];
const TIPS = ['Water is the #1 drink for staying sharp.', 'Apples give natural sugar plus fiber.', 'Sugary drinks are the biggest source of added sugar for teens.',
  'Fast food once in a while is fine; every day adds up.', 'Choosing water over soda can save over 100 calories a can.'];

let grid, dots, player, ghosts, lives, level, scaredT, combo, modeT, chase, readyT, deathAnim, t;

function cellAt(x, y) { if (x < 0 || x >= COLS) return ' '; return grid[y] ? grid[y][x] : '#'; }
function openFor(x, y, isGhost, leaving) {
  x = (x + COLS) % COLS; const c = cellAt(x, y);
  if (c === '#') return false;
  if (c === '-') return isGhost && leaving;
  return true;
}
function loadLevel() {
  grid = MAP.map(r => r.split('')); dots = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = grid[y][x];
    if (c === 'P' || c === 'G') grid[y][x] = ' ';
    if (c === '.' || c === 'o') dots++;
  }
}
function placeActors() {
  player = { x: 9, y: 15, dir: null, want: null, p: 0, mouth: 0, face: 1 };
  ghosts = GHOSTS.map((g, i) => ({ ...g, x: g.start[0], y: g.start[1], dir: i === 0 ? 'left' : 'up', p: 0, home: i !== 0, wait: g.release, eaten: false, eatenT: 0, bob: Math.random() * 6 }));
  scaredT = 0; combo = 0; modeT = 0; chase = false; readyT = 1.6; deathAnim = 0;
}
function reset(A) { lives = 3; level = 1; t = 0; loadLevel(); placeActors(); }
function input(type) {
  if (DIRS[type]) {
    player.want = type;
    // instant reverse feels responsive
    if (player.dir && DIRS[type][0] === -DIRS[player.dir][0] && DIRS[type][1] === -DIRS[player.dir][1] && player.p > 0) {
      player.x += DIRS[player.dir][0]; player.y += DIRS[player.dir][1]; player.x = (player.x + COLS) % COLS;
      player.p = 1 - player.p; player.dir = type;
    }
  }
}
// position helpers: an actor sits on tile (x,y) moving toward the next tile by progress p (0..1)
function pos(a) { const d = a.dir ? DIRS[a.dir] : [0, 0]; let px = a.x + d[0] * a.p, py = a.y + d[1] * a.p; if (px < -0.5) px += COLS; if (px > COLS - 0.5) px -= COLS; return [OX + px * CELL + CELL / 2, OY + py * CELL + CELL / 2, px, py]; }

function stepPlayer(dt, A) {
  const sp = (6.2 + level * 0.25) * (scaredT > 0 ? 1.08 : 1);
  let move = sp * dt;
  while (move > 0) {
    if (player.p === 0) {
      // at a tile centre: eat, then choose direction
      const c = cellAt(player.x, player.y);
      if (c === '.' || c === 'o') {
        grid[player.y][player.x] = ' '; dots--;
        const [px, py] = pos(player);
        if (c === '.') { A.addScore(10); if (dots % 2) A.sfx('point'); }
        else { A.addScore(50); A.sfx('medal'); scaredT = Math.max(3, 7 - level * 0.6); combo = 0; A.toast('🍎 Apple power! Chase the junk food!'); ghosts.forEach(g => { if (g.home || g.eaten) return; if (g.p > 0) { g.x = (g.x + DIRS[g.dir][0] + COLS) % COLS; g.y += DIRS[g.dir][1]; g.p = 1 - g.p; } g.dir = rev(g.dir); }); A.particles.burst(px, py, '#FF5C77', 14, 160, 4); }
        if (dots <= 0) { levelClear(A); return; }
      }
      if (player.want && openFor(player.x + DIRS[player.want][0], player.y + DIRS[player.want][1], false)) player.dir = player.want;
      if (!player.dir || !openFor(player.x + DIRS[player.dir][0], player.y + DIRS[player.dir][1], false)) { player.dir = player.dir; return; }
    }
    const need = 1 - player.p;
    if (move >= need) {
      move -= need; player.p = 0;
      player.x = (player.x + DIRS[player.dir][0] + COLS) % COLS; player.y += DIRS[player.dir][1];
    } else { player.p += move; move = 0; }
  }
}
function rev(d) { return { up: 'down', down: 'up', left: 'right', right: 'left' }[d]; }
function targetFor(g, i) {
  if (!chase && !g.eaten) return g.corner;
  const pd = player.dir ? DIRS[player.dir] : [0, 0];
  if (i === 0) return [player.x, player.y];
  if (i === 1) return [player.x + pd[0] * 4, player.y + pd[1] * 4];
  if (i === 2) { const d = Math.hypot(g.x - player.x, g.y - player.y); return d > 6 ? [player.x, player.y] : g.corner; }
  return [player.x - pd[0] * 3 + (Math.sin(t) > 0 ? 3 : -3), player.y];
}
function stepGhost(g, i, dt, A) {
  if (g.eaten) { g.eatenT -= dt; if (g.eatenT <= 0) { g.eaten = false; g.x = 9; g.y = 9; g.p = 0; g.home = true; g.wait = 1.5; g.dir = 'up'; } return; }
  if (g.home) {
    g.wait -= dt; g.bob += dt * 6;
    if (g.wait <= 0) { g.home = false; g.x = 9; g.y = 7; g.p = 0; g.dir = Math.random() < 0.5 ? 'left' : 'right'; }
    return;
  }
  const scared = scaredT > 0;
  const sp = scared ? 3.2 : (3.9 + level * 0.4 + (i === 0 && dots < 25 ? 0.5 : 0));
  let move = sp * dt;
  // slow down in the side tunnel
  if (g.y === 9 && (g.x < 3 || g.x > 15)) move *= 0.55;
  while (move > 0) {
    if (g.p === 0) {
      const opts = Object.keys(DIRS).filter(d => d !== rev(g.dir) && openFor(g.x + DIRS[d][0], g.y + DIRS[d][1], true, false));
      if (!opts.length) opts.push(rev(g.dir));
      if (scared) g.dir = opts[Math.floor(Math.random() * opts.length)];
      else {
        const [tx, ty] = targetFor(g, i);
        g.dir = opts.sort((a, b) => Math.hypot(g.x + DIRS[a][0] - tx, g.y + DIRS[a][1] - ty) - Math.hypot(g.x + DIRS[b][0] - tx, g.y + DIRS[b][1] - ty))[0];
      }
    }
    const need = 1 - g.p;
    if (move >= need) { move -= need; g.p = 0; g.x = (g.x + DIRS[g.dir][0] + COLS) % COLS; g.y += DIRS[g.dir][1]; }
    else { g.p += move; move = 0; }
  }
}
function levelClear(A) {
  A.addScore(500 * level); A.sfx('win');
  A.float('Maze clear! +' + 500 * level, W / 2, OY + 200, '#FFD700');
  if (level === 1) A.win('You cleared the maze!');
  else A.toast('💡 ' + TIPS[level % TIPS.length], 2400);
  level++; loadLevel(); placeActors();
}
function caught(A) {
  lives--; A.sfx('hit'); A.shake(10, 0.3); deathAnim = 1;
  if (lives <= 0) { A.gameOver(); return; }
  A.toast('💔 ' + lives + (lives === 1 ? ' life' : ' lives') + ' left');
  setTimeout(() => { if (A.state === 'play') placeActors(); }, 900);
}

function update(dt, A) {
  t += dt; player.mouth += dt * 10;
  ghosts.forEach(g => g.bob += dt * 4);
  if (deathAnim > 0) { deathAnim = Math.max(0, deathAnim - dt * 1.1); return; }
  if (A.state !== 'play') return;
  if (readyT > 0) { readyT -= dt; return; }
  scaredT = Math.max(0, scaredT - dt);
  if (!scaredT) { modeT += dt; const cyc = modeT % 22; chase = cyc > 8 + Math.max(0, 3 - level); }
  stepPlayer(dt, A);
  if (A.state !== 'play' || readyT > 0) return;
  const [ppx, ppy] = pos(player);
  ghosts.forEach((g, i) => {
    stepGhost(g, i, dt, A);
    if (g.home || g.eaten) return;
    const [gx, gy] = pos(g);
    if (Math.hypot(gx - ppx, gy - ppy) < CELL * 0.62) {
      if (scaredT > 0) {
        combo++; const pts = 200 * Math.pow(2, combo - 1); A.addScore(pts); A.sfx('coin');
        A.float(g.name + ' +' + pts, gx, gy - 10, '#7CFFB2'); A.particles.burst(gx, gy, g.color, 18, 220, 4);
        g.eaten = true; g.eatenT = 3;
      } else if (deathAnim === 0) caught(A);
    }
  });
  player.face = player.dir === 'left' ? -1 : player.dir === 'right' ? 1 : player.face;
}

function draw(ctx, A) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2b1660'); g.addColorStop(1, '#140c36');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!grid) return;
  // HUD
  for (let i = 0; i < lives; i++) ART.draw(ctx, 'heart', 66 + i * 22, 72, 18);
  ctx.fillStyle = '#b9b0d6'; ctx.font = '900 14px Nunito,sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(dots + ' drops left', W - 60, 77);
  // maze walls: chunky hedge blocks
  ctx.fillStyle = '#0f0a22'; ctx.fillRect(OX, OY, COLS * CELL, ROWS * CELL);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = grid[y][x], px = OX + x * CELL, py = OY + y * CELL;
    if (c === '#') {
      ctx.fillStyle = '#3a2a8a'; ctx.fillRect(px, py, CELL, CELL);
      ctx.fillStyle = '#5b46c9';
      if (cellAt(x, y - 1) !== '#') ctx.fillRect(px, py, CELL, 4);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      if (cellAt(x, y + 1) !== '#') ctx.fillRect(px, py + CELL - 3, CELL, 3);
    } else if (c === '-') { ctx.fillStyle = '#FF8FC7'; ctx.fillRect(px + 2, py + CELL / 2 - 2, CELL - 4, 4); }
    else if (c === '.') { ctx.fillStyle = '#7fd5ff'; ctx.beginPath(); ctx.arc(px + CELL / 2, py + CELL / 2, 2.8, 0, 7); ctx.fill(); }
    else if (c === 'o') ART.draw(ctx, 'apple', px + CELL / 2, py + CELL / 2 + Math.sin(t * 5) * 1.5, 20, t);
  }
  ctx.strokeStyle = A.INK; ctx.lineWidth = 3; ctx.strokeRect(OX - 1.5, OY - 1.5, COLS * CELL + 3, ROWS * CELL + 3);

  // ghosts: junk-food monsters
  ghosts.forEach((gh, i) => {
    if (gh.eaten) return;
    let [x, y] = pos(gh);
    if (gh.home) { x = OX + gh.start[0] * CELL + CELL / 2; y = OY + gh.start[1] * CELL + CELL / 2 + Math.sin(gh.bob) * 3; }
    const sc = scaredT > 0 && !gh.home;
    const flash = sc && scaredT < 2 && Math.floor(t * 8) % 2;
    ctx.save();
    if (sc) { ctx.globalAlpha = 0.9; ctx.fillStyle = flash ? '#fff' : '#4CC4FF'; ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fill(); }
    ctx.restore();
    ART.draw(ctx, gh.art, x, y + Math.sin(gh.bob) * 1.5, sc ? 18 : 24, t);
    // eyes
    const ex = gh.dir ? DIRS[gh.dir][0] * 1.5 : 0, ey = gh.dir ? DIRS[gh.dir][1] * 1.5 : 0;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 4, y - 9, 3.2, 0, 7); ctx.arc(x + 4, y - 9, 3.2, 0, 7); ctx.fill();
    ctx.strokeStyle = A.INK; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = sc ? '#1676A8' : A.INK; ctx.beginPath(); ctx.arc(x - 4 + ex, y - 9 + ey, 1.6, 0, 7); ctx.arc(x + 4 + ex, y - 9 + ey, 1.6, 0, 7); ctx.fill();
  });
  // player = your sprite
  const [px, py] = pos(player);
  const mood = deathAnim > 0 || A.state === 'dying' || A.state === 'over' ? 'ghost' : scaredT > 0 ? 'happy' : 'happy';
  const squish = player.dir ? Math.abs(Math.sin(player.mouth)) * 0.08 : 0;
  ctx.save(); ctx.translate(px, py); ctx.scale(player.face * (1 + squish), 1 - squish);
  A.drawHero(0, -1, 30 + (scaredT > 0 ? 4 : 0), deathAnim * 6, mood);
  ctx.restore();
  if (scaredT > 0) { ctx.strokeStyle = 'rgba(255,92,119,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, 18 + Math.sin(t * 10) * 2, 0, 7); ctx.stroke(); }

  if (readyT > 0 && A.state === 'play') {
    ctx.textAlign = 'center'; ctx.font = '900 26px Cinzel,serif'; ctx.lineWidth = 5; ctx.strokeStyle = A.INK;
    const txt = level > 1 ? 'Level ' + level + '!' : 'Ready!';
    ctx.strokeText(txt, W / 2, OY + 12 * CELL + 6); ctx.fillStyle = '#FFD700'; ctx.fillText(txt, W / 2, OY + 12 * CELL + 6);
  }
}

window.__maze = () => ({ grid, player, ghosts, dots, lives, level, scaredT, COLS, ROWS, readyT, openFor });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Sprite Maze', subtitle: 'Drink up, dodge the junk!', W, H, reserveH: 70,
  storageKey: 'sprite_maze', winText: 'You cleared the maze!', swipe: true, deathDelay: 1000,
  medals: [{ at: 1000, name: 'Bronze', icon: '🥉' }, { at: 2500, name: 'Silver', icon: '🥈' }, { at: 5000, name: 'Gold', icon: '🥇' }, { at: 9000, name: 'Legend', icon: '💎' }],
  howTo: 'Collect every 💧 water drop. Junk-food monsters chase you!<br>Eat an 🍎 <b>apple</b> to turn the tables. <b>Clear the maze</b> to win!',
  controls: 'Arrow keys / WASD · swipe on phones · P pause',
  overTitle: 'Caught by junk food!',
  facts: [
    'Teens need about 8 to 11 cups of water a day from drinks and food.',
    'Even mild dehydration can make it harder to concentrate.',
    'One large fast-food soda can have more than 60 grams of sugar.',
    'Keeping a water bottle with you makes it easy to drink enough.',
    'Fruit like apples and watermelon also help you stay hydrated.'
  ],
  reset, update, draw, input,
  pad: [{ label: '◀', type: 'left' }, { label: '▲', type: 'up' }, { label: '▼', type: 'down' }, { label: '▶', type: 'right' }]
});
})();
</script>
</body>
</html>
