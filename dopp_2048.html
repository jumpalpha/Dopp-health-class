<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Snack 2048 — Dopp's Arcade</title>
<meta name="description" content="Slide and combine healthy snacks to grow your way up to the Wellness Sprite tile. A health-themed 2048.">
<link rel="canonical" href="https://doppsclass.com/dopp_2048.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2305070F%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2746%27%20font-size%3D%2736%27%20text-anchor%3D%27middle%27%20fill%3D%27%23FFD700%27%3E%26%239876%3B%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,#0a0618 70%) fixed;color:#f4efff;font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto;padding:10px 16px}
.top a{color:#FFD700;font-weight:800;text-decoration:none}
.top h1{font-family:Cinzel,serif;font-size:20px;color:#FFD700;text-shadow:0 2px 0 #000}
#game{padding:0 8px 16px}
</style>
</head>
<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Snack 2048</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const W = 420, H = 620, N = 4, BX = 20, BY = 120, BS = 380, GAP = 10, CS = (BS - GAP * 5) / 4;
// each level of the tile ladder is a healthier snack, all the way up to your Wellness Sprite
const LADDER = {
  2: { art: 'water', name: 'Water', bg: '#1d3a63' }, 4: { art: 'apple', name: 'Apple', bg: '#5a1f36' }, 8: { art: 'orange', name: 'Orange', bg: '#5a3a1a' },
  16: { art: 'carrot', name: 'Carrot', bg: '#5a3216' }, 32: { art: 'broccoli', name: 'Broccoli', bg: '#1d4a2c' }, 64: { art: 'banana', name: 'Banana', bg: '#5a4c14' },
  128: { art: 'grape', name: 'Grapes', bg: '#3e2366' }, 256: { art: 'strawberry', name: 'Berry', bg: '#661f3a' }, 512: { art: 'heart', name: 'Healthy Heart', bg: '#7a1f33' },
  1024: { art: 'star', name: 'Wellness Star', bg: '#7a5a00' }, 2048: { art: 'sprite', name: 'Peak Health!', bg: '#0f6b4a' }
};
const TIPS = { 32: 'Broccoli has vitamin C, vitamin K and fiber.', 64: 'Bananas have potassium for your muscles.', 128: 'Grapes count toward your 2 cups of fruit a day.',
  256: 'Berries are full of antioxidants.', 512: 'Healthy eating + activity = a healthy heart!', 1024: 'You\'re a Wellness Star!' };

let tiles, nextId, anim, best, moved, over, spr;
function cellXY(r, c) { return [BX + GAP + c * (CS + GAP), BY + GAP + r * (CS + GAP)]; }
function empty() { const e = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!tiles.some(t => !t.gone && t.r === r && t.c === c)) e.push([r, c]); return e; }
function spawn() { const e = empty(); if (!e.length) return; const [r, c] = e[Math.floor(Math.random() * e.length)]; const [x, y] = cellXY(r, c); tiles.push({ id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r, c, x, y, pop: 0.01 }); }
function reset(A) { tiles = []; nextId = 1; anim = 0; best = 2; over = false; spr = { t: 0, jump: 0 }; spawn(); spawn(); }
function canMove() {
  if (empty().length) return true;
  const at = (r, c) => tiles.find(t => !t.gone && t.r === r && t.c === c);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const t = at(r, c); if ((c < 3 && at(r, c + 1).v === t.v) || (r < 3 && at(r + 1, c).v === t.v)) return true; }
  return false;
}
function slide(dir, A) {
  if (anim > 0 || over || A.state !== 'play') return;
  const vec = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] }[dir]; if (!vec) return;
  tiles = tiles.filter(t => !t.gone); tiles.forEach(t => { t.merged = false; });
  const at = (r, c) => tiles.find(t => !t.gone && t.r === r && t.c === c);
  const order = [0, 1, 2, 3]; const rs = vec[0] === 1 ? order.slice().reverse() : order, cs = vec[1] === 1 ? order.slice().reverse() : order;
  let any = false, gained = 0;
  for (const r of rs) for (const c of cs) {
    const t = at(r, c); if (!t) continue;
    let nr = r, nc = c;
    while (true) {
      const tr = nr + vec[0], tc = nc + vec[1]; if (tr < 0 || tr >= N || tc < 0 || tc >= N) break;
      const o = at(tr, tc);
      if (!o) { nr = tr; nc = tc; continue; }
      if (o.v === t.v && !o.merged && !o.dying) { nr = tr; nc = tc; o.dying = true; t.mergeInto = o; }
      break;
    }
    if (nr !== r || nc !== c) { any = true; t.r = nr; t.c = nc; }
    if (t.mergeInto) {
      const o = t.mergeInto; t.mergeInto = null; t.v *= 2; t.merged = true; t.pop = 0.01; o.gone = true; gained += t.v;
      if (t.v > best) { best = t.v; if (TIPS[t.v]) A.toast('💡 ' + TIPS[t.v], 2400); if (t.v >= 128) { spr.jump = 1; A.sfx('medal'); } if (t.v === 512) A.win('You reached the Healthy Heart tile!'); if (t.v === 2048) A.toast('🏆 PEAK HEALTH! You made the Sprite tile!', 3000); }
      any = true;
    }
  }
  tiles.forEach(t => t.dying = false);
  if (!any) return;
  if (gained) { A.addScore(gained); A.sfx('coin'); } else A.sfx('swipe');
  anim = 0.11;
  setTimeout(() => { spawn(); if (!canMove()) { over = true; setTimeout(() => A.gameOver(true), 900); } }, 120);
}
function input(type, A) { slide(type, A); }
function update(dt, A) {
  if (!tiles) return;
  spr.t += dt; spr.jump = Math.max(0, spr.jump - dt * 2);
  anim = Math.max(0, anim - dt);
  tiles.forEach(t => {
    const [tx, ty] = cellXY(t.r, t.c), k = Math.min(1, dt * 30);
    t.x += (tx - t.x) * k; t.y += (ty - t.y) * k;
    if (t.pop) { t.pop += dt * 6; if (t.pop >= 1) t.pop = 0; }
  });
  tiles = tiles.filter(t => !(t.gone && Math.abs(t.x - cellXY(t.r, t.c)[0]) < 1 && Math.abs(t.y - cellXY(t.r, t.c)[1]) < 1));
}
function draw(ctx, A) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2b1660'); g.addColorStop(1, '#140c36');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!tiles) return;
  ctx.font = '900 13px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#b9b0d6';
  ctx.fillText('Best tile: ' + LADDER[best].name + ' (' + best + ')   ·   Goal: Healthy Heart (512)', W / 2, 100);
  A.rr(BX, BY, BS, BS, 18); A.ink('#0f0a22', 3);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const [x, y] = cellXY(r, c); A.rr(x, y, CS, CS, 12); ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill(); }
  tiles.slice().sort((a, b) => (a.gone ? 0 : 1) - (b.gone ? 0 : 1)).forEach(t => {
    const L = LADDER[t.v] || LADDER[2048], s = t.pop ? 1 + Math.sin(t.pop * Math.PI) * 0.12 : 1;
    ctx.save(); ctx.translate(t.x + CS / 2, t.y + CS / 2); ctx.scale(s, s);
    A.rr(-CS / 2, -CS / 2, CS, CS, 12); A.ink(L.bg, 3);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(-CS / 2 + 8, -CS / 2 + 6, CS - 16, 6);
    if (L.art === 'sprite') A.drawHero(0, -6, CS * 0.62, 0, 'happy'); else ART.draw(ctx, L.art, 0, -8, CS * 0.5, spr.t);
    ctx.fillStyle = '#fff'; ctx.font = '900 ' + (t.v >= 1000 ? 13 : 15) + 'px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t.v, 0, CS / 2 - 10);
    ctx.restore();
  });
  // ladder legend
  const vals = [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048], lw = (W - 40) / vals.length;
  ctx.fillStyle = '#b9b0d6'; ctx.font = '800 11px Nunito,sans-serif'; ctx.fillText('Snack ladder', W / 2, BY + BS + 26);
  vals.forEach((v, i) => {
    const x = 20 + lw * i + lw / 2, y = BY + BS + 50, L = LADDER[v];
    ctx.globalAlpha = v <= best ? 1 : 0.3;
    if (L.art === 'sprite') A.drawHero(x, y, 28, 0, 'happy'); else ART.draw(ctx, L.art, x, y, 22, 0);
    ctx.globalAlpha = 1;
  });
  A.drawHero(W - 44, 82 - spr.jump * 14 + Math.sin(spr.t * 3) * 2, 34, 0, over ? 'tired' : 'happy');
  if (over) { ctx.fillStyle = 'rgba(10,6,24,.6)'; ctx.fillRect(BX, BY, BS, BS); ctx.fillStyle = '#FFD700'; ctx.font = '900 30px Cinzel,serif'; ctx.fillText('No moves left!', W / 2, BY + BS / 2); }
}

window.__g48 = () => ({ tiles: tiles.filter(t => !t.gone).map(t => ({ r: t.r, c: t.c, v: t.v })), best, over, anim, set: g => { tiles = []; g.forEach((row, r) => row.forEach((v, c) => { if (v) { const [x, y] = cellXY(r, c); tiles.push({ id: nextId++, v, r, c, x, y, pop: 0 }); } })); } });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Snack 2048', subtitle: 'Merge snacks up to Peak Health!', W, H, reserveH: 70,
  storageKey: 'snack_2048', winText: 'You reached the Healthy Heart tile!', swipe: true, deathDelay: 400, overTitle: 'Board full!',
  medals: [{ at: 2000, name: 'Bronze', icon: '🥉' }, { at: 6000, name: 'Silver', icon: '🥈' }, { at: 12000, name: 'Gold', icon: '🥇' }, { at: 22000, name: 'Legend', icon: '💎' }],
  howTo: 'Slide the board. Two matching snacks <b>merge</b> into the next one up the ladder.<br>Reach the ❤️ <b>Healthy Heart (512)</b> to win. Can you make the Sprite tile?',
  controls: 'Arrow keys / WASD · swipe on phones · P pause',
  facts: [
    'Planning ahead in puzzles uses the same skills as planning healthy meals.',
    'Eating a variety of fruits and veggies gives you a wide range of vitamins.',
    'Water is the best everyday drink for your body.',
    'Strategy games can improve problem-solving and memory.',
    'Small healthy choices "merge" into big health benefits over time.'
  ],
  reset, update, draw, input
});
})();
</script>
</body>
</html>
