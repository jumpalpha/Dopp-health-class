<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Sprite Catch — Dopp's Arcade</title>
<meta name="description" content="Catch the falling fruits and veggies with your Wellness Sprite and dodge the junk food. Build combos for big points.">
<link rel="canonical" href="https://doppsclass.com/dopp_drop.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2305070F%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2746%27%20font-size%3D%2736%27%20text-anchor%3D%27middle%27%20fill%3D%27%23FFD700%27%3E%26%239876%3B%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,#0a0618 70%) fixed;color:#f4efff;font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto;padding:10px 16px}
.top a{color:#FFD700;font-weight:800;text-decoration:none}
.top h1{font-family:Cinzel,serif;font-size:20px;color:#FFD700;text-shadow:0 2px 0 #000}
#game{padding:0 8px 16px}
</style>
</head>
<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Sprite Catch</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const W = 420, H = 640, FLOOR = 590;
const GOOD = ART.HEALTHY, BAD = ART.JUNK;
const FACTS = { apple: 'Apples are full of fiber.', orange: 'Oranges are packed with vitamin C.', grape: 'Grapes count toward your fruit for the day.', carrot: 'Carrots help keep your eyes healthy.',
  broccoli: 'Broccoli is loaded with vitamins C and K.', banana: 'Bananas give quick energy and potassium.', water: 'Water keeps your brain sharp.', strawberry: 'Berries are full of antioxidants.' };
let me, items, spawnT, lives, combo, bestCombo, keys, aimX, magnetT, t, caught;

function reset(A) { me = { x: W / 2, squash: 0, mood: 'happy', moodT: 0 }; items = []; spawnT = 0.6; lives = 3; combo = 0; bestCombo = 0; keys = {}; aimX = null; magnetT = 0; t = 0; caught = 0; }
function input(type) { if (type === 'left' || type === 'right') { keys[type] = true; aimX = null; } else if (type === 'release-left' || type === 'release-right') keys[type.slice(8)] = false; }
function pointer(type, x) { aimX = x; }
function update(dt, A) {
  if (!me) return;
  t += dt; me.squash = Math.max(0, me.squash - dt * 4);
  if (me.moodT > 0 && (me.moodT -= dt) <= 0) me.mood = 'happy';
  items.forEach(it => it.rot += it.spin * dt);
  if (A.state !== 'play') { if (A.state === 'menu') me.x = W / 2 + Math.sin(t) * 100; return; }
  magnetT = Math.max(0, magnetT - dt);
  const level = Math.min(10, A.time / 12);
  // move
  if (keys.left) me.x -= 360 * dt; if (keys.right) me.x += 360 * dt;
  if (aimX != null) me.x += (aimX - me.x) * Math.min(1, dt * 16);
  me.x = Math.max(30, Math.min(W - 30, me.x));
  // spawn
  spawnT -= dt;
  if (spawnT <= 0) {
    const r = Math.random(), bad = r < Math.min(0.42, 0.18 + level * 0.025), power = !bad && Math.random() < 0.035;
    items.push({ x: 30 + Math.random() * (W - 60), y: 40, vy: 150 + level * 26 + Math.random() * 50, kind: power ? 'star' : bad ? BAD[Math.floor(Math.random() * BAD.length)] : GOOD[Math.floor(Math.random() * GOOD.length)], bad, power, rot: 0, spin: (Math.random() - 0.5) * 3 });
    spawnT = Math.max(0.32, 0.85 - level * 0.05) * (0.7 + Math.random() * 0.6);
  }
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (magnetT > 0 && !it.bad && it.y > 200) it.x += (me.x - it.x) * Math.min(1, dt * 3);
    it.y += it.vy * dt;
    if (it.y > FLOOR - 60 && it.y < FLOOR - 20 && Math.abs(it.x - me.x) < 38) {
      items.splice(i, 1); me.squash = 1;
      if (it.bad) {
        lives--; combo = 0; A.sfx('hit'); A.shake(8, 0.25); me.mood = 'sugar'; me.moodT = 1.2;
        A.particles.burst(it.x, FLOOR - 50, '#FF8FA3', 16, 200, 4); A.float('Junk! −1 ❤', it.x, FLOOR - 60, '#FF8FA3');
        if (lives <= 0) { A.gameOver(); return; }
      } else if (it.power) {
        magnetT = 8; A.sfx('medal'); A.toast('🧲 Healthy magnet! Fruit flies to you for 8s');
      } else {
        combo++; bestCombo = Math.max(bestCombo, combo); caught++;
        const mult = combo >= 20 ? 4 : combo >= 10 ? 3 : combo >= 5 ? 2 : 1, pts = 10 * mult;
        A.addScore(pts); A.sfx(mult > 1 ? 'coin' : 'point');
        A.particles.burst(it.x, FLOOR - 50, '#7CFFB2', 8, 150, 3); A.float('+' + pts, it.x, FLOOR - 60, mult > 1 ? '#FFD700' : '#7CFFB2');
        if (combo === 5 || combo === 10 || combo === 20) A.toast('🔥 ' + combo + ' combo! ×' + mult);
        if (caught % 15 === 0) A.toast('💡 ' + FACTS[it.kind], 2200);
      }
      continue;
    }
    if (it.y > H + 30) { items.splice(i, 1); if (!it.bad && !it.power && combo > 0) { combo = 0; A.float('combo lost', it.x, FLOOR - 20, '#b9b0d6'); } }
  }
}
function draw(ctx, A) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5fb6ff'); g.addColorStop(0.75, '#cfeeff'); g.addColorStop(0.75, '#6fd16b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // orchard trees in the back
  [[40, 0.9], [140, 1.1], [260, 0.95], [370, 1.05]].forEach(([x, s]) => { ctx.fillStyle = '#7a5230'; ctx.fillRect(x - 6 * s, 440 - 70 * s, 12 * s, 80 * s); ctx.fillStyle = '#4fb85a'; ctx.beginPath(); ctx.arc(x, 420 - 80 * s, 48 * s, 0, 7); ctx.fill(); ctx.fillStyle = '#FF5C77'; [[-20, -10], [15, 5], [0, -30]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(x + dx * s, 420 - 80 * s + dy * s, 5 * s, 0, 7); ctx.fill(); }); });
  ctx.fillStyle = '#5cbf5a'; ctx.fillRect(0, 480, W, H - 480);
  ctx.fillStyle = '#4aa84a'; for (let x = 0; x < W; x += 24) { ctx.beginPath(); ctx.moveTo(x, 486); ctx.lineTo(x + 6, 474); ctx.lineTo(x + 12, 486); ctx.fill(); }
  if (!me) return;
  items.forEach(it => {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
    if (it.bad) { ctx.fillStyle = 'rgba(255,59,92,.25)'; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill(); }
    if (it.power) { ctx.fillStyle = 'rgba(255,215,0,.35)'; ctx.beginPath(); ctx.arc(0, 0, 24 + Math.sin(t * 10) * 3, 0, 7); ctx.fill(); }
    ART.draw(ctx, it.kind, 0, 0, 34, t); ctx.restore();
  });
  // sprite with a basket
  const sq = me.squash;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(me.x, FLOOR + 14, 30, 6, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(me.x, FLOOR); ctx.scale(1 + sq * 0.12, 1 - sq * 0.12);
  A.drawHero(0, -12, 96, 0, me.mood);
  ctx.beginPath(); ctx.moveTo(-36, -60); ctx.lineTo(36, -60); ctx.lineTo(28, -36); ctx.lineTo(-28, -36); ctx.closePath(); A.ink('#C98B4E', 3);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 16, -60); ctx.lineTo(i * 13, -36); ctx.stroke(); }
  ctx.restore();
  if (magnetT > 0) { ctx.strokeStyle = 'rgba(255,215,0,' + (0.4 + Math.sin(t * 12) * 0.3) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(me.x, FLOOR - 30, 56, 0, 7); ctx.stroke(); }
  // HUD
  ctx.font = '900 15px Nunito,sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#FF3B5C'; ctx.fillText('❤'.repeat(Math.max(0, lives)), 62, 80);
  if (combo >= 2) { ctx.textAlign = 'right'; ctx.fillStyle = '#1A1030'; ctx.fillText('🔥 ' + combo + ' combo', W - 62, 80); }
}

window.__catch = () => ({ me, items, lives, combo, aim: x => { aimX = x; } });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Sprite Catch', subtitle: 'Catch the good stuff!', W, H, reserveH: 70,
  storageKey: 'sprite_catch', winAt: 1000, winText: 'You caught 1,000 points of healthy food!', deathDelay: 800, overTitle: 'Too much junk!',
  medals: [{ at: 400, name: 'Bronze', icon: '🥉' }, { at: 1000, name: 'Silver', icon: '🥈' }, { at: 2200, name: 'Gold', icon: '🥇' }, { at: 4000, name: 'Legend', icon: '💎' }],
  howTo: 'Catch falling <b>fruits and veggies</b> in your basket. Catch in a row for combos!<br>Junk food costs a heart. ⭐ = healthy magnet. <b>1,000 points</b> wins.',
  controls: 'Move mouse / drag finger · or ← → · P pause',
  facts: [
    'Teens need about 2 cups of fruit and 3 cups of vegetables each day.',
    'Eating fruits of different colors gives you different vitamins.',
    'Whole fruit has fiber that juice doesn\'t.',
    'Keeping fruit where you can see it makes you more likely to eat it.',
    'Junk food is fine sometimes; it\'s the everyday habits that matter most.'
  ],
  reset, update, draw, input, pointer,
  pad: [{ label: '◀', type: 'left', wide: true }, { label: '▶', type: 'right', wide: true }]
});
})();
</script>
</body>
</html>
