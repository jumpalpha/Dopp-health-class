function _beep(freq,dur,type,delay){delay=delay||0;try{const ctx=_beep.ctx||(_beep.ctx=new (window.AudioContext||window.webkitAudioContext)());const o=ctx.createOscillator();const g=ctx.createGain();o.type=type||'sine';o.frequency.value=freq;const t0=ctx.currentTime+delay;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.15,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.05);}catch(e){}}

function _sndEscaped(){[392,349.23,311.13,261.63].forEach((f,i)=>_beep(f,0.25,'triangle',i*0.15));}

function assignRoles(){
  const wrongPool=_shuf(STATEMENTS.filter(s=>s.wrong));
  const truePool=STATEMENTS.filter(s=>!s.wrong);
  imposterIdx=Math.floor(Math.random()*6);
  const imposterStmts=wrongPool.slice(0,2);
  const rest=_shuf([...wrongPool.slice(2),...truePool]);
  imposterStmts.forEach(s=>{s.speaker=imposterIdx;});
  const others=[0,1,2,3,4,5].filter(i=>i!==imposterIdx);
  others.forEach((p,idx)=>{rest[idx*2].speaker=p;rest[idx*2+1].speaker=p;});
  const order=_shuf([...imposterStmts,...rest]);
  STATEMENTS.length=0;
  order.forEach(s=>STATEMENTS.push(s));
}

        ${(suspicion[i].busted||suspicion[i].verified)?`<div class="suspicion-row">${suspicion[i].busted?`<span class="susp-bad">🚫${suspicion[i].busted}</span>`:''}${suspicion[i].verified?`<span class="susp-good">✓${suspicion[i].verified}</span>`:''}</div>`:''}

      <div class="statement-from"><span class="avatar-sm">${AVATARS[stmt.speaker]}</span><strong style="color:#e5e7eb">${NAMES[stmt.speaker]}</strong> <span style="color:#6b7280">says:</span></div>
      <div class="statement-text${stmt.wrong?' wrong':''}">"${stmt.text}"</div>

    </div>
    <div class="status" id="status">${isRevealed?(stmt.wrong?'MISINFORMATION DETECTED! +200 pts for catching it!':'True statement confirmed. +100 pts.'):'Statement '+(statIdx+1)+' of '+STATEMENTS.length+'. Discuss with your team — is this true or false?'}</div>
    <div class="btns">
      <button class="btn btn-reveal" id="reveal-btn" onclick="revealFact()"${isRevealed?' disabled style="opacity:.4;cursor:default"':''}>Fact Check</button>
      <button class="btn btn-next" onclick="nextStatement()">Next Statement</button>
      <button class="btn btn-eject" onclick="callMeeting()">Call Meeting — Vote!</button>
    </div>`;
}

function revealFact(){
  if(revealed.has(statIdx))return;
  revealed.add(statIdx);
  const stmt=STATEMENTS[statIdx];
  if(!stmt.wrong){score+=100;suspicion[stmt.speaker].verified++;_sndVerified();}
  else{score+=200;suspicion[stmt.speaker].busted++;_sndBusted();}
  render();
}

function nextStatement(){statIdx++;render();}

function completeTask(i){
  if(!tasksDone.includes(i))tasksDone.push(i);
  render();
}

function callMeeting(){
  _sndMeeting();
  const flash=document.createElement('div');
  flash.className='meeting-flash';
  flash.textContent='🚨 EMERGENCY MEETING 🚨';
  document.body.appendChild(flash);
  setTimeout(()=>{flash.remove();renderVote();},550);
}

function renderVote(){
  phase='vote';
  document.getElementById('app').innerHTML=`
    <div class="hdr"><div class="hdr-title">EMERGENCY MEETING</div><div class="hdr-sub">Vote out the Health Imposter!</div></div>
    <div class="alert-banner">Someone is spreading health misinformation. VOTE THEM OUT!</div>
    <div class="vote-section">
      <div class="vote-title">🗳 WHO IS THE IMPOSTER?</div>
      <div style="font-size:13px;color:#9ca3af;text-align:center;margin-bottom:10px">Based on the misinformation you heard — who do you suspect?</div>
      <div class="vote-grid">${NAMES.map((n,i)=>{
        if(ejected.includes(i)) return '';
        const vc=Object.values(votes).filter(v=>v===i).length;
        return `<div class="vote-btn${vc>0?' voted':''}" onclick="castVote(${i})">${AVATARS[i]} ${n}<br><span style="color:#ef4444;font-weight:700">${vc} vote${vc!==1?'s':''}</span></div>`;
      }).join('')}</div>
    </div>
    <div class="btns">
      <button class="btn btn-eject" onclick="eject()">EJECT!</button>
      <button class="btn btn-reset" onclick="phase='game';render()">Skip Voting</button>
    </div>`;
}

let voteKey=0;
function castVote(i){votes[voteKey++]=i;renderVote();}

function eject(){
  const tally={};
  Object.values(votes).forEach(i=>{tally[i]=(tally[i]||0)+1;});
  const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  if(!sorted.length){alert('No votes cast!');return;}
  const ejectedIdx=parseInt(sorted[0][0]);
  ejected.push(ejectedIdx);
  imposterCaught=ejectedIdx===imposterIdx;
  if(imposterCaught)score+=500;
  phase='result';
  renderEjectAnim(ejectedIdx);
}

function renderEjectAnim(ejectedIdx){
  document.getElementById('app').innerHTML=`
    <div class="hdr"><div class="hdr-title">EJECTING...</div></div>
    <div style="text-align:center;padding:60px 0">
      <div class="eject-avatar">${AVATARS[ejectedIdx]}</div>
      <div style="margin-top:12px;color:#9ca3af;font-size:14px">${NAMES[ejectedIdx]} was ejected...</div>
    </div>`;
  setTimeout(()=>renderResult(ejectedIdx),1100);
}

function getRank(){
  if(score>=2000)return{label:'🕵️ Master Health Detective',desc:'Elite fact-checking instincts — you barely missed a thing.'};
  if(score>=1400)return{label:'🔍 Sharp-Eyed Detective',desc:'You caught most of the misinformation out there.'};
  if(score>=800)return{label:'📋 Rookie Detective',desc:'Good start — review the myths you missed and try again.'};
  return{label:'🤔 Keep Practicing',desc:'Fact-check every statement next time to sharpen your instincts!'};
}

function spawnConfetti(){
  const zone=document.getElementById('confetti-zone');
  if(!zone)return;
  const pieces=['🎉','✅','🏆','⭐','🎊'];
  for(let i=0;i<14;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.textContent=pieces[Math.floor(Math.random()*pieces.length)];
    el.style.left=(Math.random()*94)+'%';
    el.style.animationDelay=(Math.random()*0.4)+'s';
    zone.appendChild(el);
  }
  setTimeout(()=>{if(zone)zone.innerHTML='';},2000);
}

function renderResult(ejectedIdx){
  const wasImposter=ejectedIdx===imposterIdx;
  const rank=getRank();
  document.getElementById('app').innerHTML=`
    <div class="hdr"><div class="hdr-title">MEETING RESULTS</div></div>
    <div id="confetti-zone" style="position:relative;height:0;overflow:visible"></div>
    <div class="result-box${wasImposter?' imposter-caught':' imposter-escaped'}">
      <div style="font-size:40px;margin-bottom:8px">${wasImposter?'🚀':'😱'}</div>
      <div class="result-title" style="color:${wasImposter?'#10b981':'#ef4444'}">${wasImposter?'IMPOSTER EJECTED!':'WRONG PLAYER!'}</div>
      <div style="font-size:20px;font-weight:700;color:#fff;margin:8px 0">${NAMES[ejectedIdx]} was ${wasImposter?'THE IMPOSTER!':'innocent!'}</div>
      ${wasImposter?`<div style="font-size:13px;color:#6ee7b7;margin-top:6px">The real imposter was ${NAMES[imposterIdx]} — spreading health misinformation in statements ${STATEMENTS.filter(s=>s.speaker===imposterIdx&&s.wrong).map(s=>STATEMENTS.indexOf(s)+1).join(', ')}. +500 bonus pts!</div>`:`<div style="font-size:13px;color:#fca5a5;margin-top:6px">The real imposter was ${NAMES[imposterIdx]}! They escaped by spreading misinformation that went undetected.</div>`}
    </div>
    <div class="rank-box">
      <div style="font-size:13px;color:#9ca3af;margin-bottom:4px">Final Score</div>
      <div style="font-size:26px;font-weight:700;color:#a855f7">${score} pts</div>
      <div style="font-size:14px;font-weight:700;color:#fbbf24;margin-top:6px">${rank.label}</div>
      <div style="font-size:12px;color:#6b7280;margin-top:2px">${rank.desc}</div>
    </div>
    <div style="background:#111827;border-radius:10px;padding:14px;margin-bottom:12px">
      <div style="font-size:13px;color:#a855f7;font-weight:600;margin-bottom:8px">Misinformation Summary — what the imposter spread:</div>
      ${STATEMENTS.filter(s=>s.speaker===imposterIdx&&s.wrong).map(s=>`<div style="background:#1c0a0a;border-left:3px solid #ef4444;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.5;border-radius:0 6px 6px 0"><div style="font-style:italic;color:#fca5a5;margin-bottom:4px">"${s.text}"</div><div style="color:#6b7280">${s.fact}</div></div>`).join('')}
    </div>
    <div class="btns"><button class="btn btn-reset" onclick="newGame()" style="font-size:15px;padding:12px 28px">Play Again</button></div>`;
  if(wasImposter){_sndCaught();spawnConfetti();}else{_sndEscaped();}
}

function newGame(){
  assignRoles();
  statIdx=0;phase='game';votes={};ejected=[];imposterCaught=false;tasksDone=[];score=0;voteKey=0;
  revealed=new Set();
  NAMES.forEach((_,i)=>suspicion[i]={busted:0,verified:0});
  render();
}

render();
</script>
</body>
</html>
