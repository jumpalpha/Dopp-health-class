<body>
<div id="stars"></div>

<nav>
  <a class="nav-back" href="javascript:history.back()">← Back</a>
  <div class="nav-title" id="nav-title">Vocab Games</div>
  <div class="nav-score" id="nav-score"></div>
</nav>

<div class="game-selector">
  <button class="game-tab active" onclick="switchGame('flashcard',this)">🃏 Flashcard Flip</button>
  <button class="game-tab" onclick="switchGame('speedquiz',this)">⚡ Speed Quiz</button>
  <button class="game-tab" onclick="switchGame('wordbuild',this)">🔤 Word Builder</button>
  <button class="game-tab" onclick="switchGame('conceptmap',this)">🗺 Concept Map</button>
  <div class="chapter-info" id="chapter-info"></div>
</div>

<div id="game-area">
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="score-hud" id="score-hud"></div>
  <div id="game-content"></div>
  <div class="howto" id="howto"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// VOCAB DATA — All 28 Chapters
// ═══════════════════════════════════════════════════════════
const ALL_CHAPTERS = {
  1: {title:"Understanding Health & Wellness", color:"#38BFFF", terms:[
    {t:"Health",d:"A combination of physical, mental/emotional, and social well-being — not just the absence of disease.",cat:"Core Concepts"},
    {t:"Wellness",d:"The quality of life that results from taking positive steps toward achieving your full health potential.",cat:"Core Concepts"},
    {t:"Health Triangle",d:"A model showing the three sides of health: physical, mental/emotional, and social — all must be balanced.",cat:"Core Concepts"},
    {t:"Lifestyle factors",d:"Personal behaviors and habits that affect your long-term health, both positively and negatively.",cat:"Influences"},
    {t:"Health literacy",d:"The ability to find, understand, evaluate, and apply health information to make responsible decisions.",cat:"Core Concepts"},
    {t:"Heredity",d:"The passing of traits from biological parents to their children through genes.",cat:"Influences"},
    {t:"Environment",d:"All living and nonliving things around you, including your community, culture, and physical surroundings.",cat:"Influences"},
    {t:"Culture",d:"The beliefs, values, and practices shared by a group of people — a major influence on health decisions.",cat:"Influences"},
    {t:"Peers",d:"People of the same age who share similar interests; a powerful influence on teen health behavior.",cat:"Influences"},
    {t:"Risk behaviors",d:"Actions or habits that increase the likelihood of negative outcomes to one's health or others.",cat:"Core Concepts"},
    {t:"Prevention",d:"Taking action to avoid disease, injury, and other health problems before they occur.",cat:"Core Concepts"},
    {t:"Abstinence",d:"The deliberate decision to refrain from a risky behavior.",cat:"Core Concepts"},
    {t:"Health promotion",d:"The process of enabling people to increase control over and improve their health.",cat:"Core Concepts"},
    {t:"Protective factors",d:"Conditions or attributes that reduce the impact of risk factors on health outcomes.",cat:"Core Concepts"},
    {t:"Attitude",d:"A feeling or disposition toward a person, object, or idea that influences behavior.",cat:"Influences"},
    {t:"Spiritual health",d:"A deep-seated sense of meaning and purpose in life.",cat:"Core Concepts"},
    {t:"Chronic disease",d:"An ongoing condition or illness such as heart disease, obesity, or cancer.",cat:"Core Concepts"},
    {t:"Media",d:"The various methods for communicating information.",cat:"Influences"},
    {t:"Technology",d:"The tools and methods used to deliver media content.",cat:"Influences"},
    {t:"Cumulative risks",d:"Related risks that increase in effect with each added risk.",cat:"Core Concepts"},
    {t:"Health education",d:"Providing accurate health information and teaching health skills to help people make healthy decisions.",cat:"Core Concepts"},
    {t:"Healthy People 2030",d:"A nationwide health promotion and disease prevention plan with goals set for the current decade.",cat:"Core Concepts"},
    {t:"Health disparities",d:"Differences in health outcomes among groups based on gender, race, education, disability, or location.",cat:"Core Concepts"},
  ]},
  2: {title:"Skills for a Healthy Life", color:"#38BFFF", terms:[
    {t:"Goal setting",d:"The process of identifying something you want to accomplish and creating a plan to achieve it.",cat:"Skills"},
    {t:"SMART goals",d:"Goals that are Specific, Measurable, Achievable, Realistic, and Time-bound.",cat:"Skills"},
    {t:"Decision making",d:"A five-step process for making healthy, responsible choices.",cat:"Skills"},
    {t:"Values",d:"The beliefs and principles that guide your behavior and decisions.",cat:"Core Concepts"},
    {t:"Refusal skills",d:"Strategies that help you say no to things that are harmful or illegal.",cat:"Skills"},
    {t:"Conflict resolution",d:"A process for resolving disagreements in a peaceful, constructive way.",cat:"Skills"},
    {t:"Stress management",d:"Techniques for controlling and reducing the physical and emotional effects of stress.",cat:"Skills"},
    {t:"Communication skills",d:"The ability to share information clearly with others using listening, speaking, and body language.",cat:"Skills"},
    {t:"Self-management",d:"The ability to control your emotions, behaviors, and actions to make healthy choices.",cat:"Skills"},
    {t:"Advocacy",d:"Taking action to promote health and influence others to make positive choices.",cat:"Skills"},
    {t:"Accessing information",d:"The skill of finding and evaluating reliable, accurate health information from valid sources.",cat:"Skills"},
    {t:"Analyzing influences",d:"The ability to identify and examine the factors that affect health beliefs and behaviors.",cat:"Skills"},
    {t:"Health skills",d:"Specific tools and strategies to maintain, protect, and improve all aspects of your health; also called life skills.",cat:"Skills"},
    {t:"Interpersonal communication",d:"The exchange of thoughts, feelings, and beliefs between two or more people.",cat:"Skills"},
    {t:"Stress",d:"The reaction of the body and mind to everyday challenges and demands.",cat:"Core Concepts"},
    {t:"Decision-making skills",d:"Steps that enable you to make a healthful decision.",cat:"Skills"},
    {t:"Goals",d:"Things you aim for that take planning and work.",cat:"Skills"},
    {t:"Short-term goal",d:"A goal you can reach in a short period of time.",cat:"Skills"},
    {t:"Long-term goal",d:"A goal you plan to reach over an extended period of time.",cat:"Skills"},
    {t:"Action plan",d:"A multistep strategy to identify and achieve your goals.",cat:"Skills"},
    {t:"Health consumer",d:"Someone who purchases or uses health products or services.",cat:"Core Concepts"},
    {t:"Advertising",d:"A written or spoken media message designed to interest consumers in purchasing a product or service.",cat:"Core Concepts"},
    {t:"Comparison shopping",d:"Judging the benefits of different products by comparing factors such as quality, features, and cost.",cat:"Core Concepts"},
    {t:"Warranty",d:"A company's or store's written agreement to repair a product or refund your money if it does not function properly.",cat:"Core Concepts"},
    {t:"Consumer advocates",d:"People or groups whose purpose is to take on consumer issues and inform the public about potential problems.",cat:"Core Concepts"},
    {t:"Malpractice",d:"Failure by a health professional to meet accepted standards of care.",cat:"Core Concepts"},
    {t:"Health fraud",d:"The sale of worthless products or services that claim to prevent disease or cure health problems; also called quackery.",cat:"Core Concepts"},
  ]},
  3: {title:"Mental and Emotional Health", color:"#a855f7", terms:[
    {t:"Mental health",d:"The state of your psychological and emotional well-being — how you think, feel, and cope with life.",cat:"Mental Health"},
    {t:"Emotions",d:"Signals that tell your mind and body how to react to situations.",cat:"Mental Health"},
    {t:"Self-concept",d:"The view you have of yourself — your strengths, weaknesses, thoughts, and feelings.",cat:"Mental Health"},
    {t:"Self-esteem",d:"The confidence and satisfaction you have in yourself and your own abilities.",cat:"Mental Health"},
    {t:"Empathy",d:"The ability to understand and share the feelings of another person.",cat:"Mental Health"},
    {t:"Emotional intelligence",d:"The ability to recognize, understand, and manage your own emotions and recognize emotions in others.",cat:"Mental Health"},
    {t:"Resiliency",d:"The ability to recover from setbacks, adapt to change, and keep going in the face of adversity.",cat:"Mental Health"},
    {t:"Grief",d:"The emotional response to loss — a normal and necessary process that takes time.",cat:"Mental Health"},
    {t:"Coping strategies",d:"Healthy ways of managing and reducing the emotional pain of difficult situations.",cat:"Mental Health"},
    {t:"Defense mechanisms",d:"Unconscious mental strategies used to protect yourself from uncomfortable emotions.",cat:"Mental Health"},
    {t:"Positive affirmations",d:"Statements that remind you of your strengths and help reinforce a positive self-image.",cat:"Mental Health"},
    {t:"Mindfulness",d:"The practice of focusing attention on the present moment with openness and without judgment.",cat:"Mental Health"},
    {t:"Mental/emotional health",d:"The ability to accept yourself and others, express and manage emotions, and deal with the demands and challenges of life.",cat:"Mental Health"},
    {t:"Competence",d:"Having enough skills to do something successfully.",cat:"Mental Health"},
    {t:"Hierarchy of needs",d:"A ranked list of needs essential to human growth and development, from basic physical needs up to reaching your full potential.",cat:"Mental Health"},
    {t:"Self-actualization",d:"The drive to reach your full potential and become the best version of yourself.",cat:"Mental Health"},
    {t:"Personal identity",d:"Your sense of yourself as a unique individual, shaped by your values, relationships, experiences, and beliefs.",cat:"Mental Health"},
    {t:"Role model",d:"Someone whose success or behavior serves as an example for others.",cat:"Mental Health"},
    {t:"Personality",d:"The complex set of characteristics that makes a person unique.",cat:"Mental Health"},
    {t:"Character",d:"The distinctive qualities that describe how a person thinks, feels, and behaves.",cat:"Mental Health"},
    {t:"Integrity",d:"A firm, consistent commitment to core ethical values.",cat:"Mental Health"},
    {t:"Constructive criticism",d:"Honest, non-hostile feedback that points out problems and encourages improvement.",cat:"Mental Health"},
    {t:"Hormones",d:"Chemicals produced by your glands that regulate the activities of different body cells.",cat:"Mental Health"},
    {t:"Hostility",d:"The intentional use of unfriendly or offensive behavior toward others.",cat:"Mental Health"},
  ]},
  4: {title:"Managing Stress", color:"#a855f7", terms:[
    {t:"Stress",d:"The body's and mind's reaction to everyday demands and threats, real or perceived.",cat:"Stress"},
    {t:"Stressor",d:"Any situation, event, or person that causes stress.",cat:"Stress"},
    {t:"Fight-or-flight response",d:"The body's automatic physiological reaction to a perceived threat — prepares to fight or flee.",cat:"Stress"},
    {t:"Adrenaline",d:"The hormone released during stress that increases heart rate, blood pressure, and energy.",cat:"Stress"},
    {t:"Eustress",d:"Positive stress that motivates and energizes, such as excitement before a sports event.",cat:"Stress"},
    {t:"Distress",d:"Negative stress that feels overwhelming and harmful to health.",cat:"Stress"},
    {t:"Chronic stress",d:"Ongoing, long-term stress that persists over weeks or months and damages health.",cat:"Stress"},
    {t:"Relaxation response",d:"The body's ability to slow down and recover after a stressful event.",cat:"Stress"},
    {t:"Time management",d:"The practice of organizing and prioritizing tasks to reduce stress and increase productivity.",cat:"Coping"},
    {t:"Support network",d:"Friends, family, and others who provide emotional encouragement and practical help.",cat:"Coping"},
    {t:"Burnout",d:"A state of physical and emotional exhaustion from prolonged, unmanaged stress.",cat:"Stress"},
    {t:"Cortisol",d:"The primary stress hormone; sustained high levels damage the immune system and cardiovascular health.",cat:"Stress"},
    {t:"General Adaptation Syndrome",d:"The three-stage process (alarm, resistance, exhaustion) the body goes through when exposed to prolonged stress.",cat:"Stress"},
    {t:"Resilience",d:"The ability to recover from stress, trauma, and adversity.",cat:"Coping"},
    {t:"Mindfulness",d:"The practice of focusing attention on the present moment without judgment.",cat:"Coping"},
    {t:"Acute stress",d:"Short-term, intense stress that passes once the event ends.",cat:"Stress"},
    {t:"Alarm stage",d:"The first stage of the General Adaptation Syndrome, when the body detects a stressor and triggers fight-or-flight.",cat:"Stress"},
    {t:"Exhaustion stage",d:"The final stage of the General Adaptation Syndrome, when long stress uses up the body's reserves and illness becomes more likely.",cat:"Stress"},
    {t:"Reframing",d:"Changing how you interpret a stressor.",cat:"Coping"},
    {t:"Post-traumatic growth",d:"Developing greater strength, deeper relationships and clearer priorities after a very difficult experience.",cat:"Coping"},
    {t:"Progressive muscle relaxation",d:"A stress technique of tensing and then relaxing muscle groups one at a time.",cat:"Coping"},
  ]},
  5: {title:"Mental and Emotional Problems", color:"#a855f7", terms:[
    {t:"Mental disorder",d:"An illness that affects a person's thinking, feeling, or behavior significantly enough to cause distress.",cat:"Disorders"},
    {t:"Anxiety disorder",d:"A category of mental health conditions characterized by excessive, persistent fear or worry.",cat:"Disorders"},
    {t:"Depression",d:"A mood disorder marked by persistent sadness, hopelessness, loss of interest, and low energy.",cat:"Disorders"},
    {t:"Suicide",d:"The act of intentionally ending one's own life — a preventable public health crisis.",cat:"Crisis"},
    {t:"Suicide prevention",d:"Strategies and actions to recognize warning signs and connect people to help before a crisis.",cat:"Crisis"},
    {t:"Eating disorder",d:"A serious mental illness involving extreme disturbances in eating behavior and body image.",cat:"Disorders"},
    {t:"Anorexia nervosa",d:"An eating disorder involving severe restriction of food intake driven by fear of weight gain.",cat:"Disorders"},
    {t:"Bulimia nervosa",d:"An eating disorder involving cycles of binge eating followed by purging behaviors.",cat:"Disorders"},
    {t:"PTSD",d:"Post-Traumatic Stress Disorder — a mental health condition triggered by experiencing or witnessing trauma.",cat:"Disorders"},
    {t:"Therapy",d:"Treatment by a trained mental health professional using evidence-based psychological methods.",cat:"Treatment"},
    {t:"Psychiatry",d:"A branch of medicine focused on diagnosing, treating, and preventing mental disorders.",cat:"Treatment"},
    {t:"Stigma",d:"Negative attitudes or discrimination against people with mental health conditions — a major barrier to seeking help.",cat:"Social"},
    {t:"Phobia",d:"An intense, irrational fear of a specific object or situation.",cat:"Disorders"},
    {t:"ADHD",d:"Attention-deficit/hyperactivity disorder; difficulty sustaining attention and controlling impulses.",cat:"Disorders"},
    {t:"Obsessive-compulsive disorder (OCD)",d:"A disorder involving recurring, unwanted thoughts and repetitive behaviors.",cat:"Disorders"},
    {t:"Panic disorder",d:"An anxiety disorder with repeated, sudden attacks of intense fear and physical symptoms like a racing heart.",cat:"Disorders"},
    {t:"Social anxiety",d:"Intense fear of being judged or embarrassed in social situations.",cat:"Disorders"},
    {t:"Psychiatrist",d:"A medical doctor who can diagnose mental disorders and prescribe medication.",cat:"Treatment"},
    {t:"Therapist",d:"A professional who provides talk therapy to help people understand and change thought and behavior patterns.",cat:"Treatment"},
    {t:"Crisis line",d:"A free, confidential phone or text service for people in crisis, such as 988, open 24/7.",cat:"Crisis"},
  ]},
  6: {title:"Building Healthy Relationships", color:"#FF3B5C", terms:[
    {t:"Relationship",d:"A bond or connection between people based on shared experiences, trust, and mutual care.",cat:"Relationships"},
    {t:"Communication",d:"The process of sharing information, thoughts, and feelings using verbal and nonverbal methods.",cat:"Skills"},
    {t:"Active listening",d:"Fully concentrating on what someone is saying, showing you understand, and responding thoughtfully.",cat:"Skills"},
    {t:"Assertiveness",d:"The ability to express your thoughts and feelings confidently and respectfully, without aggression.",cat:"Skills"},
    {t:"Boundary",d:"A limit you set to protect your physical, emotional, and mental well-being in relationships.",cat:"Relationships"},
    {t:"Trust",d:"The firm belief in the reliability, truth, or ability of another person — the foundation of healthy relationships.",cat:"Relationships"},
    {t:"Respect",d:"Treating others with consideration for their feelings, rights, and boundaries.",cat:"Relationships"},
    {t:"Reciprocity",d:"The mutual exchange of benefits, care, or support between people in a healthy relationship.",cat:"Relationships"},
    {t:"Jealousy",d:"A feeling of insecurity or fear of losing something or someone to another — can damage relationships.",cat:"Relationships"},
    {t:"Healthy relationship",d:"A relationship built on trust, respect, communication, equality, and support for each other's goals.",cat:"Relationships"},
    {t:"\"I\" statements",d:"Phrases that express personal feelings without blaming others, beginning with \"I feel...\".",cat:"Skills"},
    {t:"Peer pressure",d:"Influence from people your own age to act or think in a certain way.",cat:"Relationships"},
    {t:"Refusal skills",d:"Strategies used to say no to unwanted or risky behaviors.",cat:"Skills"},
    {t:"Boundaries",d:"Limits a person sets on what they consider acceptable behavior from others.",cat:"Relationships"},
    {t:"Manipulation",d:"Using unfair or dishonest methods to control or influence another person.",cat:"Relationships"},
    {t:"Passive communication",d:"Avoiding conflict by not expressing your needs, which builds resentment.",cat:"Skills"},
    {t:"Aggressive communication",d:"Expressing needs in a hostile or blaming way that can win arguments but damages trust.",cat:"Skills"},
    {t:"Nonverbal communication",d:"Messages sent without words, such as eye contact, posture and tone of voice.",cat:"Skills"},
    {t:"Broken record technique",d:"A refusal strategy of calmly repeating no.",cat:"Skills"},
    {t:"Delay tactic",d:"A refusal strategy that buys time, such as saying \"I need to think about it.\".",cat:"Skills"},
  ]},
  7: {title:"Family Relationships", color:"#FF3B5C", terms:[
    {t:"Siblings",d:"Brothers and sisters.",cat:"Family Types"},
    {t:"Nuclear family",d:"Two parents and one or more children living in the same home.",cat:"Family Types"},
    {t:"Blended family",d:"A family formed when a single parent remarries, bringing together children from previous relationships.",cat:"Family Types"},
    {t:"Extended family",d:"A family that includes relatives beyond parents and children, such as grandparents, aunts, uncles and cousins.",cat:"Family Types"},
    {t:"Foster care",d:"The temporary placement of children in the homes of adults who are not related to them.",cat:"Family Types"},
    {t:"Affirmation",d:"Positive feedback that helps others feel appreciated and supported.",cat:"Family Types"},
    {t:"Separation",d:"A decision by two married people to live apart from each other.",cat:"Family Change"},
    {t:"Divorce",d:"A legal end to a marriage contract.",cat:"Family Change"},
    {t:"Custody",d:"The legal right to make decisions affecting children and the responsibility for their care.",cat:"Family Change"},
    {t:"Abuse",d:"The physical, mental, emotional, or sexual mistreatment of one person by another.",cat:"Abuse & Help"},
    {t:"Domestic violence",d:"Acts of violence or abuse involving family members.",cat:"Abuse & Help"},
    {t:"Spousal abuse",d:"Domestic violence or abuse directed at a spouse or partner.",cat:"Abuse & Help"},
    {t:"Child abuse",d:"Domestic abuse directed at a child, including physical, emotional, or sexual harm.",cat:"Abuse & Help"},
    {t:"Neglect",d:"The failure to provide for a child's basic needs.",cat:"Abuse & Help"},
    {t:"Elder abuse",d:"The abuse or neglect of older family members.",cat:"Abuse & Help"},
    {t:"Cycle of violence",d:"The pattern of repeating violent or abusive behaviors from one generation to the next.",cat:"Abuse & Help"},
    {t:"Crisis center",d:"A facility that offers advice and support to people dealing with personal emergencies.",cat:"Abuse & Help"},
    {t:"Adoption",d:"Becoming a permanent legal family for a child.",cat:"Family Types"},
    {t:"Single-parent family",d:"One parent raising one or more children, often after divorce, separation or death.",cat:"Family Types"},
    {t:"Commitment",d:"Making time for family members and working on problems together.",cat:"Family Change"},
  ]},
  8: {title:"Peer Relationships", color:"#FF3B5C", terms:[
    {t:"Peers",d:"People your age who share similar interests.",cat:"Friendships"},
    {t:"Platonic friendship",d:"A friendship with someone of a different gender involving genuine affection, but without romantic involvement.",cat:"Friendships"},
    {t:"Clique",d:"A small circle of friends who exclude people viewed as outsiders.",cat:"Friendships"},
    {t:"Peer pressure",d:"The influence that people your age may have on your actions and behaviors.",cat:"Peer Pressure"},
    {t:"Harassment",d:"Persistently annoying or targeting others through hurtful behaviors like name-calling, teasing, or bullying.",cat:"Peer Pressure"},
    {t:"Manipulation",d:"An indirect, dishonest way to control or influence other people.",cat:"Peer Pressure"},
    {t:"Refusal skills",d:"Communication strategies that help you say no when urged to take part in unsafe or unhealthy behaviors.",cat:"Peer Pressure"},
    {t:"Priorities",d:"The goals, tasks, values, and activities you judge to be most important.",cat:"Dating & Limits"},
    {t:"Intimacy",d:"A closeness between two people that develops over time through genuine connection and trust.",cat:"Dating & Limits"},
    {t:"Infatuation",d:"Exaggerated feelings of intense passion that can feel overwhelming but are often short-lived.",cat:"Dating & Limits"},
    {t:"Abstinence",d:"A deliberate decision to avoid high-risk behaviors, including sexual activity and the use of alcohol, tobacco, and other drugs.",cat:"Dating & Limits"},
    {t:"Self-control",d:"The ability to use responsibility and values to override emotions in the moment.",cat:"Dating & Limits"},
    {t:"Sexually transmitted infections (STIs)",d:"Infectious diseases spread from person to person through sexual contact.",cat:"Dating & Limits"},
    {t:"Casual friendship",d:"A friendship built on shared interests without deep emotional bonds.",cat:"Friendships"},
    {t:"Close friendship",d:"A friendship with deep emotional ties, where you can share thoughts and struggles without judgment.",cat:"Friendships"},
    {t:"Positive peer pressure",d:"Influence from peers that pushes you to try new activities, work harder or avoid risky behavior.",cat:"Peer Pressure"},
    {t:"State your position",d:"The first refusal step: say no clearly and firmly, with an honest reason.",cat:"Peer Pressure"},
    {t:"Suggest alternatives",d:"The second refusal step: offer another activity so you stay connected without giving up your values.",cat:"Peer Pressure"},
    {t:"Stand your ground",d:"The third refusal step: make it clear you won't budge, and walk away if needed.",cat:"Peer Pressure"},
    {t:"Online safety",d:"Habits that protect you online, like keeping personal details private and never meeting an online contact alone.",cat:"Friendships"},
  ]},
  9: {title:"Resolving Conflicts and Preventing Violence", color:"#FF3B5C", terms:[
    {t:"Conflict",d:"Any disagreement, struggle, or fight.",cat:"Conflict"},
    {t:"Interpersonal conflicts",d:"Conflicts between two or more people or groups.",cat:"Conflict"},
    {t:"Escalate",d:"To become more serious or intense.",cat:"Conflict"},
    {t:"Negotiation",d:"The use of communication and compromise to settle a disagreement.",cat:"Resolution"},
    {t:"Mediation",d:"Bringing in a neutral third party to help others resolve their conflicts peacefully.",cat:"Resolution"},
    {t:"Confidentiality",d:"Respecting the privacy of both parties and keeping details of a discussion secret.",cat:"Resolution"},
    {t:"Peer mediation",d:"A process in which specially trained students help other students resolve conflicts peacefully.",cat:"Resolution"},
    {t:"Violence",d:"The threatened or actual use of physical force or power to harm another person or damage property.",cat:"Violence"},
    {t:"Assault",d:"An unlawful physical attack or threat of attack.",cat:"Violence"},
    {t:"Random violence",d:"Violence committed for no particular reason against an unrelated victim.",cat:"Violence"},
    {t:"Homicide",d:"The willful killing of one human being by another.",cat:"Violence"},
    {t:"Sexual violence",d:"Any form of unwelcome sexual contact directed at an individual.",cat:"Violence"},
    {t:"Bullying",d:"Repeated, deliberate hurtful behavior by someone who has more power than the target.",cat:"Violence"},
    {t:"Cyberbullying",d:"Bullying that happens through phones, social media, games, or other technology.",cat:"Violence"},
    {t:"Physical abuse",d:"A pattern of intentionally causing bodily harm or injury to another person.",cat:"Abuse"},
    {t:"Emotional abuse",d:"A pattern of attacking another person's emotional development and sense of worth.",cat:"Abuse"},
    {t:"Verbal abuse",d:"The use of words to mistreat or injure another person; a form of emotional abuse.",cat:"Abuse"},
    {t:"Stalking",d:"Repeatedly following, harassing, or threatening an individual in person or online.",cat:"Abuse"},
    {t:"Upstander",d:"Someone who speaks up, supports the target or gets help when they see bullying.",cat:"Violence"},
    {t:"Hate crime",d:"A crime motivated by hatred of a group because of race, religion, disability, sexual orientation or other traits.",cat:"Violence"},
  ]},
  10: {title:"Nutrition for Health", color:"#00E5A0", terms:[
    {t:"Nutrients",d:"Substances in food that provide energy and materials the body needs to grow, repair, and function.",cat:"Nutrition"},
    {t:"Carbohydrates",d:"The body's primary energy source; should make up 45–65% of daily calories.",cat:"Macronutrients"},
    {t:"Proteins",d:"Nutrients that build and repair cells, muscles, and tissues; made of amino acids.",cat:"Macronutrients"},
    {t:"Fats",d:"Nutrients that store energy, protect organs, and support vitamin absorption; essential in moderation.",cat:"Macronutrients"},
    {t:"Vitamins",d:"Organic compounds needed in small amounts to regulate body functions and prevent disease.",cat:"Micronutrients"},
    {t:"Minerals",d:"Inorganic substances (calcium, iron, zinc) essential for bone health, blood, and body functions.",cat:"Micronutrients"},
    {t:"MyPlate",d:"The USDA visual guide showing the five food groups and recommended proportions for healthy eating.",cat:"Guidelines"},
    {t:"Calorie",d:"A unit of energy; the amount of energy in food that the body uses to perform functions.",cat:"Nutrition"},
    {t:"Dietary fiber",d:"Indigestible plant material that supports digestive health, lowers cholesterol, and controls blood sugar.",cat:"Nutrition"},
    {t:"Saturated fat",d:"A type of fat found in animal products that raises LDL (bad) cholesterol when consumed in excess.",cat:"Nutrition"},
    {t:"Trans fat",d:"An artificially created fat that raises bad cholesterol and lowers good cholesterol — largely banned.",cat:"Nutrition"},
    {t:"Nutrition label",d:"The panel on food packaging showing calorie count, nutrients, and percent daily values.",cat:"Guidelines"},
    {t:"Dietary guidelines",d:"Science-based advice from the USDA and HHS on what to eat and drink to promote health.",cat:"Guidelines"},
    {t:"Fiber",d:"A type of carbohydrate the body cannot digest; promotes digestive health and reduces disease risk.",cat:"Macronutrients"},
    {t:"Unsaturated fat",d:"A healthier type of fat, found in foods like nuts, fish and olive oil, that should replace saturated and trans fats.",cat:"Macronutrients"},
    {t:"Added sugars",d:"Sugars put into foods during processing; the Dietary Guidelines say to keep them under 10% of daily calories.",cat:"Guidelines"},
    {t:"Sodium",d:"A mineral found in salt; the Dietary Guidelines say to keep it under 2,300 mg per day.",cat:"Micronutrients"},
    {t:"Serving size",d:"The amount of food that all the numbers on a Nutrition Facts label are based on.",cat:"Guidelines"},
    {t:"Percent Daily Value",d:"How much a serving adds to a day's needs; 5% or less is low and 20% or more is high.",cat:"Guidelines"},
    {t:"Ultra-processed foods",d:"Packaged foods like chips and fast food that are engineered to override your hunger signals.",cat:"Guidelines"},
  ]},
  11: {title:"Managing Weight", color:"#00E5A0", terms:[
    {t:"Body Mass Index (BMI)",d:"A ratio of weight to height used as a screening tool for healthy weight — not a diagnosis.",cat:"Assessment"},
    {t:"Metabolism",d:"The rate at which your body converts food into energy — affects weight management.",cat:"Physiology"},
    {t:"Basal metabolic rate",d:"The number of calories your body needs to maintain basic functions at rest.",cat:"Physiology"},
    {t:"Caloric balance",d:"The relationship between calories consumed and calories burned through activity.",cat:"Weight Management"},
    {t:"Body image",d:"The way you see and feel about your physical appearance.",cat:"Mental Health"},
    {t:"Eating disorder",d:"A serious mental illness with extreme disturbances in eating behavior, body image, and weight.",cat:"Disorders"},
    {t:"Anorexia nervosa",d:"An eating disorder involving extreme restriction of food intake driven by fear of weight gain.",cat:"Disorders"},
    {t:"Bulimia nervosa",d:"An eating disorder with cycles of binge eating followed by purging.",cat:"Disorders"},
    {t:"Binge eating disorder",d:"Recurrent episodes of eating large amounts of food rapidly without purging — most common ED.",cat:"Disorders"},
    {t:"Fad diet",d:"A popular diet promising quick weight loss that typically lacks scientific support and is unsustainable.",cat:"Weight Management"},
    {t:"Weight management",d:"A long-term approach to maintaining a healthy weight through balanced nutrition and physical activity.",cat:"Weight Management"},
    {t:"Obesity",d:"A condition of excess body fat that increases risk of diabetes, heart disease, and other conditions.",cat:"Assessment"},
    {t:"Body composition",d:"The ratio of fat mass to lean (muscle, bone, water) mass in the body.",cat:"Assessment"},
    {t:"Intuitive eating",d:"An approach to food that honors internal hunger and fullness cues rather than external diet rules.",cat:"Mental Health"},
    {t:"Mindful eating",d:"Paying attention to hunger and fullness cues and avoiding emotional eating.",cat:"Mental Health"},
    {t:"Emotional eating",d:"Eating in response to feelings rather than hunger.",cat:"Mental Health"},
    {t:"Orthorexia",d:"An obsessive focus on \"clean\" or \"pure\" eating to the point of harm.",cat:"Disorders"},
    {t:"All Foods Fit",d:"The idea that balance, variety and moderation matter more than labeling foods good or bad.",cat:"Weight Management"},
    {t:"Underweight",d:"A BMI below 18.5, which may signal a nutritional deficiency or eating disorder.",cat:"Assessment"},
    {t:"Overweight",d:"A BMI of 25–29.9, linked to increased risk for chronic conditions.",cat:"Assessment"},
  ]},
  12: {title:"Physical Activity", color:"#00E5A0", terms:[
    {t:"Physical activity",d:"Any movement that uses energy — from walking to organized sports.",cat:"Fitness"},
    {t:"Exercise",d:"Planned, structured, repetitive physical activity done to improve or maintain fitness.",cat:"Fitness"},
    {t:"Aerobic exercise",d:"Sustained activity that increases heart and breathing rate — improves cardiovascular fitness.",cat:"Fitness Types"},
    {t:"Anaerobic exercise",d:"Short, intense bursts of activity that don't rely on oxygen — builds strength and power.",cat:"Fitness Types"},
    {t:"Flexibility",d:"The range of motion available at a joint — maintained through stretching.",cat:"Fitness Components"},
    {t:"Muscle strength",d:"The maximum force a muscle or muscle group can exert in a single effort.",cat:"Fitness Components"},
    {t:"Muscle endurance",d:"The ability of a muscle to perform repeated contractions over time without fatigue.",cat:"Fitness Components"},
    {t:"Cardiovascular endurance",d:"The ability of the heart and lungs to supply oxygen during sustained physical activity.",cat:"Fitness Components"},
    {t:"FITT principle",d:"Frequency, Intensity, Time, and Type — the four variables used to design an effective workout.",cat:"Training"},
    {t:"Overload principle",d:"To improve fitness, you must gradually increase the demand placed on the body.",cat:"Training"},
    {t:"Warm-up",d:"Low-intensity activity before exercise that prepares muscles and reduces injury risk.",cat:"Training"},
    {t:"Cool-down",d:"Low-intensity activity after exercise that gradually returns the body to its resting state.",cat:"Training"},
    {t:"Physical fitness",d:"The ability to carry out daily tasks with vigor and without undue fatigue.",cat:"Fitness"},
    {t:"Skill-related fitness",d:"Fitness components important for sports and daily movement: agility, balance, coordination, power, reaction time and speed.",cat:"Fitness Types"},
    {t:"Agility",d:"The ability to change direction quickly while keeping control.",cat:"Fitness Components"},
    {t:"Balance",d:"The ability to stay steady and upright, whether still or moving.",cat:"Fitness Components"},
    {t:"Coordination",d:"The ability to use body parts together smoothly.",cat:"Fitness Components"},
    {t:"Reaction time",d:"How quickly you respond to a signal, like a starting gun.",cat:"Fitness Components"},
    {t:"RICE",d:"Rest, Ice, Compression, Elevation: first steps for sprains, strains and minor injuries.",cat:"Training"},
    {t:"Overtraining",d:"Training too much without enough rest, which leads to fatigue and injury.",cat:"Training"},
  ]},
  13: {title:"Personal Health Care", color:"#FF8C00", terms:[
    {t:"Epidermis",d:"The outer, thinner layer of skin composed of living and dead cells.",cat:"Skin"},
    {t:"Dermis",d:"The thicker inner layer of skin containing blood vessels, nerves, and glands.",cat:"Skin"},
    {t:"Melanin",d:"The pigment that gives skin, hair, and eyes their color and provides some UV protection.",cat:"Skin"},
    {t:"Sebaceous glands",d:"Structures in the dermis that produce sebum — an oily secretion that moisturizes skin and hair.",cat:"Skin"},
    {t:"Melanoma",d:"The most serious and potentially fatal form of skin cancer — detected using the ABCDE rule.",cat:"Skin"},
    {t:"Periodontium",d:"The structures immediately surrounding a tooth, including the gum, ligaments, and jawbone.",cat:"Dental"},
    {t:"Plaque",d:"A sticky film of bacteria and food particles on teeth that produces acids causing decay.",cat:"Dental"},
    {t:"Halitosis",d:"Bad breath caused by food, poor oral hygiene, bacteria, or gum disease.",cat:"Dental"},
    {t:"Periodontal disease",d:"Inflammation and infection of the gum and supporting structures of the teeth.",cat:"Dental"},
    {t:"Sclera",d:"The tough white outer layer of the eye.",cat:"Eyes & Ears"},
    {t:"Retina",d:"The inner layer of the eye containing light-sensitive rods and cones.",cat:"Eyes & Ears"},
    {t:"Tinnitus",d:"A ringing, buzzing, or hissing sound in the ear with no external source — warning sign of hearing damage.",cat:"Eyes & Ears"},
    {t:"Hygiene",d:"Practices that maintain cleanliness and prevent disease.",cat:"Skin"},
    {t:"Dermatologist",d:"A doctor who specializes in skin, hair, and nail conditions.",cat:"Skin"},
    {t:"Fluoride",d:"A mineral that strengthens tooth enamel and helps prevent decay.",cat:"Dental"},
    {t:"Preventive care",d:"Health services aimed at preventing disease before it occurs, including checkups and vaccinations.",cat:"Health Care"},
    {t:"Immunization",d:"Protection from disease through vaccines that stimulate the immune system.",cat:"Health Care"},
    {t:"Consumer health",d:"The evaluation of products, services, and information related to health.",cat:"Health Care"},
    {t:"OTC medication",d:"Over-the-counter drugs available without a prescription.",cat:"Health Care"},
    {t:"SPF",d:"Sun Protection Factor — a measure of how well sunscreen blocks UV radiation.",cat:"Skin"},
    {t:"Acne",d:"A skin condition caused by clogged pores resulting in pimples, blackheads, and whiteheads.",cat:"Skin"},
  ]},
  14: {title:"Skeletal, Muscular & Nervous Systems", color:"#FF8C00", terms:[
    {t:"Cartilage",d:"Strong, flexible connective tissue that cushions joints and forms soft structures like the nose and ears.",cat:"Skeletal"},
    {t:"Ossification",d:"The process by which cartilage is converted into bone during development.",cat:"Skeletal"},
    {t:"Ligament",d:"A band of fibrous connective tissue that connects bone to bone at a joint.",cat:"Skeletal"},
    {t:"Tendon",d:"A fibrous cord that connects muscle to bone.",cat:"Skeletal"},
    {t:"Scoliosis",d:"An abnormal lateral (side-to-side) curvature of the spine.",cat:"Skeletal"},
    {t:"Osteoporosis",d:"A condition of progressive bone tissue loss that makes bones weak and fracture-prone.",cat:"Skeletal"},
    {t:"Skeletal muscles",d:"Muscles attached to bones that produce voluntary body movements.",cat:"Muscular"},
    {t:"Cardiac muscle",d:"The involuntary striated muscle that forms the walls of the heart — beats ~100,000 times/day.",cat:"Muscular"},
    {t:"Tendinitis",d:"Inflammation of a tendon, usually from overuse or injury.",cat:"Muscular"},
    {t:"Neurons",d:"Nerve cells that transmit messages to and from the brain and spinal cord.",cat:"Nervous"},
    {t:"Cerebrum",d:"The largest part of the brain; center of conscious thought, learning, memory, and voluntary movement.",cat:"Nervous"},
    {t:"Cerebellum",d:"The part of the brain that coordinates skeletal muscle movement, balance, and posture.",cat:"Nervous"},
    {t:"Brain stem",d:"The stalk connecting the spinal cord to the rest of the brain; regulates vital involuntary functions.",cat:"Nervous"},
    {t:"Epilepsy",d:"A neurological disorder characterized by recurrent, unpredictable seizures.",cat:"Nervous"},
    {t:"Skeletal system",d:"The framework of 206 bones that supports the body, protects organs, and enables movement.",cat:"Skeletal"},
    {t:"Synapse",d:"The gap between neurons where chemical neurotransmitters pass signals.",cat:"Nervous"},
    {t:"Reflex",d:"An automatic, involuntary response to a stimulus, processed in the spinal cord.",cat:"Nervous"},
    {t:"Axial skeleton",d:"The skull, vertebral column and rib cage, which protect the brain, spinal cord and vital organs.",cat:"Skeletal"},
    {t:"Appendicular skeleton",d:"The arms, legs, and shoulder and hip girdles, which enable movement.",cat:"Skeletal"},
    {t:"Central nervous system",d:"The brain and spinal cord, which process information and send commands.",cat:"Nervous"},
    {t:"Peripheral nervous system",d:"All the nerves outside the brain and spinal cord, which relay signals between the CNS and the body.",cat:"Nervous"},
  ]},
  15: {title:"Cardiovascular, Respiratory & Digestive Systems", color:"#FF8C00", terms:[
    {t:"Plasma",d:"The liquid portion of blood (~55%), carrying nutrients, proteins, hormones, and salts.",cat:"Cardiovascular"},
    {t:"Hemoglobin",d:"The oxygen-carrying protein in red blood cells, containing iron.",cat:"Cardiovascular"},
    {t:"Platelets",d:"Blood cell fragments that initiate clotting when a vessel is damaged.",cat:"Cardiovascular"},
    {t:"Capillaries",d:"The smallest blood vessels; the site of gas and nutrient exchange between blood and cells.",cat:"Cardiovascular"},
    {t:"Blood pressure",d:"The force blood exerts against artery walls as the heart pumps — measured in mmHg.",cat:"Cardiovascular"},
    {t:"Diaphragm",d:"The dome-shaped muscle below the lungs that drives breathing.",cat:"Respiratory"},
    {t:"Trachea",d:"The windpipe; carries air from the throat to the bronchi.",cat:"Respiratory"},
    {t:"Asthma",d:"A chronic inflammatory condition in which airways narrow, causing difficulty breathing.",cat:"Respiratory"},
    {t:"Emphysema",d:"A progressive, irreversible disease that destroys alveolar walls; almost always caused by smoking.",cat:"Respiratory"},
    {t:"Mastication",d:"The mechanical process of chewing.",cat:"Digestive"},
    {t:"Peristalsis",d:"Rhythmic, involuntary muscle contractions that move food through the digestive tract.",cat:"Digestive"},
    {t:"Nephrons",d:"The microscopic filtering units of the kidney; each kidney has over one million.",cat:"Excretory"},
    {t:"Cardiovascular system",d:"The organ system of the heart and blood vessels that circulates blood throughout the body.",cat:"Cardiovascular"},
    {t:"Artery",d:"A blood vessel that carries oxygenated blood away from the heart.",cat:"Cardiovascular"},
    {t:"Vein",d:"A blood vessel that returns deoxygenated blood back to the heart.",cat:"Cardiovascular"},
    {t:"Alveoli",d:"Tiny air sacs in the lungs where oxygen and carbon dioxide are exchanged.",cat:"Respiratory"},
    {t:"Villi",d:"Tiny finger-like projections in the small intestine that absorb nutrients.",cat:"Digestive"},
    {t:"Cholesterol",d:"A fatty substance in the blood; high levels increase risk of heart disease.",cat:"Cardiovascular"},
    {t:"Hypertension",d:"Persistently high blood pressure; a major risk factor for heart attack and stroke.",cat:"Cardiovascular"},
    {t:"Cilia",d:"Tiny hairs lining the airways that trap and sweep out debris.",cat:"Respiratory"},
  ]},
  16: {title:"Endocrine & Reproductive Health", color:"#FF8C00", terms:[
    {t:"Endocrine glands",d:"Ductless organs that release hormones directly into the bloodstream.",cat:"Endocrine"},
    {t:"Hormones",d:"Chemical messengers that regulate body functions including growth, metabolism, mood, and reproduction.",cat:"Endocrine"},
    {t:"Thyroid gland",d:"Neck gland that produces thyroxine, regulating metabolism, body heat, and bone growth.",cat:"Endocrine"},
    {t:"Pancreas",d:"Dual-function organ that regulates blood sugar through insulin (lowers) and glucagon (raises).",cat:"Endocrine"},
    {t:"Pituitary gland",d:"The 'master gland' that regulates all other endocrine glands.",cat:"Endocrine"},
    {t:"Testosterone",d:"The primary male sex hormone; drives puberty, muscle development, and sperm production.",cat:"Reproductive"},
    {t:"Testes",d:"The two male reproductive glands that produce sperm and testosterone.",cat:"Reproductive"},
    {t:"Ovaries",d:"The female reproductive glands that store ova and produce estrogen and progesterone.",cat:"Reproductive"},
    {t:"Ovulation",d:"The monthly release of a mature egg from an ovary into the fallopian tube.",cat:"Reproductive"},
    {t:"Menstruation",d:"The monthly shedding of the uterine lining when pregnancy has not occurred.",cat:"Reproductive"},
    {t:"Uterus",d:"The hollow, muscular organ that nourishes and protects a developing fetus during pregnancy.",cat:"Reproductive"},
    {t:"Puberty",d:"The biological process by which the body develops adult reproductive and secondary sex characteristics.",cat:"Reproductive"},
    {t:"Endocrine system",d:"The system of glands that produce and release hormones into the bloodstream.",cat:"Endocrine"},
    {t:"Estrogen",d:"The primary female sex hormone responsible for reproductive development and the menstrual cycle.",cat:"Reproductive"},
    {t:"Fertilization",d:"The union of a sperm cell and an egg cell to form a zygote.",cat:"Reproductive"},
    {t:"Insulin",d:"A hormone produced by the pancreas that regulates blood sugar levels.",cat:"Endocrine"},
    {t:"Adrenal glands",d:"Glands above the kidneys that produce adrenaline and cortisol for stress response.",cat:"Endocrine"},
    {t:"Progesterone",d:"A female sex hormone made by the ovaries that helps regulate the menstrual cycle.",cat:"Reproductive"},
    {t:"Glucagon",d:"A hormone made by the pancreas that raises blood sugar.",cat:"Endocrine"},
    {t:"Menstrual cycle",d:"A roughly 28-day hormone cycle that prepares the uterus for a possible pregnancy.",cat:"Reproductive"},
  ]},
  17: {title:"The Beginning of the Life Cycle", color:"#38BFFF", terms:[
    {t:"Fertilization",d:"The union of a sperm and egg cell, resulting in a zygote; also called conception.",cat:"Prenatal"},
    {t:"Implantation",d:"The process by which the zygote attaches to and burrows into the uterine wall.",cat:"Prenatal"},
    {t:"Embryo",d:"The developing organism from weeks 3–8 of pregnancy.",cat:"Prenatal"},
    {t:"Fetus",d:"The developing organism from week 9 through birth.",cat:"Prenatal"},
    {t:"Prenatal care",d:"The health practices and medical supervision a pregnant woman undertakes to protect her health and her baby's.",cat:"Prenatal"},
    {t:"Fetal Alcohol Spectrum Disorders",d:"A range of permanent conditions caused by prenatal alcohol exposure — 100% preventable.",cat:"Prenatal"},
    {t:"Chromosomes",d:"Thread-like structures in the cell nucleus that carry the genetic code; humans have 46 (23 pairs).",cat:"Genetics"},
    {t:"Genes",d:"Segments of chromosomes that are the basic units of heredity; each codes for specific traits.",cat:"Genetics"},
    {t:"DNA",d:"The double-helix molecule that makes up chromosomes and contains the complete genetic code.",cat:"Genetics"},
    {t:"Gene therapy",d:"A medical treatment that corrects genetic disorders by introducing, repairing, or replacing defective genes.",cat:"Genetics"},
    {t:"Developmental tasks",d:"The milestones and experiences that must occur at each life stage for healthy growth.",cat:"Development"},
    {t:"Autonomy",d:"The growing confidence and ability to control one's own body and choices — key in early childhood.",cat:"Development"},
    {t:"Zygote",d:"The single cell formed when a sperm fertilizes an egg; contains 46 chromosomes.",cat:"Prenatal"},
    {t:"Placenta",d:"The organ that connects mother and fetus to transfer nutrients, oxygen, and remove waste.",cat:"Prenatal"},
    {t:"Teratogen",d:"Any substance or condition that can interfere with fetal development and cause birth defects.",cat:"Prenatal"},
    {t:"Trimester",d:"One of three ~13-week periods that divide a pregnancy.",cat:"Prenatal"},
    {t:"Labor",d:"The process by which the uterus contracts to deliver the baby and placenta.",cat:"Prenatal"},
    {t:"SIDS",d:"Sudden Infant Death Syndrome — the unexplained death of an otherwise healthy infant during sleep.",cat:"Development"},
    {t:"Cesarean section",d:"Surgical delivery of a baby through the abdomen when vaginal birth is not safe.",cat:"Prenatal"},
    {t:"Folic acid",d:"A B vitamin that, taken before and during pregnancy, reduces neural tube defects.",cat:"Prenatal"},
  ]},
  18: {title:"The Life Cycle Continues", color:"#38BFFF", terms:[
    {t:"Adolescence",d:"The developmental period between childhood and adulthood, marked by puberty and significant changes.",cat:"Development"},
    {t:"Cognition",d:"The ability to reason, think abstractly, and arrive at solutions; develops significantly during adolescence.",cat:"Development"},
    {t:"Prefrontal cortex",d:"Brain region responsible for planning, reasoning, and impulse control — not fully mature until ~age 25.",cat:"Brain"},
    {t:"Physical maturity",d:"The state at which the body and all its organs are fully developed.",cat:"Development"},
    {t:"Emotional maturity",d:"The state at which mental and emotional capabilities are fully developed.",cat:"Development"},
    {t:"Commitment",d:"A promise or pledge to another person; the foundation of marriage and other lasting partnerships.",cat:"Adulthood"},
    {t:"Transitions",d:"Significant life changes that occur at all stages of life and require adjustment.",cat:"Adulthood"},
    {t:"Empty-nest syndrome",d:"The feelings of sadness some parents experience when children grow up and leave home.",cat:"Adulthood"},
    {t:"Integrity",d:"In late adulthood, the sense of having lived according to one's values and that the life has been meaningful.",cat:"Adulthood"},
    {t:"Menopause",d:"The natural biological process marking the end of a woman's menstrual cycles, typically in the late 40s–50s.",cat:"Adulthood"},
    {t:"Sarcopenia",d:"The age-related loss of muscle mass and strength.",cat:"Adulthood"},
    {t:"Grief",d:"The emotional response to significant loss, including death of a loved one.",cat:"Adulthood"},
    {t:"Kübler-Ross stages",d:"Five stages of grief: Denial, Anger, Bargaining, Depression, Acceptance.",cat:"Adulthood"},
    {t:"Hospice",d:"A program focused on comfort care and quality of life for people with terminal illness.",cat:"Adulthood"},
    {t:"Life expectancy",d:"The average number of years a person is expected to live based on current mortality rates.",cat:"Adulthood"},
    {t:"Gerontology",d:"The scientific study of aging and older adults.",cat:"Adulthood"},
    {t:"Active aging",d:"Maintaining physical activity, social engagement, and mental stimulation in older adulthood to improve quality of life.",cat:"Adulthood"},
    {t:"Limbic system",d:"The brain system for emotion and reward, which matures before the prefrontal cortex.",cat:"Brain"},
    {t:"Midlife crisis",d:"A reassessment of goals and identity that some people go through in middle age.",cat:"Adulthood"},
    {t:"Middle adulthood",d:"The 40s through 60s, a time of physical changes and a shift toward legacy and meaning.",cat:"Adulthood"},
  ]},
  19: {title:"Medicines & Drugs", color:"#FF3B5C", terms:[
    {t:"Medicines",d:"Drugs used to treat, prevent, or manage diseases or other medical conditions.",cat:"Medicines"},
    {t:"Drugs",d:"Substances other than food that change the structure or function of the body or mind.",cat:"Medicines"},
    {t:"Vaccine",d:"A preparation that trains the immune system to recognize and fight a specific disease without causing it.",cat:"Medicines"},
    {t:"Side effects",d:"Effects of a medication other than the intended therapeutic effect.",cat:"Medicines"},
    {t:"Prescription medicines",d:"Medications dispensed only with written approval from a licensed prescriber.",cat:"Medicines"},
    {t:"Over-the-counter medicines",d:"Medications available without a prescription, approved for self-directed use when label is followed.",cat:"Medicines"},
    {t:"Medicine misuse",d:"Using a medication in ways other than intended — even without intent to abuse.",cat:"Safety"},
    {t:"Medicine abuse",d:"Intentionally using a medication for non-medical reasons; illegal and dangerous.",cat:"Safety"},
    {t:"Drug overdose",d:"A toxic, potentially fatal reaction when a drug is taken in an amount the body cannot safely process.",cat:"Safety"},
    {t:"Fentanyl",d:"A synthetic opioid 50–100× more potent than morphine; now found in counterfeit pills — responsible for ~80% of teen overdose deaths.",cat:"Drugs"},
    {t:"Naloxone",d:"A medication (Narcan) that rapidly reverses opioid overdose — now available OTC without prescription.",cat:"Safety"},
    {t:"Synergistic effect",d:"When two medicines together produce a greater combined effect than either alone — can be dangerous.",cat:"Safety"},
    {t:"Drug misuse",d:"Using a medication in a manner other than intended (wrong dose, person, or purpose).",cat:"Safety"},
    {t:"Drug abuse",d:"Intentional use of a substance to alter mood or perception in a harmful way.",cat:"Safety"},
    {t:"Tolerance",d:"The need for increasing amounts of a drug to achieve the same effect.",cat:"Drugs"},
    {t:"Dependence",d:"A physical or psychological need for a substance to function normally.",cat:"Drugs"},
    {t:"Addiction",d:"A chronic brain disorder involving compulsive drug use despite harmful consequences.",cat:"Drugs"},
    {t:"Stimulant",d:"A drug that speeds up central nervous system activity.",cat:"Drugs"},
    {t:"Depressant",d:"A drug that slows central nervous system activity.",cat:"Drugs"},
    {t:"Opioid",d:"A class of drugs that block pain receptors and carry high addiction potential.",cat:"Drugs"},
  ]},
  20: {title:"Tobacco", color:"#FF3B5C", terms:[
    {t:"Nicotine",d:"The addictive stimulant drug found in all tobacco products and most e-cigarettes.",cat:"Tobacco"},
    {t:"Carcinogen",d:"A cancer-causing substance; tobacco smoke contains at least 70 known carcinogens.",cat:"Tobacco"},
    {t:"Tar",d:"The thick, sticky residue produced when tobacco burns; destroys cilia and alveoli.",cat:"Tobacco"},
    {t:"Carbon monoxide",d:"A colorless, odorless poisonous gas in tobacco smoke that displaces oxygen in the blood.",cat:"Tobacco"},
    {t:"Leukoplakia",d:"Thickened, white, leathery patches inside the mouth caused by smokeless tobacco use.",cat:"Tobacco"},
    {t:"Nicotine withdrawal",d:"The physical and psychological symptoms that occur when a tobacco user stops using nicotine.",cat:"Cessation"},
    {t:"Nicotine substitutes",d:"Products (patches, gum, lozenges) that deliver controlled doses of nicotine to ease withdrawal.",cat:"Cessation"},
    {t:"Environmental tobacco smoke",d:"Air contaminated by tobacco smoke; also called secondhand smoke.",cat:"Secondhand"},
    {t:"Mainstream smoke",d:"Smoke exhaled from a smoker's lungs.",cat:"Secondhand"},
    {t:"Sidestream smoke",d:"Smoke from the burning end of a cigarette; contains higher concentrations of toxic substances.",cat:"Secondhand"},
    {t:"E-cigarettes",d:"Electronic devices that heat a nicotine liquid to create an aerosol — NOT water vapor — also called vaping.",cat:"Tobacco"},
    {t:"COPD",d:"Chronic Obstructive Pulmonary Disease — a group of lung diseases including emphysema and chronic bronchitis.",cat:"Tobacco"},
    {t:"Emphysema",d:"A lung disease where alveoli are destroyed, causing severe breathing difficulty.",cat:"Tobacco"},
    {t:"Secondhand smoke",d:"Tobacco smoke inhaled by a non-smoker in the vicinity of someone smoking.",cat:"Secondhand"},
    {t:"EVALI",d:"E-cigarette or Vaping Product Use-Associated Lung Injury — a serious lung condition linked to vaping.",cat:"Tobacco"},
    {t:"Cessation",d:"The act of stopping a behavior, such as quitting tobacco use.",cat:"Cessation"},
    {t:"Formaldehyde",d:"A toxic chemical in tobacco smoke, also used in embalming, that damages lung tissue.",cat:"Tobacco"},
    {t:"Nicotine replacement therapy",d:"Products like the patch, gum or lozenge that give controlled nicotine to ease quitting.",cat:"Cessation"},
    {t:"Vaping",d:"Inhaling an aerosol made by heating a liquid in an e-cigarette.",cat:"Tobacco"},
    {t:"Smokeless tobacco",d:"Tobacco that is chewed or sniffed rather than smoked; it causes mouth cancer and gum disease.",cat:"Tobacco"},
  ]},
  21: {title:"Alcohol", color:"#FF3B5C", terms:[
    {t:"Ethanol",d:"The type of alcohol found in beverages; a powerful, addictive depressant drug.",cat:"Alcohol"},
    {t:"Depressant",d:"A drug that slows the central nervous system — alcohol is a depressant.",cat:"Alcohol"},
    {t:"Intoxication",d:"The state in which alcohol has significantly impaired a person's physical and mental control.",cat:"Alcohol"},
    {t:"Binge drinking",d:"Consuming enough alcohol to reach a BAC of 0.08% or above within about 2 hours.",cat:"Alcohol"},
    {t:"Alcohol poisoning",d:"A severe, potentially fatal physical reaction to alcohol overdose — requires immediate 911 response.",cat:"Alcohol"},
    {t:"Blood alcohol concentration",d:"The percentage of alcohol in a person's blood — the standard measure of intoxication for driving.",cat:"Alcohol"},
    {t:"Psychological dependence",d:"A condition in which a person believes they need alcohol to feel good or function normally.",cat:"Dependence"},
    {t:"Physiological dependence",d:"A condition in which the body has a chemical need for alcohol; stopping causes physical withdrawal.",cat:"Dependence"},
    {t:"Alcohol use disorder",d:"A chronic brain disease involving compulsive alcohol use despite devastating consequences.",cat:"Dependence"},
    {t:"Fetal Alcohol Spectrum Disorders",d:"A range of permanent conditions caused by alcohol exposure during pregnancy — leading preventable cause of intellectual disability.",cat:"Effects"},
    {t:"Cirrhosis",d:"Severe scarring of the liver caused by long-term alcohol abuse.",cat:"Effects"},
    {t:"Tolerance",d:"The need for more alcohol to feel the same effect as before.",cat:"Dependence"},
    {t:"Withdrawal",d:"Physical and psychological symptoms that occur when a dependent person stops drinking.",cat:"Dependence"},
    {t:"Peer pressure",d:"Social influence from peers that encourages a person to conform to group behaviors.",cat:"Alcohol"},
    {t:"Standard drink",d:"About 14 grams of pure alcohol, such as 12 oz of beer, 5 oz of wine or 1.5 oz of liquor.",cat:"Alcohol"},
    {t:"Recovery position",d:"Lying someone on their side so they won't choke if they vomit.",cat:"Alcohol"},
    {t:"Cardiomyopathy",d:"Weakening of the heart muscle, which heavy drinking can cause.",cat:"Effects"},
    {t:"Fatty liver",d:"Fat buildup in the liver, an early sign of damage from heavy drinking.",cat:"Effects"},
    {t:"Support group",d:"A group of people facing the same problem who help each other recover, such as AA.",cat:"Dependence"},
    {t:"Underage drinking",d:"Drinking alcohol before age 21, which is illegal in the U.S.",cat:"Alcohol"},
  ]},
  22: {title:"Illegal Drugs", color:"#FF3B5C", terms:[
    {t:"Substance abuse",d:"The unnecessary or improper use of chemical substances for non-medical purposes.",cat:"Drugs"},
    {t:"Illegal drugs",d:"Chemical substances that people of any age may not lawfully manufacture, possess, buy, or sell.",cat:"Drugs"},
    {t:"Addiction",d:"A chronic brain disease involving compulsive drug use despite devastating consequences.",cat:"Drugs"},
    {t:"Marijuana",d:"A plant whose dried leaves and flowers contain THC; legally variable by state but illegal for minors everywhere.",cat:"Drugs"},
    {t:"Inhalants",d:"Substances whose fumes are inhaled to produce intoxication; can cause sudden death even on first use.",cat:"Drugs"},
    {t:"Anabolic steroids",d:"Synthetic hormones similar to testosterone; non-medical use is illegal and causes serious health damage.",cat:"Drugs"},
    {t:"Hallucinogens",d:"Drugs that alter mood, thoughts, and sensory perceptions, causing hallucinations.",cat:"Drugs"},
    {t:"Opiates",d:"Drugs derived from or chemically similar to opium; highly effective pain relievers and highly addictive.",cat:"Drugs"},
    {t:"Stimulants",d:"Drugs that speed up central nervous system activity — cocaine, meth, amphetamines.",cat:"Drugs"},
    {t:"Rehabilitation",d:"The process of medical and psychological treatment for physiological or psychological dependence on a drug.",cat:"Recovery"},
    {t:"Counterfeit pills",d:"Pills made to look exactly like real prescriptions but containing fentanyl or other dangerous substances.",cat:"Safety"},
    {t:"THC",d:"Tetrahydrocannabinol — the psychoactive compound in marijuana that produces its effects.",cat:"Drugs"},
    {t:"Dopamine",d:"A neurotransmitter in the brain's reward system; many addictive drugs trigger massive dopamine release.",cat:"Drugs"},
    {t:"Methamphetamine",d:"A highly addictive stimulant that causes intense euphoria followed by severe physical and mental damage.",cat:"Drugs"},
    {t:"Opioid",d:"A class of drugs — including heroin, morphine, and fentanyl — that bind to pain receptors and cause euphoria.",cat:"Drugs"},
    {t:"Fentanyl",d:"A synthetic opioid 50x stronger than heroin; now the leading cause of overdose deaths in the U.S.",cat:"Drugs"},
    {t:"Naloxone",d:"A medication that rapidly reverses opioid overdose; available as Narcan nasal spray.",cat:"Safety"},
    {t:"MDMA",d:"3,4-methylenedioxymethamphetamine (Ecstasy/Molly) — a stimulant/hallucinogen that damages serotonin neurons.",cat:"Drugs"},
    {t:"Anhedonia",d:"The inability to feel pleasure from normally enjoyable activities, often caused by drug-induced receptor damage.",cat:"Drugs"},
    {t:"Gateway drug",d:"A substance (like alcohol or marijuana) whose early use is associated with higher likelihood of using harder drugs later.",cat:"Drugs"},
  ]},
  23: {title:"Communicable Diseases", color:"#aaaaaa", terms:[
    {t:"Communicable disease",d:"A disease that spreads from one organism to another or through the environment.",cat:"Disease"},
    {t:"Infection",d:"The condition that results when pathogens multiply in the body and damage cells.",cat:"Disease"},
    {t:"Vector",d:"An organism (such as a mosquito or tick) that carries and transmits pathogens.",cat:"Transmission"},
    {t:"Immune system",d:"The body's network of cells, tissues, organs, and chemicals that fight pathogens.",cat:"Immunity"},
    {t:"Antibody",d:"A protein produced by B cells that targets a specific antigen, marking it for destruction.",cat:"Immunity"},
    {t:"Vaccine",d:"A preparation that stimulates the immune system to develop protection against a specific disease.",cat:"Immunity"},
    {t:"Immunity",d:"The state of being protected against a specific disease.",cat:"Immunity"},
    {t:"Inflammatory response",d:"The immune system's first response to tissue damage or infection.",cat:"Immunity"},
    {t:"Pandemic",d:"A global outbreak of an infectious disease — COVID-19 is the most recent major example.",cat:"Epidemiology"},
    {t:"Epidemic",d:"A disease outbreak that affects many people in the same place at the same time.",cat:"Epidemiology"},
    {t:"Emerging infections",d:"Communicable diseases whose occurrence in humans has increased significantly in recent decades.",cat:"Epidemiology"},
    {t:"mRNA vaccine",d:"A vaccine that uses genetic instructions to teach cells to make a harmless piece of a pathogen — COVID-19 type.",cat:"Immunity"},
    {t:"Pathogen",d:"A microorganism (virus, bacteria, fungus, parasite) that causes disease.",cat:"Disease"},
    {t:"Virus",d:"A non-living pathogen that replicates inside host cells; not treatable with antibiotics.",cat:"Disease"},
    {t:"Bacteria",d:"Single-celled living organisms; many are harmless; some cause disease and can be treated with antibiotics.",cat:"Disease"},
    {t:"Herd immunity",d:"When enough of a population is immune to a disease that it stops spreading, protecting even unvaccinated individuals.",cat:"Immunity"},
    {t:"Incubation period",d:"The time between exposure to a pathogen and the appearance of symptoms.",cat:"Transmission"},
    {t:"Fomite",d:"An object or surface, like a doorknob or phone, that can carry pathogens.",cat:"Transmission"},
    {t:"Antibiotic",d:"A medicine that kills or stops bacteria; it does not work on viruses.",cat:"Disease"},
    {t:"Memory cells",d:"Immune cells that remember a pathogen so the body responds faster if it returns.",cat:"Immunity"},
  ]},
  24: {title:"STIs & HIV/AIDS", color:"#aaaaaa", terms:[
    {t:"Sexually transmitted infection",d:"An infection passed from person to person through sexual contact; also called STD.",cat:"STIs"},
    {t:"Asymptomatic",d:"Showing no symptoms despite being infected — makes STIs especially dangerous.",cat:"STIs"},
    {t:"HPV",d:"Human Papillomavirus — the most common STI; high-risk strains cause cancer. Prevented by Gardasil 9.",cat:"STIs"},
    {t:"Chlamydia",d:"The most reported bacterial STI; mostly asymptomatic; curable with antibiotics; untreated causes infertility.",cat:"STIs"},
    {t:"Gonorrhea",d:"The second most common bacterial STI; drug resistance is a growing crisis.",cat:"STIs"},
    {t:"Syphilis",d:"Progresses through stages; congenital syphilis up 700% over the past decade; curable with penicillin.",cat:"STIs"},
    {t:"HIV",d:"Human Immunodeficiency Virus — attacks CD4+ T cells, progressively destroying the immune system.",cat:"HIV"},
    {t:"AIDS",d:"Acquired Immunodeficiency Syndrome — the final stage of HIV infection.",cat:"HIV"},
    {t:"Antiretroviral therapy",d:"The combination of medications that suppress HIV replication — allows near-normal lifespan.",cat:"HIV"},
    {t:"U=U",d:"Undetectable equals Untransmittable — people with HIV on effective ART cannot sexually transmit the virus.",cat:"HIV"},
    {t:"PrEP",d:"Pre-Exposure Prophylaxis — reduces HIV transmission risk from sex by ~99% when taken as prescribed.",cat:"HIV"},
    {t:"Gardasil 9",d:"The current HPV vaccine covering 9 strains — recommended for all people ages 9–26.",cat:"STIs"},
    {t:"Abstinence",d:"Refraining from sexual activity; the only 100% effective method to prevent STIs and pregnancy.",cat:"STIs"},
    {t:"Herpes",d:"A viral STI with no cure that can be managed with medicine.",cat:"STIs"},
    {t:"Hepatitis B",d:"A viral infection of the liver that can spread sexually; a vaccine prevents it.",cat:"STIs"},
    {t:"Trichomoniasis",d:"A common parasitic STI that is treatable with medicine.",cat:"STIs"},
    {t:"CD4 T-cells",d:"Immune system \"commander\" cells that HIV attacks.",cat:"HIV"},
    {t:"Partner notification",d:"Letting partners know about a possible STI exposure so they can get tested; health departments can do it anonymously.",cat:"STIs"},
    {t:"Stigma",d:"Negative attitudes that keep people from getting tested, treated or telling partners.",cat:"STIs"},
    {t:"STI testing",d:"Medical tests that show whether a person has an STI; the only way to know your status.",cat:"STIs"},
  ]},
  25: {title:"Noncommunicable Diseases & Disabilities", color:"#aaaaaa", terms:[
    {t:"Noncommunicable disease",d:"A disease that cannot be spread from person to person.",cat:"Disease"},
