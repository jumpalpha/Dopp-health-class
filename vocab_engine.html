// ENGINE
// ═══════════════════════════════════════════════════════════
let chapterNum = parseInt(new URLSearchParams(location.search).get('ch')) || 1;
const hashMap = { speedquiz:'speedquiz', wordbuild:'wordbuild', conceptmap:'conceptmap' };
let gameMode = hashMap[location.hash.replace('#','')] || 'flashcard';
let terms = [];
let idx = 0, correctCount = 0, wrongCount = 0, streak = 0;
// Checklist evidence: answers that were really attempted (not skipped / revealed / timed out).
let realAnswered = 0, realCorrect = 0, roundStart = Date.now(), roundLogged = false;
let timerInt = null;

function load() {
  const ch = ALL_CHAPTERS[chapterNum] || ALL_CHAPTERS[1];
  terms = shuffle([...ch.terms]);
  document.getElementById('nav-title').textContent = `Ch ${chapterNum} — ${ch.title}`;
  document.getElementById('chapter-info').textContent = `${terms.length} terms`;
  document.title = `Ch ${chapterNum} Vocab — Legend of Wellness`;
  // Highlight the correct tab based on initial gameMode
  document.querySelectorAll('.game-tab').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(gameMode));
  });
  resetGame();
  renderGame();
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function switchGame(mode, btn) {
  gameMode = mode;
  document.querySelectorAll('.game-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  clearInterval(timerInt);
  resetGame();
  renderGame();
}

function resetGame() {
  idx = 0; correctCount = 0; wrongCount = 0; streak = 0;
  realAnswered = 0; realCorrect = 0; roundStart = Date.now(); roundLogged = false;
  terms = shuffle([...ALL_CHAPTERS[chapterNum].terms]);
  clearInterval(timerInt);
  updateHUD();
  updateProgress();
}

function updateHUD() {
  document.getElementById('nav-score').textContent = `+${correctCount}`;
  document.getElementById('score-hud').innerHTML = `
    <div class="hud-pill correct">✓ ${correctCount}</div>
    <div class="hud-pill wrong">✗ ${wrongCount}</div>
    ${streak >= 3 ? `<div class="hud-pill streak">🔥 ${streak} streak</div>` : ''}
    <div class="hud-pill total">${idx}/${terms.length}</div>`;
}

function updateProgress() {
  document.getElementById('progress-fill').style.width = (idx / terms.length * 100) + '%';
}


// ── HOW TO PASS (checklist rules; must match cl_log in supabase/student_checklist.sql) ──
const HOWTO = {
  flashcard: [
    'Read the term, then <b>tap the card to flip it</b> and read the definition.',
    'Tap <b>✓ Got It</b> or <b>✗ Still Learning</b>. Cards you don\'t flip first <b>don\'t count</b>.',
    'Be honest — only tap Got It if you really knew it.',
    'Go through the <b>whole deck</b> to the results screen.',
    'Mark <b>70% or more</b> as Got It (after flipping).'],
  speedquiz: [
    'Pick the term that matches the definition <b>before the timer runs out</b>. Timeouts don\'t count.',
    'Answer <b>every question</b> to reach the results screen.',
    'Get <b>70% or more</b> correct.'],
  wordbuild: [
    'Build each word with the letter tiles (or use “3 choices”), then check it.',
    '<b>Skip</b> and <b>Reveal answer</b> don\'t count as answers.',
    'Finish <b>every word</b> to reach the results screen.',
    'Get <b>70% or more</b> correct.'],
  conceptmap: [
    'Drag every term into a category, then tap <b>Check</b> on each set.',
    'Terms you don\'t place and check don\'t count.',
    'Finish <b>every set</b> to reach the results screen.',
    'Get <b>70% or more</b> correct.']
};
function renderHowTo() {
  const el = document.getElementById('howto'); if (!el) return;
  el.innerHTML = `<div class="howto-title">✓ How to pass for your checklist</div>
    <ol><li><b>Sign in first</b> (Quest login) or nothing is saved.</li>${(HOWTO[gameMode] || []).map(x => `<li>${x}</li>`).join('')}</ol>
    <div class="howto-note">Don't rush — tapping through too fast won't count. When you pass, the results screen says “✓ Counts on your checklist.”</div>`;
}

function renderGame() {
  renderHowTo();
  if (idx >= terms.length) { renderResults(); return; }
  const gc = document.getElementById('game-content');
  if (gameMode === 'flashcard') renderFlashcard(gc);
  else if (gameMode === 'speedquiz') renderSpeedQuiz(gc);
  else if (gameMode === 'wordbuild') renderWordBuild(gc);
  else if (gameMode === 'conceptmap') renderConceptMap(gc);
}

// ── FLASHCARD ──
let fc_flipped = false;
function renderFlashcard(gc) {
  fc_flipped = false;
  const term = terms[idx];
  gc.innerHTML = `
    <div class="flashcard-wrap" onclick="flipCard()">
      <div class="flashcard" id="fc">
        <div class="card-face card-front">
          <div class="card-label">Term</div>
          <div class="card-term">${term.t}</div>
          <div class="card-hint">Tap to reveal definition</div>
        </div>
        <div class="card-face card-back">
          <div class="card-label">Definition</div>
          <div class="card-def">${term.d}</div>
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="btn btn-flip" onclick="flipCard()">🔄 Flip</button>
      <button class="btn btn-correct" onclick="fcScore(true)">✓ Got It</button>
      <button class="btn btn-wrong" onclick="fcScore(false)">✗ Still Learning</button>
      <button class="btn btn-restart" onclick="resetGame();renderGame()">↺ Restart</button>
    </div>`;
}
function flipCard() {
  fc_flipped = !fc_flipped;
  const fc = document.getElementById('fc');
  if (fc) fc.classList.toggle('flipped', fc_flipped);
}
function fcScore(correct) {
  if (fc_flipped) { realAnswered++; if (correct) realCorrect++; }
  if (correct) { correctCount++; streak++; } else { wrongCount++; streak = 0; }
  idx++;
  updateHUD(); updateProgress(); renderGame();
}

// ── SPEED QUIZ ──
let sq_answered = false, sq_seconds = 30;
function renderSpeedQuiz(gc) {
  sq_answered = false; sq_seconds = 30;
  const term = terms[idx];
  const wrong = shuffle(terms.filter((_, i) => i !== idx)).slice(0, 3);
  const opts = shuffle([term, ...wrong]);
  const pct = sq_seconds / 30 * 100;
  gc.innerHTML = `
    <div class="quiz-question">
      <div class="quiz-q-label">What is the definition of...</div>
      <div class="quiz-def">${term.d}</div>
      <div class="quiz-timer"><div class="quiz-timer-fill" id="qtf" style="width:100%"></div></div>
    </div>
    <div class="quiz-options">${opts.map((o, i) => `<div class="quiz-opt" id="qo${i}" onclick="sqPick(${i},${o.t === term.t},'${o.t.replace(/'/g,"\\'")}')"><strong>${'ABCD'[i]}.</strong> ${o.t}</div>`).join('')}</div>
    <div class="quiz-explanation" id="qex">${term.d} — <em>${term.t}</em></div>
    <div class="fc-controls">
      <button class="btn btn-restart" onclick="resetGame();renderGame()">↺ Restart</button>
    </div>`;
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    sq_seconds = Math.max(0, sq_seconds - 0.1);
    const el = document.getElementById('qtf');
    if (el) { el.style.width = (sq_seconds / 30 * 100) + '%'; if (sq_seconds < 10) el.classList.add('warning'); }
    if (sq_seconds <= 0) { clearInterval(timerInt); sqTimeout(); }
  }, 100);
}
function sqPick(i, correct, term) {
  if (sq_answered) return; sq_answered = true; clearInterval(timerInt);
  realAnswered++; if (correct) realCorrect++;
  const el = document.getElementById('qo' + i);
  if (el) el.classList.add(correct ? 'correct' : 'wrong');
  document.querySelectorAll('.quiz-opt').forEach(o => o.classList.add('disabled'));
  if (!correct) {
    document.querySelectorAll('.quiz-opt').forEach(o => { if (o.textContent.includes(terms[idx].t)) o.classList.add('correct'); });
  }
  const ex = document.getElementById('qex'); if (ex) ex.classList.add('show');
  if (correct) { correctCount++; streak++; } else { wrongCount++; streak = 0; }
  idx++;
  updateHUD(); updateProgress();
  setTimeout(() => renderGame(), 1800);
}
function sqTimeout() {
  if (sq_answered) return; sq_answered = true; wrongCount++; streak = 0; idx++;
  updateHUD(); updateProgress();
  const ex = document.getElementById('qex'); if (ex) ex.classList.add('show');
  setTimeout(() => renderGame(), 1800);
}

// ── WORD BUILDER ──
// Reading-friendly: tap letter tiles into boxes (no spelling from memory), first letter given,
// read-aloud button, undo/clear, and an optional "3 choices" mode for any word.
let wb = null;
const wbIsLetter = ch => /[A-Z0-9]/.test(ch);
function renderWordBuild(gc) {
  const term = terms[idx];
  const chars = term.t.toUpperCase().split('');
  const firstIdx = chars.findIndex(wbIsLetter);
  // slots: letters to fill; spaces = gaps; other punctuation shown as-is
  const slots = chars.map((ch, i) => ({ ch, kind: ch === ' ' ? 'gap' : !wbIsLetter(ch) ? 'fixed' : i === firstIdx ? 'given' : 'fill', val: i === firstIdx || !wbIsLetter(ch) ? ch : '' }));
  const tiles = shuffle(slots.filter(s => s.kind === 'fill').map(s => s.ch)).map(l => ({ l, used: false }));
  wb = { slots, tiles, stack: [], done: false, choices: false };
  gc.innerHTML = `
    <div class="wb-def">
      <div class="wb-def-label">What term matches this definition?</div>
      <div class="wb-def-text">${term.d}</div>
      <button class="wb-tts" onclick="wbSpeak()">🔊 Read to me</button>
    </div>
    <div id="wb-area"></div>
    <div class="wb-feedback" id="wb-fb"></div>
    <div class="fc-controls">
      <button class="btn btn-next" onclick="wbSkip()">Skip →</button>
      <button class="btn btn-restart" onclick="resetGame();renderGame()">↺ Restart</button>
    </div>`;
  wbPaint();
}
function wbPaint() {
  const area = document.getElementById('wb-area'); if (!area || !wb) return;
  if (wb.choices) {
    area.innerHTML = `<div style="text-align:center;font-size:13px;color:var(--dim);margin-bottom:4px">Tap the matching term:</div>
      <div class="wb-choices">${wb.choices.map((c, i) => `<button class="wb-choice" id="wbc${i}" onclick="wbPick(${i})">${c}</button>`).join('')}</div>`;
    return;
  }
  const nextSlot = wb.slots.findIndex(s => s.kind === 'fill' && !s.val);
  area.innerHTML = `
    <div class="wb-slots" id="wb-slots">${(() => {
      const words = [[]];
      wb.slots.forEach((s, i) => { if (s.kind === 'gap') words.push([]); else words[words.length - 1].push(`<div class="wb-slot ${s.kind}${i === nextSlot ? ' next' : ''}">${s.val}</div>`); });
      return words.map(w => `<div class="wb-word">${w.join('')}</div>`).join('');
    })()}</div>
    <div style="text-align:center;font-size:13px;color:var(--dim);margin-bottom:8px">Tap the letters in order (or type them):</div>
    <div class="wb-hint-row">${wb.tiles.map((t, i) => `<div class="wb-letter${t.used ? ' used' : ''}" onclick="wbTap(${i})">${t.l}</div>`).join('')}</div>
    <div class="wb-tools">
      <button class="wb-tool" onclick="wbUndo()">⌫ Undo</button>
      <button class="wb-tool" onclick="wbClear()">✕ Clear</button>
      <button class="wb-tool" onclick="wbShowChoices()">🔢 Show 3 choices</button>
      <button class="wb-tool" onclick="wbReveal()">👁 Reveal answer</button>
    </div>`;
}
function wbTap(i) {
  if (!wb || wb.done || wb.choices) return;
  const t = wb.tiles[i]; if (!t || t.used) return;
  const s = wb.slots.findIndex(x => x.kind === 'fill' && !x.val); if (s < 0) return;
  t.used = true; wb.slots[s].val = t.l; wb.stack.push({ tile: i, slot: s });
  wbPaint();
  if (!wb.slots.some(x => x.kind === 'fill' && !x.val)) wbCheck();
}
function wbUndo() {
  if (!wb || wb.done || !wb.stack.length) return;
  const m = wb.stack.pop(); wb.tiles[m.tile].used = false; wb.slots[m.slot].val = ''; wbPaint();
}
function wbClear() { if (!wb || wb.done) return; while (wb.stack.length) wbUndo(); }
function wbSpeak() {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(terms[idx].d); u.rate = 0.9; speechSynthesis.speak(u);
  } catch (e) {}
}
function wbFinish(correct, msg) {
  wb.done = true;
  realAnswered++; if (correct) realCorrect++;
  const fb = document.getElementById('wb-fb');
  if (fb) { fb.className = 'wb-feedback show ' + (correct ? 'good' : 'bad'); fb.textContent = msg; }
  if (correct) { correctCount++; streak++; } else { wrongCount++; streak = 0; }
  idx++;
  updateHUD(); updateProgress();
  setTimeout(() => { try { speechSynthesis.cancel(); } catch (e) {} renderGame(); }, correct ? 1400 : 2400);
}
function wbCheck() {
  if (!wb || wb.done) return;
  const built = wb.slots.map(s => s.kind === 'gap' ? ' ' : s.val).join('');
  const correct = built === terms[idx].t.toUpperCase();
  const box = document.getElementById('wb-slots'); if (box) box.classList.add(correct ? 'good' : 'bad');
  wbFinish(correct, correct ? `✓ Correct! "${terms[idx].t}"` : `✗ Not quite. The answer was "${terms[idx].t}"`);
}
function wbShowChoices() {
  if (!wb || wb.done) return;
  const right = terms[idx].t;
  const others = shuffle(terms.filter(x => x.t !== right).map(x => x.t)).slice(0, 2);
  wb.choices = shuffle([right, ...others]);
  wbPaint();
}
function wbPick(i) {
  if (!wb || wb.done) return;
  const right = terms[idx].t, correct = wb.choices[i] === right;
  const el = document.getElementById('wbc' + i); if (el) el.classList.add(correct ? 'good' : 'bad');
  if (!correct) { const r = wb.choices.indexOf(right); const re = document.getElementById('wbc' + r); if (re) re.classList.add('good'); }
  wbFinish(correct, correct ? `✓ Correct! "${right}"` : `✗ The answer was "${right}"`);
}
function wbReveal() {
  if (!wb || wb.done) return;
  wb.done = true;
  wb.slots.forEach(s => { if (s.kind === 'fill') s.val = s.ch; }); wb.choices = false; wbPaint();
  const box = document.getElementById('wb-slots'); if (box) box.classList.add('bad');
  const fb = document.getElementById('wb-fb');
  if (fb) { fb.className = 'wb-feedback show bad'; fb.textContent = `Answer: ${terms[idx].t}`; }
  wrongCount++; streak = 0; idx++;
  updateHUD(); updateProgress();
  setTimeout(() => renderGame(), 2200);
}
function wbSkip() { if (wb && wb.done) return; wrongCount++; streak = 0; idx++; updateHUD(); updateProgress(); renderGame(); }
// keyboard: a letter uses a matching tile, Backspace undoes
document.addEventListener('keydown', e => {
  if (gameMode !== 'wordbuild' || !wb || wb.done || wb.choices) return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'Backspace') { e.preventDefault(); wbUndo(); return; }
  const k = (e.key || '').toUpperCase();
  if (k.length === 1 && wbIsLetter(k)) { const i = wb.tiles.findIndex(t => !t.used && t.l === k); if (i >= 0) wbTap(i); }
});

// ── CONCEPT MAP ──
let cm_placements = {}, cm_checked = false;
function renderConceptMap(gc) {
  cm_placements = {}; cm_checked = false;
  const batch = terms.slice(idx, Math.min(idx + 12, terms.length));
  const cats = [...new Set(batch.map(t => t.cat))];
  const catColors = ['#38BFFF','#00E5A0','#FF3B5C','#a855f7','#FFD700','#FF8C00'];
  const shuffled = shuffle([...batch]);
  gc.innerHTML = `
    <div class="cmap-instruction">Drag each term into the correct category. Click Check when done.</div>
    <div class="cmap-word-bank">
      <div class="cmap-bank-title">Word Bank</div>
      <div class="cmap-bank-chips" id="word-bank">
        ${shuffled.map(t => `<div class="cmap-chip" id="chip-${t.t.replace(/\s/g,'_')}" draggable="true" ondragstart="cmDragStart(event,'${t.t.replace(/'/g,"\\'")}','${t.cat.replace(/'/g,"\\'")}')"><span>${t.t}</span></div>`).join('')}
      </div>
    </div>
    <div class="cmap-categories">
      ${cats.map((cat, ci) => `
        <div class="cmap-cat" id="cat-${ci}" style="--cat-border:${catColors[ci]}44;--cat-bg:${catColors[ci]}08;--cat-color:${catColors[ci]}"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="cmDrop(event,'${cat.replace(/'/g,"\\'")}',${ci})">
          <div class="cmap-cat-title">${cat}</div>
          <div class="cmap-drop-zone" id="dz-${ci}"></div>
        </div>`).join('')}
    </div>
    <div class="fc-controls">
      <button class="btn btn-correct" onclick="cmCheck()">✓ Check Answers</button>
      <button class="btn btn-restart" onclick="renderGame()">↺ Try Again</button>
      <button class="btn btn-next" onclick="cmNext()">Next Set →</button>
    </div>`;
}
let cmDragData = null;
function cmDragStart(e, term, cat) { cmDragData = { term, cat }; }
function cmDrop(e, cat, ci) {
  e.preventDefault();
  document.getElementById('cat-' + ci).classList.remove('drag-over');
  if (!cmDragData) return;
  cm_placements[cmDragData.term] = { placed: cat, correct: cmDragData.cat };
  const dz = document.getElementById('dz-' + ci);
  const chip = document.getElementById('chip-' + cmDragData.term.replace(/\s/g, '_'));
  if (dz && chip) { dz.appendChild(chip); }
  cmDragData = null;
}
function cmCheck() {
  if (cm_checked) return;
  cm_checked = true;
  let c = 0, w = 0;
  Object.entries(cm_placements).forEach(([term, data]) => {
    const chip = document.getElementById('chip-' + term.replace(/\s/g, '_'));
    if (!chip) return;
    if (data.placed === data.correct) { chip.classList.add('correct-chip'); c++; }
    else { chip.classList.add('wrong-chip'); w++; }
  });
  correctCount += c; wrongCount += w; streak = c > 0 ? streak + c : 0;
  realAnswered += c + w; realCorrect += c;
  idx = Math.min(idx + 12, terms.length);
  updateHUD(); updateProgress();
}
function cmNext() { if (!cm_checked) idx = Math.min(idx + 12, terms.length); updateHUD(); updateProgress(); renderGame(); }

// ── RESULTS ──
function renderResults() {
  clearInterval(timerInt);
  if (!roundLogged && window.ChecklistTrack) {
    roundLogged = true;
    ChecklistTrack.vocab(chapterNum, gameMode, { total: terms.length, answered: realAnswered, correct: realCorrect, ms: Date.now() - roundStart });
  }
  const total = correctCount + wrongCount;
  const pct = total ? Math.round(correctCount / total * 100) : 0;
  const grade = pct >= 90 ? 'A' : pct >= 80 ? 'B' : pct >= 70 ? 'C' : 'D';
  const icons = {A:'🏆',B:'⭐',C:'💪',D:'📚'};
  const msgs = {A:'Perfect! You mastered all terms!',B:'Great work! Almost there!',C:'Good effort — review the missed terms.',D:'Keep studying — you\'ve got this!'};
  document.getElementById('game-content').innerHTML = `
    <div class="results-card">
      <div class="results-icon">${icons[grade]}</div>
      <div class="results-grade ${grade.toLowerCase()}">${pct}%</div>
      <div class="results-sub">${msgs[grade]}</div>
      ${window.ChecklistTrack && ChecklistTrack.signedIn() ? (realCorrect * 10 >= terms.length * 7
        ? '<div class="results-sub" style="color:var(--emerald);font-weight:800">✓ Counts on your checklist (70%+ correct)</div>'
        : '<div class="results-sub" style="color:var(--crimson);font-weight:800">Get 70% right to check this off on your checklist. Try again!</div>') : ''}
      <div class="results-stats">
        <div class="rs"><div class="rs-num" style="color:var(--emerald)">${correctCount}</div><div class="rs-label">Correct</div></div>
        <div class="rs"><div class="rs-num" style="color:var(--crimson)">${wrongCount}</div><div class="rs-label">Missed</div></div>
        <div class="rs"><div class="rs-num">${pct}%</div><div class="rs-label">Score</div></div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="btn btn-correct" onclick="resetGame();renderGame()">↺ Play Again</button>
      <button class="btn btn-next" onclick="history.back()">← Back to Chapter</button>
    </div>`;
  document.getElementById('progress-fill').style.width = '100%';
}

load();
</script>
<script src="checklist_track.js"></script>
</body>
