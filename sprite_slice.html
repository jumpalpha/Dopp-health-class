<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Sprite Slice</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const W = 420, H = 640, G = 900;
const GOOD = ART.HEALTHY, BAD = ART.JUNK;
const FACTS = { apple: 'Apples are full of fiber.', orange: 'Oranges are packed with vitamin C.', grape: 'Grapes count toward your fruit for the day.', carrot: 'Carrots help keep your eyes healthy.',
  broccoli: 'Broccoli is loaded with vitamins C and K.', banana: 'Bananas give quick energy and potassium.', water: 'Water keeps your brain sharp.', strawberry: 'Berries are full of antioxidants.' };
const JUICE = { apple: '#ff5c77', orange: '#ffa53b', grape: '#a46bff', carrot: '#ff8a2b', broccoli: '#5cd16b', banana: '#ffe14d', water: '#6fd0ff', strawberry: '#ff3b5c' };
let items, halves, splats, trail, last, swipeHits, waveT, lives, frenzyT, t, sliced, bestSwipe, flash;

function reset() { items = []; halves = []; splats = []; trail = []; last = null; swipeHits = 0; waveT = 0.8; lives = 3; frenzyT = 0; t = 0; sliced = 0; bestSwipe = 0; flash = 0; }

function launch(level, forceGood) {
  const r = Math.random();
  const bad = !forceGood && r < Math.min(0.3, 0.1 + level * 0.02);
  const power = !bad && !forceGood && Math.random() < 0.04 ? (lives < 3 && Math.random() < 0.5 ? 'heart' : 'star') : null;
  const x = 50 + Math.random() * (W - 100);
  items.push({ x, y: H + 30, vx: (W / 2 - x) * (0.35 + Math.random() * 0.5) + (Math.random() - 0.5) * 60, vy: -(760 + Math.random() * 200),
    kind: power || (bad ? BAD[Math.floor(Math.random() * BAD.length)] : GOOD[Math.floor(Math.random() * GOOD.length)]),
    bad, power, rot: 0, spin: (Math.random() - 0.5) * 6, r: power ? 24 : 26 });
}

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
  let u = L ? ((px - ax) * dx + (py - ay) * dy) / L : 0; u = Math.max(0, Math.min(1, u));
  return Math.hypot(px - (ax + u * dx), py - (ay + u * dy));
}

function endSwipe(A) {
  if (swipeHits >= 3) {
    const bonus = swipeHits * 10 * (frenzyT > 0 ? 2 : 1);
    A.addScore(bonus); A.sfx('coin'); A.toast('🔪 ' + swipeHits + '-fruit combo! +' + bonus);
  }
  bestSwipe = Math.max(bestSwipe, swipeHits); swipeHits = 0; last = null;
}

function slice(it, ax, ay, bx, by, A) {
  const ang = Math.atan2(by - ay, bx - ax);
  if (it.bad) {
    lives--; A.sfx('hit'); A.shake(10, 0.3); flash = 0.35;
    A.particles.burst(it.x, it.y, '#FF8FA3', 18, 220, 4); A.float('Junk! −1 ❤', it.x, it.y - 20, '#FF8FA3');
    endSwipe(A); trail = [];
    if (lives <= 0) A.gameOver();
    return;
  }
  [-1, 1].forEach(side => halves.push({ x: it.x, y: it.y, vx: it.vx * 0.5 + Math.cos(ang + Math.PI / 2) * side * 120, vy: Math.min(it.vy, 0) * 0.3 - 80,
    rot: it.rot, spin: side * 4, kind: it.kind, side, ang, life: 1.6 }));
  if (it.power === 'star') { frenzyT = 7; A.sfx('medal'); A.toast('⭐ Fruit frenzy! Double points for 7s'); for (let i = 0; i < 6; i++) setTimeout(() => A.state === 'play' && launch(0, true), i * 120); return; }
  if (it.power === 'heart') { lives = Math.min(3, lives + 1); A.sfx('medal'); A.float('+1 ❤', it.x, it.y - 20, '#FF5C77'); return; }
  sliced++; swipeHits++;
  const pts = 10 * (frenzyT > 0 ? 2 : 1);
  A.addScore(pts); A.sfx('point');
  splats.push({ x: it.x, y: it.y, c: JUICE[it.kind] || '#7CFFB2', r: 18 + Math.random() * 10, life: 2.5 });
  A.particles.burst(it.x, it.y, JUICE[it.kind] || '#7CFFB2', 10, 180, 3);
  A.float('+' + pts, it.x, it.y - 24, frenzyT > 0 ? '#FFD700' : '#ffffff');
  if (sliced % 20 === 0) A.toast('💡 ' + FACTS[it.kind], 2400);
}

function pointer(type, x, y, A) {
  if (type === 'down') { last = { x, y }; trail = [{ x, y, a: 1 }]; swipeHits = 0; return; }
  if (type === 'up') { endSwipe(A); return; }
  if (type !== 'drag' || !last) return;
  const ax = last.x, ay = last.y;
  if (Math.hypot(x - ax, y - ay) < 3) return;
  trail.push({ x, y, a: 1 }); if (trail.length > 14) trail.shift();
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (segDist(it.x, it.y, ax, ay, x, y) < it.r) { items.splice(i, 1); slice(it, ax, ay, x, y, A); if (A.state !== 'play' || !last) return; }
  }
  last = { x, y };
}

function update(dt, A) {
  if (!items) return;
  t += dt; flash = Math.max(0, flash - dt);
  trail.forEach(p => p.a -= dt * 5); trail = trail.filter(p => p.a > 0);
  halves.forEach(h => { h.vy += G * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.spin * dt; h.life -= dt; });
  halves = halves.filter(h => h.life > 0 && h.y < H + 60);
  splats.forEach(s => s.life -= dt); splats = splats.filter(s => s.life > 0);
  if (A.state === 'menu') { if (items.length < 3 && Math.random() < dt * 1.5) launch(0, true); }
  else if (A.state !== 'play') return;
  const level = A.state === 'play' ? Math.min(10, A.time / 10) : 0;
  if (A.state === 'play') {
    frenzyT = Math.max(0, frenzyT - dt);
    waveT -= dt;
    if (waveT <= 0) {
      const n = frenzyT > 0 ? 2 : 1 + Math.floor(Math.random() * (1 + level * 0.4));
      for (let i = 0; i < n; i++) setTimeout(() => A.state === 'play' && launch(level), i * 160);
      waveT = frenzyT > 0 ? 0.45 : Math.max(0.75, 1.7 - level * 0.09) * (0.8 + Math.random() * 0.4);
    }
  }
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.vy += G * dt * (frenzyT > 0 ? 0.8 : 1); it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.spin * dt;
    if (it.x < 24 || it.x > W - 24) { it.vx *= -0.6; it.x = Math.max(24, Math.min(W - 24, it.x)); }
    if (it.vy > 0 && it.y > H + 40) {
      items.splice(i, 1);
      if (A.state === 'play' && !it.bad && !it.power) {
        lives--; A.sfx('hit'); A.float('Dropped! −1 ❤', it.x, H - 40, '#FF8FA3');
        if (lives <= 0) { A.gameOver(); return; }
      }
    }
  }
}

function draw(ctx, A) {
  // wooden cutting board
  ctx.fillStyle = '#b07a45'; ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 46) { ctx.fillStyle = (y / 46) % 2 ? '#a8713d' : '#b9834e'; ctx.fillRect(0, y, W, 44); ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0, y + 44, W, 2); }
  ctx.strokeStyle = 'rgba(70,40,15,.18)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 14; i++) { const y = (i * 53) % H + 10; ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(W * 0.3, y + 8, W * 0.6, y - 8, W, y + 4); ctx.stroke(); }
  if (!items) return;
  splats.forEach(s => { ctx.globalAlpha = Math.min(0.55, s.life / 2.5 * 0.55); ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(s.x + Math.cos(k * 1.3) * s.r * 1.2, s.y + Math.sin(k * 1.3) * s.r * 1.2, 4, 0, 7); ctx.fill(); } });
  ctx.globalAlpha = 1;
  // corner sprite cheering
  A.drawHero(W - 44, H - 40, 70, 0, flash > 0 ? 'sugar' : 'happy');
  halves.forEach(h => {
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot);
    ctx.beginPath(); ctx.rect(-30, h.side < 0 ? -30 : 0, 60, 30); ctx.clip();
    ctx.globalAlpha = Math.min(1, h.life); ART.draw(ctx, h.kind, 0, 0, 44, t); ctx.restore();
  });
  items.forEach(it => {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
    if (it.bad) { ctx.fillStyle = 'rgba(255,59,92,.35)'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fill(); ctx.strokeStyle = '#FF3B5C'; ctx.lineWidth = 3; ctx.stroke(); }
    if (it.power) { ctx.fillStyle = 'rgba(255,215,0,.4)'; ctx.beginPath(); ctx.arc(0, 0, 30 + Math.sin(t * 10) * 3, 0, 7); ctx.fill(); }
    ART.draw(ctx, it.kind, 0, 0, 44, t); ctx.restore();
  });
  // blade trail
  if (trail.length > 1) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < trail.length; i++) {
      const p = trail[i], q = trail[i - 1], w = 2 + (i / trail.length) * 9;
      ctx.strokeStyle = 'rgba(255,255,255,' + Math.max(0, p.a) + ')'; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(124,255,178,' + Math.max(0, p.a) * 0.6 + ')'; ctx.lineWidth = w * 0.4; ctx.stroke();
    }
  }
  if (flash > 0) { ctx.fillStyle = 'rgba(255,59,92,' + flash * 0.8 + ')'; ctx.fillRect(0, 0, W, H); }
  // HUD
  ctx.font = '900 16px Nunito,sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#FF3B5C'; ctx.fillText('❤'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives)), 62, 80);
  if (frenzyT > 0) { ctx.textAlign = 'right'; ctx.fillStyle = '#FFD700'; ctx.fillText('⭐ FRENZY ×2  ' + Math.ceil(frenzyT), W - 62, 80); }
}

window.__slice = () => ({ items, lives, frenzyT, sliced, bestSwipe, swipe: (pts) => { pointer('down', pts[0][0], pts[0][1], game); for (const p of pts.slice(1)) pointer('drag', p[0], p[1], game); pointer('up', 0, 0, game); } });   // used by automated playtests
const game = window.game = Arcade({
  mount: '#game', title: 'Sprite Slice', subtitle: 'Swipe the good stuff!', W, H, reserveH: 70,
  storageKey: 'sprite_slice', winAt: 800, winText: 'You sliced 800 points of healthy food!', deathDelay: 800, overTitle: 'Out of hearts!',
  medals: [{ at: 250, name: 'Bronze', icon: '🥉' }, { at: 800, name: 'Silver', icon: '🥈' }, { at: 1600, name: 'Gold', icon: '🥇' }, { at: 3000, name: 'Legend', icon: '💎' }],
  howTo: '<b>Hold and swipe</b> to slice the flying <b>fruits and veggies</b>. Slice 3+ in one swipe for a combo!<br>Slicing <b>junk food</b> or letting good food drop costs a heart. ⭐ = fruit frenzy, ❤ = extra heart. <b>800 points</b> wins.',
  controls: 'Hold mouse button and swipe · or swipe your finger · P pause',
  facts: [
    'Teens need about 2 cups of fruit and 3 cups of vegetables each day.',
    'Eating fruits of different colors gives you different vitamins.',
    'Washing fruit before you cut it keeps germs off your food.',
    'Cut on a cutting board and slice away from your fingers.',
    'Pre-cut fruit in the fridge makes it an easy snack to grab.'
  ],
  reset, update, draw, pointer
});
})();
</script>
</body>
