# Supabase CLI config for the DEDICATED Book Studio project (not the class project).
# Hosted-project auth settings must also be set in the dashboard — see
# _book-studio-backend/docs/SETUP.md. These values document the intended configuration
# and apply to `supabase start` local development.

project_id = "circumpunct-book-studio"

[api]
schemas = ["public"]
max_rows = 2000

[auth]
site_url = "https://doppsclass.com/book-studio/"
additional_redirect_urls = ["http://localhost:8000/book-studio/"]
enable_signup = false          # owner account is created by invite only
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 10          # per 5 minutes per IP
token_verifications = 10
email_sent = 2

[functions.import-docx]
verify_jwt = true

[functions.export-docx]
verify_jwt = true
