<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Word Quest</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const W = 420, H = 660;
const WORDS = {
  SLEEP: 'Teens need 8 to 10 hours of sleep. Deep sleep helps store memories.',
  HEART: 'Your heart beats about 100,000 times a day.',
  FIBER: 'Fiber from fruits, veggies and whole grains keeps digestion healthy and you full longer.',
  WATER: 'Water helps your brain focus and keeps your body cool.',
  SUGAR: 'Teens should keep added sugar under about 12 teaspoons a day.',
  LUNGS: 'Aerobic exercise helps your lungs and heart use oxygen better.',
  SWEAT: 'Sweat cools your body as it evaporates off your skin.',
  BRAIN: 'Your brain uses about 20% of your body\'s energy.',
  BONES: 'Running and jumping help build strong bones during your teen years.',
  CELLS: 'Your body is made of trillions of cells working together.',
  VIRUS: 'Washing hands for 20 seconds helps stop viruses from spreading.',
  BLOOD: 'Blood carries oxygen and nutrients to every part of your body.',
  NERVE: 'Nerves send signals between your brain and body in a fraction of a second.',
  PULSE: 'A typical resting pulse is 60 to 100 beats per minute.',
  VEINS: 'Veins carry blood back to your heart.',
  LIVER: 'Your liver filters your blood and helps digest fats.',
  TEETH: 'Brushing twice a day and flossing protects your teeth and gums.',
  COUGH: 'Cover your cough with your elbow to protect others.',
  JOINT: 'Stretching helps keep your joints moving well.',
  GLAND: 'Glands make hormones that control growth, mood and energy.',
  FOCUS: 'Sleep, water and breakfast all help you focus in class.',
  RELAX: 'Slow, deep breathing helps your body relax under stress.',
  FRUIT: 'Teens need about 2 cups of fruit a day.',
  SALAD: 'Leafy greens add vitamins A, C and K.',
  STEPS: 'Walking more steps each day is good for your heart.',
  SPORT: 'Team sports build fitness and friendships.',
  HABIT: 'Small daily habits add up to big health changes.',
  GERMS: 'Germs spread through touch, so wash your hands often.',
  SPINE: 'Good posture helps protect your spine.',
  ORGAN: 'Your skin is your body\'s largest organ.',
  SMILE: 'Smiling and laughing can lower stress.',
  HAPPY: 'Exercise releases endorphins that boost your mood.',
  PEACE: 'Quiet time and mindfulness help calm your mind.',
  TRUST: 'Talking to a trusted adult helps when you\'re struggling.',
  CHEST: 'Your ribs protect your heart and lungs.',
  ANKLE: 'Warming up helps prevent ankle sprains.',
  WRIST: 'Wrist guards help protect you when skating.',
  KNEES: 'Strong leg muscles help protect your knees.',
  SMOKE: 'Smoking and vaping damage your lungs. There\'s no safe amount.',
  ALERT: 'Enough sleep keeps you alert and safe when driving.',
  VITAL: 'Vital signs include heart rate, breathing and temperature.',
  CARBS: 'Carbohydrates are your body\'s main source of energy.',
  SKULL: 'Helmets protect your skull and brain.'
};
const LIST = Object.keys(WORDS).filter(w => w.length === 5);
const ROWS = 6, TILE = 56, GAP = 7, GX = (W - (5 * TILE + 4 * GAP)) / 2, GY = 92;
const KB = ['QWERTYUIOP', 'ASDFGHJKL', '⏎ZXCVBNM⌫'];
const ROUNDS = 5;

let word, guesses, cur, row, keyState, lives, solved, roundNo, phase, phaseT, shakeT, revealT, used, msg, host;

function pickWord() { const pool = LIST.filter(w => !used.includes(w)); const w = pool[Math.floor(Math.random() * pool.length)]; used.push(w); return w; }
function startRound() { word = pickWord(); guesses = []; cur = ''; row = 0; keyState = {}; phase = 'play'; phaseT = 0; revealT = 0; msg = null; }
function reset(A) { lives = 3; solved = 0; roundNo = 1; used = []; host = { mood: 'happy', t: 0, jump: 0 }; startRound(); }

function score(g) {   // Wordle colouring with duplicate letters handled
  const res = Array(5).fill('absent'), left = {};
  for (let i = 0; i < 5; i++) { if (g[i] === word[i]) res[i] = 'correct'; else left[word[i]] = (left[word[i]] || 0) + 1; }
  for (let i = 0; i < 5; i++) if (res[i] !== 'correct' && left[g[i]]) { res[i] = 'present'; left[g[i]]--; }
  return res;
}
function type(ch, A) {
  if (phase !== 'play' || revealT > 0 || A.state !== 'play') return;
  if (ch === '⌫') { cur = cur.slice(0, -1); return; }
  if (ch === '⏎') { submit(A); return; }
  if (cur.length < 5 && /^[A-Z]$/.test(ch)) { cur += ch; A.sfx('point'); }
}
function submit(A) {
  if (cur.length < 5) { shakeT = 0.4; msg = { t: 0, text: 'Need 5 letters' }; return; }
  const res = score(cur);
  guesses.push({ w: cur, res }); revealT = 1.1;
  res.forEach((r, i) => { const k = cur[i], rank = { absent: 1, present: 2, correct: 3 }; if (!keyState[k] || rank[r] > rank[keyState[k]]) keyState[k] = r; });
  const g = cur; cur = '';
  setTimeout(() => {
    if (A.state !== 'play') return;
    if (g === word) {
      solved++; const pts = (7 - guesses.length) * 100 + (solved >= 2 ? 100 : 0);
      A.addScore(pts); A.sfx('win'); host.mood = 'happy'; host.jump = 1;
      A.particles.burst(W / 2, GY + guesses.length * (TILE + GAP), '#FFD700', 30, 280, 5);
      A.float('+' + pts, W / 2, GY + 170, '#7CFFB2');
      if (solved === 3) A.win('3 health words solved!');
      phase = 'done'; phaseT = 0; msg = { t: 0, text: ['Genius!', 'Amazing!', 'Great!', 'Nice!', 'Phew!', 'Just made it!'][guesses.length - 1] };
    } else if (guesses.length >= ROWS) {
      lives--; A.sfx('hit'); host.mood = 'tired';
      phase = 'done'; phaseT = 0; msg = { t: 0, text: 'The word was ' + word };
    } else A.sfx('swipe');
  }, 1000);
}
function nextRound(A) {
  if (lives <= 0) { A.gameOver(); return; }
  if (roundNo >= ROUNDS) { A.gameOver(true); return; }
  roundNo++; host.mood = 'happy'; startRound();
}
function input(type_, A) {
  if (phase === 'done' && phaseT > 1.2 && (type_ === 'tap' || type_ === 'up')) nextRound(A);
}
// typing on a real keyboard
window.addEventListener('keydown', e => {
  if (!window.game || game.state !== 'play') return;
  if (phase === 'done') { if (e.key === 'Enter' && phaseT > 1.2) { e.preventDefault(); e.stopPropagation(); nextRound(game); } return; }
  if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); e.stopPropagation(); type(e.key.toUpperCase(), game); }
  else if (e.key === 'Backspace') { e.preventDefault(); type('⌫', game); }
  else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); type('⏎', game); }
}, true);
// tapping the on-screen keyboard
function keyRects() {
  const rects = [], top = 476, kh = 50, kg = 5;
  KB.forEach((r, ri) => {
    const keys = r.split(''), wide = ri === 2;
    const unit = (W - 16 - kg * 9) / 10;
    const widths = keys.map(k => (k === '⏎' || k === '⌫') ? unit * 1.5 : unit);
    const total = widths.reduce((a, b) => a + b, 0) + kg * (keys.length - 1);
    let x = (W - total) / 2;
    keys.forEach((k, i) => { rects.push({ k, x, y: top + ri * (kh + kg), w: widths[i], h: kh }); x += widths[i] + kg; });
  });
  return rects;
}
function pointer(t, x, y, A) {
  if (t !== 'down') return;
  if (phase === 'done' && phaseT > 1.2) { nextRound(A); return; }
  const k = keyRects().find(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
  if (k) type(k.k, A);
}
function update(dt, A) {
  if (!host) return;
  host.t += dt; host.jump = Math.max(0, host.jump - dt * 2);
  if (A.state !== 'play') return;
  phaseT += dt; revealT = Math.max(0, revealT - dt); shakeT = Math.max(0, (shakeT || 0) - dt);
  if (msg) { msg.t += dt; if (msg.t > 2.2 && phase === 'play') msg = null; }
}
const COL = { correct: '#3FCB6B', present: '#FFD23F', absent: '#3a3360' };
function draw(ctx, A) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2b1660'); g.addColorStop(1, '#140c36');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!word) return;
  ctx.font = '900 14px Nunito,sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#FF5C77'; ctx.fillText('❤'.repeat(Math.max(0, lives)), 58, 80);
  ctx.textAlign = 'right'; ctx.fillStyle = '#b9b0d6'; ctx.fillText('Word ' + roundNo + '/' + ROUNDS + ' · ' + solved + ' solved', W - 62, 80);
  // grid
  for (let r = 0; r < ROWS; r++) {
    const sx = r === guesses.length && shakeT > 0 ? Math.sin(shakeT * 60) * 6 : 0;
    for (let c = 0; c < 5; c++) {
      const x = GX + c * (TILE + GAP) + sx, y = GY + r * (TILE + GAP);
      let ch = '', st = null;
      if (r < guesses.length) { ch = guesses[r].w[c]; st = guesses[r].res[c]; }
      else if (r === guesses.length) ch = cur[c] || '';
      // flip reveal on the newest row
      let sy = 1;
      if (r === guesses.length - 1 && revealT > 0) { const p = 1.1 - revealT - c * 0.18; if (p < 0) st = null; else if (p < 0.2) { sy = Math.abs(Math.cos(p / 0.2 * Math.PI)); if (p < 0.1) st = null; } }
      ctx.save(); ctx.translate(x + TILE / 2, y + TILE / 2); ctx.scale(1, sy);
      A.rr(-TILE / 2, -TILE / 2, TILE, TILE, 10);
      if (st) A.ink(COL[st], 2.5); else { ctx.fillStyle = '#1a1238'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = ch ? '#8f86b3' : '#3a3360'; ctx.stroke(); }
      if (ch) { ctx.fillStyle = st === 'present' ? '#2a1d00' : '#fff'; ctx.font = '900 28px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, 0, 2); ctx.textBaseline = 'alphabetic'; }
      ctx.restore();
    }
  }
  // keyboard
  keyRects().forEach(r => {
    const st = keyState[r.k];
    A.rr(r.x, r.y, r.w, r.h, 8);
    if (st) A.ink(COL[st], 2); else { ctx.fillStyle = '#4a4078'; ctx.fill(); }
    ctx.fillStyle = st === 'present' ? '#2a1d00' : '#fff'; ctx.font = '900 ' + (r.k.length > 1 || r.k === '⏎' || r.k === '⌫' ? 18 : 17) + 'px Nunito,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(r.k, r.x + r.w / 2, r.y + r.h / 2 + 6);
  });
  // host sprite + message
  // little sprite cheering next to the hearts
  A.drawHero(40, 74 + Math.sin(host.t * 3) * 2 - host.jump * 8, 26, 0, host.mood);
  if (msg) {
    ctx.globalAlpha = Math.min(1, msg.t * 5);
    ctx.font = '900 16px Nunito,sans-serif'; const w = ctx.measureText(msg.text).width + 26;
    A.rr(W / 2 - w / 2, 440, w, 30, 15); A.ink('#FFD700', 2.5); ctx.fillStyle = '#2a1d00'; ctx.textAlign = 'center'; ctx.fillText(msg.text, W / 2, 460);
    ctx.globalAlpha = 1;
  }
  if (phase === 'done' && phaseT > 0.3) {
    ctx.globalAlpha = Math.min(1, (phaseT - 0.3) * 4);
    ctx.fillStyle = 'rgba(10,6,24,.82)'; ctx.fillRect(0, 470, W, H - 470);
    ctx.textAlign = 'center'; ctx.fillStyle = '#FFD700'; ctx.font = '900 26px Cinzel,serif'; ctx.fillText(word, W / 2, 510);
    ctx.fillStyle = '#fff'; ctx.font = '700 15px Nunito,sans-serif'; wrap(ctx, '💡 ' + (WORDS[word] || ''), W / 2, 540, W - 50, 20);
    if (phaseT > 1.2) { ctx.fillStyle = '#7CFFB2'; ctx.font = '900 16px Nunito,sans-serif'; ctx.fillText(lives <= 0 ? 'Tap to finish' : roundNo >= ROUNDS ? 'Tap to see your score' : 'Tap or press Enter for the next word →', W / 2, 630); }
    ctx.globalAlpha = 1;
  }
}
function wrap(ctx, text, x, y, maxW, lh) { const words = text.split(' '); let line = '', yy = y; words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; } else line = t; }); if (line) ctx.fillText(line, x, yy); }

window.__wq = () => ({ word, guesses, phase, lives, solved, roundNo, type: c => type(c, game) });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Word Quest', subtitle: 'Guess the health word!', W, H, reserveH: 70,
  storageKey: 'word_quest', winText: '3 health words solved!', deathDelay: 600, overTitle: 'Quest over!',
  medals: [{ at: 600, name: 'Bronze', icon: '🥉' }, { at: 1400, name: 'Silver', icon: '🥈' }, { at: 2200, name: 'Gold', icon: '🥇' }, { at: 2900, name: 'Legend', icon: '💎' }],
  howTo: 'Guess the 5-letter health word in 6 tries.<br>🟩 right spot · 🟨 in the word · ⬛ not in it.<br>Up to 5 words, 3 hearts. <b>Solve 3</b> to win!',
  controls: 'Type on your keyboard or tap the letters · Enter to guess',
  facts: [
    'Word games help build vocabulary and memory.',
    'Learning health vocabulary helps you understand doctors and health news.',
    'Your brain keeps forming new connections when you learn something new.',
    'Getting enough sleep helps you remember what you learned today.',
    'Puzzles are a great way to give your brain a workout.'
  ],
  reset, update, draw, input, pointer
});
})();
</script>
