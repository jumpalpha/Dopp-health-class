<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="term.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Snack Stack — Dopp's Arcade</title>
<meta name="description" content="Stack falling blocks of healthy snacks and clear lines. A health-themed falling-block puzzle.">
<link rel="canonical" href="https://doppsclass.com/dopp_tetris.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2305070F%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2746%27%20font-size%3D%2736%27%20text-anchor%3D%27middle%27%20fill%3D%27%23FFD700%27%3E%26%239876%3B%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,#0a0618 70%) fixed;color:#f4efff;font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto;padding:10px 16px}
.top a{color:#FFD700;font-weight:800;text-decoration:none}
.top h1{font-family:Cinzel,serif;font-size:20px;color:#FFD700;text-shadow:0 2px 0 #000}
#game{padding:0 8px 16px}
</style>
</head>
<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Snack Stack</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const COLS = 10, ROWS = 20, CELL = 27, BX = 12, BY = 76;
const W = 420, H = BY + ROWS * CELL + 12;
const PX = BX + COLS * CELL + 12;     // side panel x
// each piece is a healthy snack with its own color
const PIECES = {
  I: { cells: [[0, 1], [1, 1], [2, 1], [3, 1]], food: 'water', color: '#4CC4FF' },
  O: { cells: [[1, 0], [2, 0], [1, 1], [2, 1]], food: 'banana', color: '#FFD23F' },
  T: { cells: [[1, 0], [0, 1], [1, 1], [2, 1]], food: 'grape', color: '#B57CFF' },
  S: { cells: [[1, 0], [2, 0], [0, 1], [1, 1]], food: 'broccoli', color: '#3FCB6B' },
  Z: { cells: [[0, 0], [1, 0], [1, 1], [2, 1]], food: 'apple', color: '#FF5C77' },
  J: { cells: [[0, 0], [0, 1], [1, 1], [2, 1]], food: 'carrot', color: '#FF9F43' },
  L: { cells: [[2, 0], [0, 1], [1, 1], [2, 1]], food: 'strawberry', color: '#FF7AB6' }
};
const KEYS = Object.keys(PIECES);
const LINE_PTS = [0, 100, 300, 500, 800];
const TIPS = ['Water is the best drink for your body.', 'Bananas give quick energy and potassium.', 'Grapes count toward your daily fruit.',
  'Broccoli is packed with vitamin C.', 'An apple a day adds fiber to your diet.', 'Carrots help keep your eyes healthy.', 'Strawberries are full of vitamin C.'];

let board, cur, next, bag, dropT, lockT, lines, level, clearing, clearT, sprite;

function newBag() { const b = KEYS.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function take() { if (!bag.length) bag = newBag(); return bag.pop(); }
function spawn(A) {
  const k = next; next = take();
  cur = { k, cells: PIECES[k].cells.map(c => c.slice()), x: 3, y: 0 };
  if (collides(cur.cells, cur.x, cur.y)) { sprite.mood = 'ghost'; A.gameOver(); }
}
function collides(cells, x, y) {
  return cells.some(([cx, cy]) => { const X = x + cx, Y = y + cy; return X < 0 || X >= COLS || Y >= ROWS || (Y >= 0 && board[Y][X]); });
}
function rotate(A) {
  if (cur.k === 'O') return;
  const n = cur.k === 'I' ? 4 : 3;
  const rot = cur.cells.map(([x, y]) => [n - 1 - y, x]);
  for (const dx of [0, -1, 1, -2, 2]) if (!collides(rot, cur.x + dx, cur.y)) { cur.cells = rot; cur.x += dx; lockT = 0; A.sfx('swipe'); return; }
}
function move(dx, A) { if (!collides(cur.cells, cur.x + dx, cur.y)) { cur.x += dx; lockT = 0; } }
function ghostY() { let y = cur.y; while (!collides(cur.cells, cur.x, y + 1)) y++; return y; }
function lock(A) {
  cur.cells.forEach(([cx, cy]) => { const Y = cur.y + cy; if (Y >= 0) board[Y][cur.x + cx] = cur.k; });
  A.sfx('point');
  const full = []; for (let y = 0; y < ROWS; y++) if (board[y].every(Boolean)) full.push(y);
  if (full.length) { clearing = full; clearT = 0.28; scoreLines(full.length, A); }
  else spawn(A);
}
function scoreLines(n, A) {
  lines += n; const pts = LINE_PTS[n] * level;
  A.addScore(pts); A.sfx(n >= 4 ? 'win' : 'coin');
  const y = BY + clearing[0] * CELL;
  A.float((n === 4 ? 'SNACK STACK! ' : '') + '+' + pts, BX + COLS * CELL / 2, y, n >= 3 ? '#FFD700' : '#7CFFB2');
  clearing.forEach(r => A.particles.burst(BX + COLS * CELL / 2, BY + r * CELL + CELL / 2, '#FFE066', 16, 260, 4));
  sprite.mood = 'happy'; sprite.cheer = 1;
  const nl = 1 + Math.floor(lines / 5);
  if (nl > level) { level = nl; A.toast('⬆ Level ' + level + '! ' + TIPS[Math.floor(Math.random() * TIPS.length)], 2400); }
  if (lines >= 10) A.win('You cleared 10 lines!');
}
function hardDrop(A) {
  const gy = ghostY(); const rows = gy - cur.y; cur.y = gy;
  if (rows) A.addScore(rows * 2);
  A.shake(4, 0.12); lock(A);
}

function reset(A) {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  bag = []; next = take(); lines = 0; level = 1; clearing = null; clearT = 0; dropT = 0; lockT = 0;
  sprite = { mood: 'happy', cheer: 0, t: 0 };
  cur = null; spawn(A);
}
function input(type, A) {
  if (!cur || clearing || A.state !== 'play') return;
  if (type === 'left') move(-1, A);
  else if (type === 'right') move(1, A);
  else if (type === 'up' || type === 'tap' || type === 'rotate') rotate(A);
  else if (type === 'down') { if (!collides(cur.cells, cur.x, cur.y + 1)) { cur.y++; dropT = 0; A.addScore(1); } }
  else if (type === 'drop') hardDrop(A);
}
// Space = hard drop on keyboards (handled here so it isn't treated as a tap/rotate)
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && window.game && game.state === 'play') { e.preventDefault(); e.stopPropagation(); if (!e.repeat) input('drop', game); }
}, true);

function update(dt, A) {
  sprite.t += dt; sprite.cheer = Math.max(0, sprite.cheer - dt * 1.5);
  if (A.state !== 'play' || !cur) return;
  if (clearing) {
    clearT -= dt;
    if (clearT <= 0) {
      clearing.forEach(r => { board.splice(r, 1); board.unshift(Array(COLS).fill(null)); });
      clearing = null; spawn(A);
    }
    return;
  }
  const interval = Math.max(0.09, 0.8 - (level - 1) * 0.08);
  if (collides(cur.cells, cur.x, cur.y + 1)) {
    lockT += dt; if (lockT > 0.45) lock(A);
  } else {
    dropT += dt;
    if (dropT >= interval) { dropT = 0; cur.y++; }
  }
  // sprite worries when the stack gets tall
  let top = ROWS; for (let y = 0; y < ROWS; y++) if (board[y].some(Boolean)) { top = y; break; }
  if (sprite.mood !== 'ghost') sprite.mood = top < 6 ? 'tired' : 'happy';
}

function block(ctx, A, x, y, k, alpha) {
  const P = PIECES[k], px = BX + x * CELL, py = BY + y * CELL;
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  A.rr(px + 1.5, py + 1.5, CELL - 3, CELL - 3, 6); A.ink(P.color, 2.5);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(px + 5, py + 4, CELL - 14, 4);
  if (alpha == null || alpha === 1) ART.draw(ctx, P.food, px + CELL / 2, py + CELL / 2 + 1, 15, 0);
  ctx.globalAlpha = 1;
}
function draw(ctx, A) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2b1660'); g.addColorStop(1, '#140c36');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // board well
  A.rr(BX - 4, BY - 4, COLS * CELL + 8, ROWS * CELL + 8, 10); A.ink('#0f0a22', 3);
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(BX + x * CELL, BY); ctx.lineTo(BX + x * CELL, BY + ROWS * CELL); ctx.stroke(); }
  for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(BX, BY + y * CELL); ctx.lineTo(BX + COLS * CELL, BY + y * CELL); ctx.stroke(); }
  // locked blocks
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (board[y][x]) {
    if (clearing && clearing.includes(y)) { ctx.fillStyle = Math.floor(clearT * 20) % 2 ? '#fff' : '#FFE066'; ctx.fillRect(BX + x * CELL + 1, BY + y * CELL + 1, CELL - 2, CELL - 2); }
    else block(ctx, A, x, y, board[y][x]);
  }
  // ghost + current piece
  if (cur && !clearing && A.state !== 'menu') {
    const gy = ghostY();
    cur.cells.forEach(([cx, cy]) => { if (gy + cy >= 0) { ctx.strokeStyle = PIECES[cur.k].color; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.strokeRect(BX + (cur.x + cx) * CELL + 3, BY + (gy + cy) * CELL + 3, CELL - 6, CELL - 6); ctx.setLineDash([]); } });
    cur.cells.forEach(([cx, cy]) => { if (cur.y + cy >= 0) block(ctx, A, cur.x + cx, cur.y + cy, cur.k); });
  }
  // side panel
  const lbl = (t, y) => { ctx.fillStyle = '#b9b0d6'; ctx.font = '900 12px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t, PX + 52, y); };
  lbl('NEXT', BY + 12);
  A.rr(PX, BY + 20, 104, 76, 12); A.ink('#1f1640', 2.5);
  if (next) {
    const P = PIECES[next], xs = P.cells.map(c => c[0]), ys = P.cells.map(c => c[1]);
    const w = (Math.max(...xs) - Math.min(...xs) + 1) * 22, h = (Math.max(...ys) - Math.min(...ys) + 1) * 22;
    P.cells.forEach(([cx, cy]) => {
      const x = PX + 52 - w / 2 + (cx - Math.min(...xs)) * 22, y = BY + 58 - h / 2 + (cy - Math.min(...ys)) * 22;
      A.rr(x + 1, y + 1, 20, 20, 5); A.ink(P.color, 2); ART.draw(ctx, P.food, x + 11, y + 12, 12, 0);
    });
  }
  lbl('LINES', BY + 124);
  ctx.fillStyle = '#FFD700'; ctx.font = '900 30px Cinzel,serif'; ctx.fillText(lines + (lines < 10 ? '/10' : ''), PX + 52, BY + 156);
  const pct = Math.min(1, lines / 10);
  A.rr(PX + 6, BY + 166, 92, 10, 5); A.ink('#1f1640', 2);
  if (pct > 0) { A.rr(PX + 6, BY + 166, 92 * pct, 10, 5); A.ink('#3FCB6B', 2); }
  lbl('LEVEL', BY + 202);
  ctx.fillStyle = '#fff'; ctx.font = '900 28px Cinzel,serif'; ctx.fillText(level, PX + 52, BY + 232);
  // your sprite cheering you on
  const bob = Math.sin(sprite.t * 3) * 4 - sprite.cheer * 14;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(PX + 52, BY + 352, 30, 6, 0, 0, 7); ctx.fill();
  A.drawHero(PX + 52, BY + 312 + bob, 84, Math.sin(sprite.t * 2) * 0.06, sprite.mood);
  ctx.fillStyle = '#b9b0d6'; ctx.font = '800 11px Nunito,sans-serif';
  const say = sprite.mood === 'tired' ? 'Too tall! Clear lines!' : sprite.cheer > 0.2 ? 'Yum! Nice clear!' : 'Fill a row to clear it';
  ctx.fillText(say, PX + 52, BY + 378);
}

window.__stack = () => ({ board, cur, next, lines, level, clearing, COLS, ROWS, PIECES });  // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Snack Stack', subtitle: 'Stack healthy snacks, clear the lines!', W, H, reserveH: 70,
  storageKey: 'snack_stack', winText: 'You cleared 10 lines!', swipe: true, repeatKeys: true,
  medals: [{ at: 500, name: 'Bronze', icon: '🥉' }, { at: 1500, name: 'Silver', icon: '🥈' }, { at: 4000, name: 'Gold', icon: '🥇' }, { at: 8000, name: 'Legend', icon: '💎' }],
  howTo: 'Fill a whole row with snacks to clear it.<br><b>Clear 10 lines</b> to complete the quest!',
  controls: '← → move · ↑ rotate · ↓ soft drop · Space hard drop · Phones: tap to rotate, swipe to move',
  overTitle: 'Stacked out!',
  facts: [
    'MyPlate says to make half your plate fruits and vegetables.',
    'Water has zero sugar and zero calories, and your body is about 60% water.',
    'Eating a variety of colorful foods gives you a wider range of nutrients.',
    'Puzzle games can help practice planning and spatial thinking.',
    'Healthy snacks like fruit and veggies help you focus in class.'
  ],
  reset, update, draw, input,
  pad: [{ label: '◀', type: 'left' }, { label: '⟳', type: 'rotate' }, { label: '▼', type: 'down' }, { label: '⤓', type: 'drop' }, { label: '▶', type: 'right' }]
});
})();
</script>
</body>
</html>
