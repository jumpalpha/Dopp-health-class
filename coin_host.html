<!DOCTYPE html>
<html lang="en">
<head>
<script src="local-guard.js"></script>
<meta charset="UTF-8">
<script src="dark_mode.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Quest Live — Host</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="app/site-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--emerald:#00E5A0;--sky:#38BFFF;--crimson:#FF3B5C;--bg:#0a0618;--panel:#160f2e;--line:rgba(255,215,0,.25);--text:#f4efff;--dim:#b9b0d6}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,var(--bg) 60%) fixed;color:var(--text);font-family:Nunito,system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Cinzel,serif;color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px rgba(255,215,0,.35);font-size:clamp(26px,4vw,40px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
button,.btn{font:inherit;font-weight:900;font-size:17px;padding:12px 20px;border-radius:12px;border:0;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-gold{background:var(--gold);color:#2a1d00}
.btn-ghost{background:transparent;color:var(--text);border:1px solid #5b4d8c}
.btn-red{background:transparent;color:var(--crimson);border:1px solid var(--crimson)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--crimson);font-weight:800;margin-top:10px;min-height:1.2em}
.hidden{display:none!important}
.dim{color:var(--dim)}
.topbar{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.join{display:flex;gap:18px;align-items:center}
.join .code{font-family:Cinzel,serif;font-weight:900;font-size:clamp(40px,7vw,72px);letter-spacing:6px;color:var(--gold);text-shadow:0 3px 0 #000}
.join .how{font-size:18px;color:var(--dim);line-height:1.4}
.join .how b{color:var(--text)}
#qr{background:#fff;padding:8px;border-radius:10px;line-height:0}
.clock{font-family:Cinzel,serif;font-weight:900;font-size:clamp(48px,8vw,96px);color:var(--gold);text-shadow:0 3px 0 #000;line-height:1}
.clock.low{color:var(--crimson)}
.info{font-size:18px;font-weight:800;color:var(--dim);margin-top:6px}
.info b{color:var(--text)}
.names{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.names span{padding:8px 14px;border-radius:999px;background:#0f0a22;border:2px solid #3b2f66;font-weight:900;font-size:18px}
.big{font-family:Cinzel,serif;font-weight:900;font-size:clamp(26px,4vw,40px);color:var(--gold);text-shadow:0 2px 0 #000}
.board{display:grid;gap:10px;margin-top:14px}
.pl{display:grid;grid-template-columns:48px 1fr 2fr 150px;gap:12px;align-items:center;font-weight:900;font-size:clamp(17px,2vw,24px)}
.pl .r{font-family:Cinzel,serif;color:var(--gold);text-align:right}
.pl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .tb{height:22px;background:#0b0716;border:1px solid #3b2f66;border-radius:99px;overflow:hidden}
.pl .tb>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--gold));transition:width .8s ease}
.pl .c{font-family:Cinzel,serif;text-align:right;color:var(--gold)}
.teams{display:grid;gap:12px;margin-top:6px}
.tm{display:grid;grid-template-columns:200px 1fr 170px;gap:12px;align-items:center;font-weight:900;font-size:clamp(18px,2.2vw,26px)}
.tm .tb{height:30px;background:#0b0716;border:1px solid #3b2f66;border-radius:99px;overflow:hidden}
.tm .tb>div{height:100%;border-radius:99px;transition:width .8s ease}
.tm .c{font-family:Cinzel,serif;text-align:right}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:20px 0 6px}
.pod{text-align:center;width:min(30%,240px)}
.pod .nm{font-weight:900;font-size:clamp(18px,2.4vw,28px);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{border-radius:14px 14px 0 0;display:flex;flex-direction:column;justify-content:flex-start;padding-top:12px;font-family:Cinzel,serif;font-weight:900;color:#1a1030}
.pod .blk .p{font-size:40px}
.pod .blk .m{font-size:18px}
.victory{text-align:center;font-family:Cinzel,serif;font-weight:900;font-size:clamp(26px,4vw,44px);margin:6px 0 4px;text-shadow:0 3px 0 #000}
@media(max-width:700px){.pl{grid-template-columns:36px 1fr 110px}.pl .tb{display:none}.tm{grid-template-columns:1fr 120px}.tm .tb{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel topbar">
    <div class="join">
      <div id="qr"></div>
      <div>
        <div class="how">Go to <b id="joinUrl">doppsclass.com/live.html</b><br>Game code:</div>
        <div class="code" id="code">------</div>
      </div>
    </div>
    <div style="text-align:right">
      <h1>🪙 Coin Quest Live</h1>
      <div class="info" id="setupInfo"></div>
    </div>
  </div>

  <!-- lobby -->
  <div class="panel" id="lobby">
    <div class="row" style="justify-content:space-between">
      <div class="big"><span id="lobbyN">0</span> joined</div>
      <div class="row">
        <button class="btn-gold" id="startBtn" disabled>▶ Start the clock</button>
        <button class="btn-red" id="cancelBtn">Cancel game</button>
      </div>
    </div>
    <p class="dim" style="margin-top:8px;font-size:17px">Students answer at their own pace. Right answers earn coins; coins buy upgrades in the shop. Most coins when time runs out wins.</p>
    <div class="names" id="names"></div>
  </div>

  <!-- running -->
  <div class="panel hidden" id="running">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="clock" id="clock">0:00</div><div class="info" id="runInfo"></div></div>
      <button class="btn-red" id="endBtn">End now</button>
    </div>
    <div id="teamBox" class="hidden" style="margin-top:18px"><div class="teams" id="teams"></div></div>
    <div class="board" id="board"></div>
  </div>

  <!-- final -->
  <div class="panel hidden" id="final">
    <div class="victory" id="winLine" style="color:var(--gold)">🏆 Final Results</div>
    <div class="podium" id="podium"></div>
    <div id="fTeamBox" class="hidden" style="margin-top:14px"><div class="teams" id="fTeams"></div></div>
    <div class="board" id="fBoard"></div>
    <div class="info" id="fInfo" style="text-align:center;margin-top:14px"></div>
    <div class="row" style="justify-content:center;margin-top:16px"><a class="btn btn-gold" href="live_host.html">New game</a></div>
  </div>
  <div class="err" id="err"></div>
</div>

<script src="vendor/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
const SUPABASE_URL = 'https://gmeyamrlqfrabtslsweu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zClDCZZQEfC9DILpesPiHg_IcyRqW-c';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Math.floor(n).toLocaleString();
const TEAMS = { 1:{ name:'Sky Knights', col:'#38BFFF' }, 2:{ name:'Crimson Guard', col:'#FF3B5C' }, 3:{ name:'Gold Lions', col:'#FFD700' }, 4:{ name:'Emerald Rangers', col:'#00E5A0' } };

let H = null; try { H = JSON.parse(sessionStorage.getItem('coin_host') || 'null'); } catch (e) {}
if (!H || !H.sid) { location.replace('live_host.html'); return; }
async function rpc(name, args) { const { data, error } = await db.rpc(name, args); if (error) throw new Error(error.message); return data; }
const ha = () => ({ p_session_id: H.sid, p_host_token: H.tok });

let B = null, deadline = 0, ending = false, pollT = null;
function show(id) { ['lobby', 'running', 'final'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }

// join box
$('code').textContent = H.code;
$('joinUrl').textContent = location.protocol === 'file:' ? 'live.html' : location.host + '/live.html';
const url = location.href.replace(/[?#].*$/, '').replace(/coin_host\.html$/, 'live.html') + '?code=' + H.code;
if (window.QRCode) new QRCode($('qr'), { text: url, width: 132, height: 132, colorDark: '#000', colorLight: '#fff' }); else $('qr').classList.add('hidden');
$('setupInfo').innerHTML = 'Chapters <b>' + H.from + (H.to !== H.from ? '–' + H.to : '') + '</b> · <b>' + H.n + '</b> questions · <b>' + Math.round(H.secs / 60) + ' min</b>' + (H.teams ? ' · <b>' + H.teams + ' teams</b>' : '');
$('startBtn').textContent = '▶ Start the clock (' + Math.round(H.secs / 60) + ' min)';

function teamsHTML(t, n) {
  const ks = []; for (let i = 1; i <= n; i++) ks.push(String(i));
  const max = Math.max(1, ...ks.map(k => +(t[k] || 0)));
  return ks.sort((a, b) => (t[b] || 0) - (t[a] || 0)).map(k => '<div class="tm"><div style="color:' + TEAMS[k].col + '">' + TEAMS[k].name + '</div>' +
    '<div class="tb"><div style="width:' + Math.round((t[k] || 0) / max * 100) + '%;background:' + TEAMS[k].col + '"></div></div><div class="c" style="color:' + TEAMS[k].col + '">' + money(t[k] || 0) + '</div></div>').join('');
}
function boardHTML(players, limit) {
  const max = Math.max(1, ...players.map(p => p.cash));
  return players.slice(0, limit).map((p, i) => '<div class="pl"><div class="r">' + (i + 1) + '</div><div class="n"' + (p.team && TEAMS[p.team] ? ' style="color:' + TEAMS[p.team].col + '"' : '') + '>' + esc(p.nickname) + '</div>' +
    '<div class="tb"><div style="width:' + Math.round(p.cash / max * 100) + '%"></div></div><div class="c">' + money(p.cash) + '</div></div>').join('');
}
function render() {
  const b = B; if (!b) return;
  if (b.phase === 'lobby') {
    show('lobby');
    $('lobbyN').textContent = b.players.length;
    $('names').innerHTML = b.players.map(p => '<span' + (p.team && TEAMS[p.team] ? ' style="border-color:' + TEAMS[p.team].col + '"' : '') + '>' + esc(p.nickname) + '</span>').join('');
    $('startBtn').disabled = !b.players.length;
    return;
  }
  if (b.phase === 'ended') return final();
  show('running');
  if (b.seconds_left != null) deadline = Date.now() + b.seconds_left * 1000;
  const pct = b.answered ? Math.round(b.correct / b.answered * 100) : 0;
  $('runInfo').innerHTML = '<b>' + b.players.length + '</b> playing · <b>' + b.answered + '</b> answers · <b>' + pct + '%</b> right';
  $('teamBox').classList.toggle('hidden', !b.teams_n);
  if (b.teams_n) $('teams').innerHTML = teamsHTML(b.teams || {}, b.teams_n);
  $('board').innerHTML = boardHTML(b.players, b.teams_n ? 5 : 10);
}
function clock() {
  if (!B || B.phase !== 'question') return;
  const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  $('clock').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  $('clock').classList.toggle('low', left <= 30);
  if (left <= 0 && !ending) endGame();
}
function final() {
  show('final'); clearInterval(pollT);
  const b = B, ps = b.players;
  const top = [ps[1], ps[0], ps[2]], hts = [150, 200, 115], cols = ['#c9d1e0', '#FFD700', '#d9935b'], place = [2, 1, 3];
  $('podium').innerHTML = top.map((p, i) => p ? '<div class="pod"><div class="nm">' + esc(p.nickname) + '</div><div class="blk" style="height:' + hts[i] + 'px;background:' + cols[i] + '"><div class="p">' + place[i] + '</div><div class="m">' + money(p.cash) + '</div></div></div>' : '').join('');
  if (b.teams_n) {
    const t = b.teams || {}, win = Object.keys(t).sort((x, y) => t[y] - t[x])[0];
    $('winLine').innerHTML = win && TEAMS[win] ? '🏆 <span style="color:' + TEAMS[win].col + '">' + TEAMS[win].name + '</span> win!' : '🏆 Final Results';
    $('fTeamBox').classList.remove('hidden'); $('fTeams').innerHTML = teamsHTML(t, b.teams_n);
  }
  $('fBoard').innerHTML = boardHTML(ps, 10);
  const pct = b.answered ? Math.round(b.correct / b.answered * 100) : 0;
  $('fInfo').innerHTML = '<b>' + b.answered + '</b> questions answered · <b>' + pct + '%</b> right' +
    '<br>⭐ Signed-in students earned +5 XP per right answer (up to 15). ' + (b.teams_n ? 'Everyone on the winning team' : 'The top 3') + ' gets a +25 XP bonus.';
}
async function poll() {
  try { const b = await rpc('host_coin_board', ha()); if (!b) { $('err').textContent = 'This game is gone. Start a new one.'; clearInterval(pollT); return; } B = b; $('err').textContent = ''; render(); }
  catch (e) { $('err').textContent = 'Connection trouble… retrying'; }
}
async function endGame() {
  ending = true;
  try { await rpc('host_set_phase', Object.assign(ha(), { p_phase: 'ended' })); } catch (e) {}
  await poll();
}
$('startBtn').onclick = async () => {
  $('startBtn').disabled = true;
  try { await rpc('host_coin_start', Object.assign(ha(), { p_seconds: H.secs })); await poll(); }
  catch (e) { $('err').textContent = 'Could not start: ' + e.message; $('startBtn').disabled = false; }
};
$('endBtn').onclick = () => { if (confirm('End the game now? Final scores will lock.')) endGame(); };
$('cancelBtn').onclick = async () => {
  if (!confirm('Cancel this game? Students in the lobby will be sent back.')) return;
  try { await rpc('host_set_phase', Object.assign(ha(), { p_phase: 'ended' })); } catch (e) {}
  try { sessionStorage.removeItem('coin_host'); } catch (e) {}
  location.href = 'live_host.html';
};
poll(); pollT = setInterval(poll, 1500); setInterval(clock, 250);
})();
</script>
</body>
</html>
