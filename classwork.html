<style>
:root{
  --indigo:#140c2e; --indigo-2:#231650; --gold:#FFD700; --gold-deep:#8a6400;
  --parch:#fbf5e6; --card:#fffdf7; --ink:#1C1A2E; --dim:#4f4a63; --line:rgba(28,26,46,.16);
  --good:#0f7a4f; --good-bg:#e3f6ec; --bad:#b0243a; --bad-bg:#fde8eb; --mid:#8a5a00; --mid-bg:#fff2d6;
  --sky:#2463c9; --sky-bg:#e6f0ff; --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--parch)}
a{color:#3b2a8f}
:focus-visible{outline:3px solid #5b8cff;outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:rgba(210,196,168,.98);border-bottom:1px solid var(--line)}
.nav-logo{font-family:'Cinzel',serif;font-weight:700;color:#7a5c00;text-decoration:none;white-space:nowrap}
.nav-logo span{color:var(--dim);font-weight:600}
.nav-links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-link{padding:6px 12px;border-radius:8px;font-weight:800;font-size:14px;color:var(--dim);text-decoration:none;white-space:nowrap}
.hero{background:linear-gradient(160deg,var(--indigo),var(--indigo-2));color:#fff;padding:30px 20px 64px;text-align:center;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:40px;background:var(--parch);clip-path:polygon(0 100%,100% 100%,100% 30%,50% 100%,0 30%)}
.kicker{font-family:'Cinzel',serif;letter-spacing:3px;font-size:12px;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(26px,5vw,42px);margin:8px 0 6px;color:var(--gold);text-shadow:0 2px 0 #000}
.hero p{margin:0 auto;max-width:620px;color:#e7e2ff}
.who{margin-top:10px;font-size:14px;color:#cfc8f5}
main{max-width:920px;margin:-30px auto 60px;padding:0 16px;position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 6px 20px rgba(20,12,46,.08);margin-bottom:16px}
.card h2{font-family:'Cinzel',serif;margin:0 0 6px;font-size:22px}
.card h3{margin:0 0 6px}
.muted{color:var(--dim);font-size:14px}
.banner{border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:14px}
.b-test{background:#fff4c2;border:2px dashed #b38600;color:#5a4300}
.b-info{background:var(--sky-bg);border:1px solid var(--sky);color:#123a7a}
.b-good{background:var(--good-bg);border:1px solid var(--good);color:#064a2f}
.b-bad{background:var(--bad-bg);border:1px solid var(--bad);color:#6d1020}
.b-mid{background:var(--mid-bg);border:1px solid #c58a00;color:#5a3a00}
.btn{font:inherit;font-weight:900;font-size:15px;border-radius:12px;padding:10px 18px;border:2px solid transparent;cursor:pointer;text-decoration:none;display:inline-block}
.btn-gold{background:var(--gold);color:var(--indigo);border-color:var(--gold-deep)}
.btn-ink{background:var(--indigo);color:#fff}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-sm{font-size:13px;padding:6px 12px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* hub */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.unit{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 4px 14px rgba(20,12,46,.07)}
.unit:hover{border-color:#b38600}
.unit b{font-family:'Cinzel',serif;font-size:18px;display:block}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:rgba(28,26,46,.07);margin:6px 4px 0 0}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.go{background:var(--mid-bg);color:var(--mid)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.step{font:inherit;font-weight:800;font-size:14px;padding:10px 6px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.step.on{background:var(--indigo);color:var(--gold);border-color:var(--indigo)}
.step.done::before{content:"✓ ";color:var(--good)}
.step.on.done::before{color:var(--gold)}
.step[disabled]{opacity:.45;cursor:not-allowed}
.step[disabled]::before{content:"🔒 "}
@media(max-width:560px){.steps{grid-template-columns:repeat(2,1fr)}}
/* vocab */
.words{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.w{padding:8px 12px;border-radius:10px;background:rgba(28,26,46,.035)}
.w b{color:#123a7a}.w .x{font-size:11px;font-weight:800;background:#ffe9a6;color:#6a4b00;border-radius:5px;padding:0 5px;margin-left:6px}
.chap{font-weight:900;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:14px 0 2px}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:800;padding:24px;border-radius:16px;border:2px solid var(--indigo);background:#fff;cursor:pointer;user-select:none;margin:10px 0}
.flash.back{font-size:17px;font-weight:600;background:var(--sky-bg)}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:10px}
.mi{font:inherit;text-align:left;padding:10px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink)}
.mi.sel{border-color:var(--sky);background:var(--sky-bg)}.mi.ok{border-color:var(--good);background:var(--good-bg);opacity:.6;cursor:default}.mi.no{border-color:var(--bad);background:var(--bad-bg)}
/* quiz */
.q{padding:12px 0;border-top:1px solid var(--line)}
.q p{margin:0 0 8px;font-weight:700}
.opt{display:block;padding:8px 10px;border-radius:9px;border:1px solid var(--line);margin:5px 0;cursor:pointer;background:#fff}
.opt input{margin-right:8px}
.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
/* stories */
.story{border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:#fff}
.story.saved{border-color:var(--good)}
.story h3 small{font-weight:700;color:var(--dim);font-size:13px;margin-left:6px}
select,textarea,input[type=text]{font:inherit;font-size:15px;padding:8px 10px;border-radius:9px;border:1px solid #9a94ad;background:#fff;color:var(--ink);max-width:100%}
select{min-width:200px}
textarea{width:100%;min-height:130px;resize:vertical}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;font-size:13px}
.meter div{padding:6px 8px;border-radius:8px;background:rgba(28,26,46,.05);font-weight:700}
.meter div.full{background:var(--good-bg);color:var(--good)}
.hl{background:#fff1a8;border-radius:3px;padding:0 2px;font-weight:800}
.preview{font-size:14px;color:var(--dim);margin-top:6px}
.swapbox{margin-top:8px;padding:10px;border-radius:10px;background:var(--mid-bg);font-size:14px}
/* certificate */
.cert{text-align:center;border:6px double #b38600;border-radius:18px;padding:26px 18px;background:linear-gradient(#fffdf2,#fff6d8)}
.cert h2{font-size:28px;color:#6a4b00}
.big{font-size:44px;font-weight:900;font-family:'Cinzel',serif;color:var(--indigo)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.grid3 div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:800}
.grid3 small{display:block;color:var(--dim);font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--indigo);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:99;max-width:90vw}
</style>

<script>
(function () {
'use strict';
const SUPABASE_URL = 'https://gmeyamrlqfrabtslsweu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zClDCZZQEfC9DILpesPiHg_IcyRqW-c';
const TRI = (window.TERM && TERM.id) || '2026-T1';
const UNITS = window.CLASSWORK_UNITS || [];
const R = { unlock: 80, minFinal: 70, minWords: 25, stories: 3, swaps: 2, minSeconds: 45, quizN: 20 };   // same as supabase/classwork.sql
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('app');

function session() {
  try {
    const sid = localStorage.getItem('qSID_' + TRI), pin = sessionStorage.getItem('qPIN_' + TRI);
    return sid && pin ? { sid, pin } : null;
  } catch (e) { return null; }
}
const S = session();
const db = S && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
async function rpc(name, args) {
  const { data, error } = await db.rpc(name, Object.assign({ p_student_id: S.sid, p_pin_hash: S.pin, p_trimester: TRI }, args || {}));
  if (error) throw new Error(error.message || 'Something went wrong');
  return data;
}
let toastT = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3500); }

// ── story rubric: same rules as public._cw_story_score in supabase/classwork.sql ──
function termRx(term) {
  const abbr = (term.match(/\(([^)]+)\)/) || [])[1];
  const base = term.replace(/\s*\([^)]*\)/g, '').trim();
  let alts = [base];
  if (base.includes('/')) {
    const sp = base.indexOf(' ');
    const first = sp < 0 ? base : base.slice(0, sp), rest = sp < 0 ? '' : base.slice(sp + 1);
    const parts = first.split('/');
    alts = sp < 0 ? parts : alts.concat(parts.map(p => (p + ' ' + rest).trim()));
  }
  if (abbr) alts.push(abbr.replace(/s$/, ''));
  const pieces = alts.map(v => v.toLowerCase().trim()).filter(Boolean).map(v => {
    let one = v.replace(/[.^$*+?()[\]{}|\\]/g, '\\$&').replace(/[- ]+/g, '[- ]?');
    if (/[a-z]$/.test(one)) one = '(' + one + '|' + one.replace(/[ey]$/, '') + '|' + one.replace(/e?s$/, '') + ')(s|es|e|ed|d|ing|ies|ly|ness)?';
    return one;
  });
  return new RegExp('(^|[^a-z0-9])(' + pieces.join('|') + ')(?![a-z0-9])', 'i');
}
const CUE = new RegExp([
  '\\b(my|our) (mom|dad|mother|father|parents?|brothers?|sisters?|siblings?|friends?|best friend|grandma|grandpa|grandmother|grandfather|grandparents?|coach|teacher|cousins?|aunt|uncle|family|team|teammates?|boss|neighbors?|dog|cat|girlfriend|boyfriend|stepmom|stepdad)\\b',
  '\\b(at|in|on) (the|my|our|a) [a-z]+',
  '\\b(home|school|practice|church|work|park|store|gym|field|class|game|camp|vacation|hospital|doctor)\\b',
  '\\b(yesterday|today|tonight|ago|once|weekend|morning|afternoon|evening|night|summer|winter|spring|fall|birthday|christmas|thanksgiving|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\\b',
  '\\blast (week|year|month|night|time)\\b', '\\bwhen i was\\b', '\\byears? old\\b', '\\b[0-9]{1,2}(st|nd|rd|th)? grade\\b', '\\b(19|20)[0-9]{2}\\b'].join('|'));
function scoreStory(text, a, b) {
  const t = String(text || ''), lo = t.toLowerCase();
  const words = t.trim().split(/\s+/).filter(x => /[A-Za-z]/.test(x)).length;
  const sentences = t.split(/[.!?]+/).filter(seg => seg.trim().split(/\s+/).filter(x => /[A-Za-z]/.test(x)).length >= 3).length;
  const hasA = !!a && termRx(a).test(lo), hasB = !!b && termRx(b).test(lo), cue = CUE.test(lo);
  const length = Math.min(40, Math.floor(40 * words / R.minWords));
  const used = (hasA ? 15 : 0) + (hasB ? 15 : 0), detail = (sentences >= 2 ? 15 : 0) + (cue ? 15 : 0);
  return { words, sentences, has_a: hasA, has_b: hasB, cue, length, used, detail, total: length + used + detail };
}
function hints(sc, a, b) {
  const h = [];
  if (sc.words < R.minWords) h.push(`Write at least ${R.minWords} words (you have ${sc.words}).`);
  if (!sc.has_a && a) h.push(`Use the word “${a}” in your story.`);
  if (!sc.has_b && b) h.push(`Use the word “${b}” in your story.`);
  if (sc.sentences < 2) h.push('Write at least 2 full sentences.');
  if (!sc.cue) h.push('Add a real detail: who was there, where it happened, or when (for example “last summer,” “my brother,” “at practice”).');
  return h;
}
function highlight(text, terms) {
  let html = esc(text);
  terms.filter(Boolean).forEach(t => {
    const rx = new RegExp(termRx(t).source, 'gi');
    html = html.replace(rx, (m, pre, w) => pre + '<span class="hl">' + w + '</span>');
  });
  return html;
}

// ── state ──
const params = new URLSearchParams(location.search);
const unitNo = parseInt(params.get('unit') || '0', 10);
const U = UNITS.find(u => u.unit === unitNo) || null;
const BANK = {}; (window.CW_BANK || []).forEach(r => { BANK[r[0]] = r; });
let W = null;                 // this unit's saved work from the server
let view = { ch: null, step: 'learn' };   // ch = chapter number, or 'unit' (Unit Test) or 'done' (Turn In)
const termByN = n => U.terms[n - 1];
const chWords = c => U.terms.map((w, i) => Object.assign({ n: i + 1 }, w)).filter(w => w.c === c);
const learnBest = c => Number((W.learn_best || {})[c] || 0);
const learnOk = c => learnBest(c) >= R.learnPass;
const chOpen = c => U.chapters.filter(x => x < c).every(learnOk);
const chStories = c => ((W.ch_stories || {})[c] || [null, null, null]);
const storiesDone = c => chStories(c).filter(Boolean).length;
const okWords = c => chWords(c).filter(w => w.s).length;
// 3 stories per chapter, fewer when a chapter has too few story-safe words (6 needed); swap only if a spare word exists
const need = c => Math.min(R.stories, Math.floor(okWords(c) / 2));
const swapMax = c => okWords(c) - 2 * need(c) >= 1 ? R.swaps : 0;
const allLearned = () => U.chapters.every(learnOk);
const allStories = () => U.chapters.every(c => storiesDone(c) >= need(c));
const swapsIn = c => (W.swapped || []).filter(s => s.ch === c);
R.learnPass = 80; R.unitPass = 80; R.swaps = 1;   // same as supabase/classwork_v2.sql

function who() {
  let r = null; try { r = JSON.parse(localStorage.getItem('dopp_remember') || 'null'); } catch (e) {}
  $('who').textContent = r && r.name ? 'Signed in as ' + r.name : '';
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function start() {
  who();
  if (!S) {
    app.innerHTML = `<div class="card"><h2>Sign in first</h2><p>Open the <a href="quest.html">Quest page</a> and sign in with your PIN, then come back here.</p></div>`;
    return;
  }
  let st;
  try { st = await rpc('cw_status'); } catch (e) { app.innerHTML = `<div class="card">Couldn't load Classwork: ${esc(e.message)}</div>`; return; }
  if (!st || !st.open) {
    app.innerHTML = `<div class="card"><h2>Coming soon</h2><p>Unit Classwork isn't open yet. For now, keep using the Classwork assignments in Schoology.</p></div>`;
    return;
  }
  const testBanner = st.live ? '' : `<div class="banner b-test">🔒 Hidden preview: only the TEST class can see Unit Classwork until Mr. Dopp turns it on.</div>`;
  const newBanner = TRI === '2026-T1' ? `<div class="banner b-good">✨ New! Unit Classwork is optional this trimester and already counts as done on your checklist. Try it and tell Mr. Dopp (Ask Mr. Dopp) what works and what doesn't.</div>` : '';
  if (!U) return hub(st, testBanner + newBanner);
  $('kicker').textContent = `Unit ${U.unit} · Chapters ${U.chapters.join(', ')}`;
  $('title').textContent = `Unit ${U.unit} Classwork`;
  $('sub').textContent = U.title;
  document.title = `Unit ${U.unit} Classwork — Dopp Health Class`;
  try { W = await rpc('cw_get', { p_unit: U.unit }); } catch (e) { app.innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
  app.dataset.banner = testBanner + newBanner;
  // land on the first chapter that still needs something
  if (W.status === 'submitted') view = { ch: 'done' };
  else {
    const next = U.chapters.find(c => !learnOk(c) || storiesDone(c) < need(c));
    if (next == null) view = { ch: 'unit' };
    else view = { ch: next, step: !learnOk(next) ? 'learn' : 'stories' };
  }
  draw();
}

// ── hub: all units ──
function hub(st, banner) {
  const by = {}; (st.units || []).forEach(w => { by[w.unit] = w; });
  app.innerHTML = banner + `<div class="card"><h2>Your Units</h2>
    <p class="muted">Each unit is split into chapters. In every chapter: <b>Learn</b> the words (80% to move on), <b>Practice</b>, take the <b>Chapter Test</b>, and write <b>3 short true stories</b> (fewer in a couple of short chapters). Then take the <b>Unit Test</b> and turn the unit in. Only Mr. Dopp reads your stories.</p></div>
    <div class="units">` + UNITS.map(u => {
      const w = by[u.unit];
      let pills = '<span class="pill">Not started</span>';
      if (w && w.status === 'submitted') pills = `<span class="pill ok">✓ Turned in · ${w.final_score}%</span>` + (w.unit_best ? `<span class="pill ${w.unit_best >= 80 ? 'ok' : 'go'}">Unit Test ${w.unit_best}%</span>` : '');
      else if (w) {
        const lb = w.learn_best || {}, cs = w.ch_stories || {};
        const learned = u.chapters.filter(c => Number(lb[c] || 0) >= 80).length;
        const st3 = u.chapters.reduce((t, c) => t + (cs[c] || []).filter(Boolean).length, 0);
        pills = `<span class="pill ${learned === u.chapters.length ? 'ok' : 'go'}">Learned ${learned}/${u.chapters.length} chapters</span><span class="pill">Stories ${st3}/${u.chapters.reduce((t, c) => t + Math.min(3, Math.floor(u.terms.filter(x => x.c === c && x.s).length / 2)), 0)}</span>`;
      }
      return `<a class="unit" href="classwork.html?unit=${u.unit}"><b>Unit ${u.unit}</b>${esc(u.title)}<div class="muted">Chapters ${u.chapters.join(', ')} · ${u.terms.length} words</div>${pills}</a>`;
    }).join('') + '</div>';
}

// ── unit page ──
function draw() {
  const sub = W.status === 'submitted';
  const chTabs = U.chapters.map(c => {
    const open = sub || chOpen(c), done = learnOk(c) && storiesDone(c) >= need(c);
    return `<button class="step${view.ch === c ? ' on' : ''}${done ? ' done' : ''}" data-ch="${c}" ${open ? '' : 'disabled'}>Ch ${c}</button>`;
  });
  const unitOpen = sub || (allLearned() && allStories());
  chTabs.push(`<button class="step${view.ch === 'unit' ? ' on' : ''}${W.unit_best >= R.unitPass ? ' done' : ''}" data-ch="unit" ${unitOpen ? '' : 'disabled'}>Unit Test</button>`);
  chTabs.push(`<button class="step${view.ch === 'done' ? ' on' : ''}${sub ? ' done' : ''}" data-ch="done" ${unitOpen ? '' : 'disabled'}>Turn In</button>`);
  app.innerHTML = (app.dataset.banner || '') + `<p><a href="classwork.html">← All units</a></p>` +
    `<div class="steps" style="grid-template-columns:repeat(${Math.min(chTabs.length, 6)},1fr)">${chTabs.join('')}</div><div id="pane"></div>`;
  app.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => {
    const v = b.dataset.ch; view = v === 'unit' || v === 'done' ? { ch: v } : { ch: +v, step: learnOk(+v) ? (view.step || 'learn') : 'learn' };
    test = null; learn = null; draw();
  });
  if (view.ch === 'unit') return paneUnitTest();
  if (view.ch === 'done') return paneDone();
  paneChapter(view.ch);
}

function paneChapter(c) {
  const p = $('pane'), ok = learnOk(c);
  const steps = [['learn', '1. Learn', true, ok], ['practice', '2. Practice', ok, false], ['test', '3. Chapter Test', ok, !!(W.ch_test || {})[c]], ['stories', '4. Stories', ok, storiesDone(c) >= need(c)]];
  p.innerHTML = `<div class="card" style="padding:12px 18px"><b style="font-family:Cinzel,serif;font-size:18px">Chapter ${c}</b>
      <span class="muted"> · ${chWords(c).length} words · Learn best ${learnBest(c)}%${(W.ch_test || {})[c] ? ' · Test best ' + W.ch_test[c].best + '%' : ''} · Stories ${storiesDone(c)}/${need(c)}</span></div>
    <div class="steps">${steps.map(([k, l, open, done]) => `<button class="step${view.step === k ? ' on' : ''}${done ? ' done' : ''}" data-step="${k}" ${open ? '' : 'disabled'}>${l}</button>`).join('')}</div>
    <div id="body"></div>`;

  if (!ok && view.step !== 'learn') view.step = 'learn';
  ({ learn: stepLearn, practice: stepPractice, test: stepChapterTest, stories: stepStories })[view.step](c, $('body'));
}

// 1. LEARN — every chapter word, one shared list of definitions (incl. a few from nearby chapters)

      catch (e) { toast(e.message); $('lgo').disabled = false; }
    };

    return;
  }
  const opts = '<option value="-1">Pick the definition…</option>' + learn.defs.map((d, j) => `<option value="${j}">${esc(d)}</option>`).join('');
  el.innerHTML = `<div class="card"><h2>Learn: Chapter ${c}</h2><p class="muted">${learn.words.length} words. Pick the definition that matches each word.</p>` +
    learn.words.map((w, i) => `<div class="q"><p>${i + 1}. ${esc(w)}</p><select data-li="${i}" style="width:100%;min-width:0">${opts}</select></div>`).join('') +
    `<div class="row" style="margin-top:12px"><button class="btn btn-gold" id="lsend">Check my answers</button><span class="muted" id="lleft"></span></div></div>`;
  const left = () => { const n = learn.answers.filter(a => a < 0).length; $('lleft').textContent = n ? n + ' left' : ''; };

  left();
  $('lsend').onclick = async () => {
    const n = learn.answers.filter(a => a < 0).length;
    if (n && !confirm(n + ' word(s) have no definition and will count as wrong. Check anyway?')) return;
    $('lsend').disabled = true;
    try { learnResult = await rpc('cw_learn_submit', { p_unit: U.unit, p_answers: learn.answers }); W = learnResult.work; learn = null; draw(); window.scrollTo(0, 0); }
    catch (e) { toast(e.message); $('lsend').disabled = false; }
  };
}

// 2. PRACTICE — flashcards + matching on this chapter's words (no points)
let practiceMode = 'flash', deck = null, deckCh = null, di = 0, flipped = false, round = null;
function stepPractice(c, el) {
  el.innerHTML = `<div class="card"><h2>Practice</h2><p class="muted">No points. Practice until you know these cold, then take the Chapter Test.</p>
    <div class="row"><button class="btn btn-sm ${practiceMode === 'flash' ? 'btn-ink' : 'btn-ghost'}" data-m="flash">🃏 Flashcards</button>
    <button class="btn btn-sm ${practiceMode === 'match' ? 'btn-ink' : 'btn-ghost'}" data-m="match">🧩 Matching</button>
    <button class="btn btn-sm ${practiceMode === 'list' ? 'btn-ink' : 'btn-ghost'}" data-m="list">📖 Word list</button>
    <button class="btn btn-sm btn-gold" id="toTest">Take the Chapter Test →</button></div><div id="pbody"></div></div>`;
  el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { practiceMode = b.dataset.m; stepPractice(c, el); });
  $('toTest').onclick = () => { view.step = 'test'; draw(); };
  const words = chWords(c);
  if (deckCh !== c) { deck = null; round = null; deckCh = c; }
  ({ list: wordList, flash: flashcards, match: matching })[practiceMode]($('pbody'), words);
}
function wordList(el, words) {
  el.innerHTML = '<div class="words">' + words.map(w => `<div class="w"><b>${esc(w.t)}</b>${w.x ? '<span class="x">extra</span>' : ''} — ${esc(w.d)}</div>`).join('') + '</div>';
}
function flashcards(el, words) {
  if (!deck) { deck = shuffle(words); di = 0; flipped = false; }
  const w = deck[di];
  el.innerHTML = `<div class="flash${flipped ? ' back' : ''}" id="card" tabindex="0" role="button" aria-label="Flip card">${flipped ? esc(w.d) : esc(w.t)}</div>
    <div class="row" style="justify-content:space-between"><button class="btn btn-sm btn-ghost" id="prev">← Back</button>
    <span class="muted">${di + 1} / ${deck.length} · tap the card to flip</span><button class="btn btn-sm btn-ghost" id="next">Next →</button></div>
    <p><button class="btn btn-sm btn-ghost" id="shuf">🔀 Shuffle</button></p>`;
  const flip = () => { flipped = !flipped; flashcards(el, words); };
  $('card').onclick = flip; $('card').onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
  $('prev').onclick = () => { di = (di - 1 + deck.length) % deck.length; flipped = false; flashcards(el, words); };
  $('next').onclick = () => { di = (di + 1) % deck.length; flipped = false; flashcards(el, words); };
  $('shuf').onclick = () => { deck = null; flashcards(el, words); };
}
function matching(el, words) {
  if (!round || round.left.every(x => x.done)) {
    const pick = shuffle(words).slice(0, 6);
    round = { left: pick.map(w => ({ w, done: false })), right: shuffle(pick).map(w => ({ w, done: false })), sel: null };
  }
  const L = round.left.map((x, i) => `<button class="mi${x.done ? ' ok' : ''}${round.sel === i ? ' sel' : ''}" data-l="${i}" ${x.done ? 'disabled' : ''}>${esc(x.w.t)}</button>`);
  const Rt = round.right.map((x, i) => `<button class="mi${x.done ? ' ok' : ''}" data-r="${i}" ${x.done ? 'disabled' : ''}>${esc(x.w.d)}</button>`);
  let rows = ''; for (let i = 0; i < round.left.length; i++) rows += L[i] + Rt[i];
  el.innerHTML = `<p class="muted">Tap a word, then tap its definition.</p><div class="match">${rows}</div>`;
  el.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { round.sel = +b.dataset.l; matching(el, words); });
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    if (round.sel == null) { toast('Tap a word first.'); return; }
    const a = round.left[round.sel], z = round.right[+b.dataset.r];
    if (a.w === z.w) { a.done = z.done = true; round.sel = null;
      if (round.left.every(x => x.done)) { toast('Round cleared! New words coming up.'); setTimeout(() => matching(el, words), 700); }
      matching(el, words);
    } else { b.classList.add('no'); setTimeout(() => b.classList.remove('no'), 500); }
  });
}

// 3. CHAPTER TEST / UNIT TEST — 20 questions (about 8 reasoning + 12 recall), graded by the database
let test = null, testResult = null;
function renderTest(el, opts) {
  const res = testResult && testResult.key === opts.key ? testResult : null;
  if (!test) {
    el.innerHTML = `<div class="card"><h2>${opts.title}</h2><p>${opts.intro}</p>
      ${res ? `<div class="banner ${res.passed ? 'b-good' : 'b-mid'}">Last try: <b>${res.score}%</b> (${res.right}/${res.total}).</div>` : ''}
      <p>Best: <b>${opts.best}%</b> · Tries: ${opts.tries}</p>
      <div class="row"><button class="btn btn-gold" id="tgo">${opts.tries ? 'Take it again' : 'Start'}</button>${opts.after || ''}</div>
      ${res && res.review.length ? '<h3 style="margin-top:16px">Questions you missed</h3>' + res.review.map(q => `<div class="q"><p>${esc(q[3])}</p>
        ${q.picked ? `<div class="opt wrong">Your answer: ${esc(q.picked)}</div>` : '<div class="opt wrong">No answer</div>'}
        <div class="opt right">Correct: ${esc(q[4])}</div>${q[8] ? `<p class="muted" style="font-weight:600;margin-top:6px">${esc(q[8])}</p>` : ''}</div>`).join('') : ''}</div>`;
    $('tgo').onclick = async () => {
      $('tgo').disabled = true;
      try {
        const r = await rpc('cw_test_start', { p_unit: U.unit, p_ch: opts.ch });
        const qs = r.ids.map(id => BANK[id]).filter(Boolean);
        if (qs.length !== r.ids.length) throw new Error('Some questions are missing. Reload the page and try again.');
        test = { key: opts.key, qs: qs.map(q => ({ q, opts: shuffle([q[4], q[5], q[6], q[7]]) })), answers: qs.map(() => null) };
        testResult = null; renderTest(el, opts);
      } catch (e) { toast(e.message); $('tgo').disabled = false; }
    };
    if (opts.wire) opts.wire();
    return;
  }
  el.innerHTML = `<div class="card"><h2>${opts.title}</h2><p class="muted">Some questions are about facts; some ask you to think a situation through. Read every choice.</p>` +
    test.qs.map((t, i) => `<div class="q"><p>${i + 1}. ${esc(t.q[3])}</p>` + t.opts.map((o, j) =>
      `<label class="opt"><input type="radio" name="t${i}" value="${j}" ${test.answers[i] === o ? 'checked' : ''}>${esc(o)}</label>`).join('') + `</div>`).join('') +
    `<div class="row" style="margin-top:12px"><button class="btn btn-gold" id="tsend">Check my answers</button><span class="muted" id="tleft"></span></div></div>`;
  const left = () => { const n = test.answers.filter(a => a == null).length; $('tleft').textContent = n ? n + ' unanswered' : ''; };
  el.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => { const i = +r.name.slice(1); test.answers[i] = test.qs[i].opts[+r.value]; left(); });
  left();
  $('tsend').onclick = async () => {
    const n = test.answers.filter(a => a == null).length;
    if (n && !confirm(n + ' question(s) are blank and will count as wrong. Check anyway?')) return;
    $('tsend').disabled = true;
    try {
      const r = await rpc('cw_test_submit', { p_unit: U.unit, p_answers: test.answers });
      const miss = new Set(r.misses);
      testResult = Object.assign(r, { key: opts.key, review: test.qs.map((t, i) => Object.assign(t.q.slice(), { picked: test.answers[i] })).filter(q => miss.has(q[0])) });
      W = r.work; test = null; draw(); window.scrollTo(0, 0);
    } catch (e) { toast(e.message); $('tsend').disabled = false; }
  };
}
function stepChapterTest(c, el) {
  const ct = (W.ch_test || {})[c] || {};
  renderTest(el, { key: 'ch' + c, ch: c, best: ct.best || 0, tries: ct.tries || 0, title: `Chapter ${c} Test`,
    intro: `20 questions from Chapter ${c}: about 8 make you think through a situation and 12 check the facts. There's no passing score here, so use it to see what you know. Retake it as many times as you want. Missed questions show the right answer and why.`,
    after: '<button class="btn btn-ink" id="tnext">Go to Stories →</button>', wire: () => { $('tnext').onclick = () => { view.step = 'stories'; draw(); }; } });
}
function paneUnitTest() {
  renderTest($('pane'), { key: 'unit', ch: null, best: W.unit_best || 0, tries: W.unit_tries || 0, title: `Unit ${U.unit} Test`,
    intro: `20 questions from every chapter in this unit (Chapters ${U.chapters.join(', ')}). You need <b>${R.unitPass}%</b> to pass. Retake it as many times as you want: your best score is your Unit Test grade, separate from your Classwork grade.`,
    after: W.unit_best >= R.unitPass ? '<span class="pill ok">✓ Passed</span>' : '' });
}

// 4. STORIES — 3 per chapter, 2 words from this chapter each
const openTimes = {};
function stepStories(c, el) {
  const used = new Set(); chStories(c).forEach(s => { if (s) { used.add(s.a); used.add(s.b); } });
  const swapLeft = swapMax(c) - swapsIn(c).length, k = need(c);
  el.innerHTML = `<div class="card"><h2>Chapter ${c} Stories</h2>
    <p>Write <b>${k} short ${k === 1 ? 'story' : 'stories'}</b> from your own life. Each uses <b>2 different words</b> from Chapter ${c}${k > 1 ? ` (${2 * k} words total)` : ''} and needs at least <b>${R.minWords} words</b>.</p>
    <div class="banner b-info">🔒 Only Mr. Dopp reads these. Your story must be true or based on real life. ${swapMax(c) ? `No story for a word? Tap "No story for this word" and pick another one (${swapLeft} swap left for this chapter).` : 'This chapter has only a few words you can use, so there is no word swap here.'}</div>
    <p class="muted">Each story is scored out of 100: length 40 · both words used 30 · real detail (2+ sentences and a who, where or when) 30.</p></div><div id="slots"></div>`;
  for (let i = 0; i < k; i++) $('slots').appendChild(storySlot(c, i));
}
function storySlot(c, i) {
  const st = chStories(c)[i], key = c + ':' + i;
  const d = document.createElement('div');
  d.className = 'story' + (st ? ' saved' : '');
  const used = new Set(); chStories(c).forEach((s, j) => { if (s && j !== i) { used.add(s.a); used.add(s.b); } });
  const sw = new Set((W.swapped || []).map(x => x.n));
  const choices = chWords(c).filter(w => w.s && !used.has(w.n) && !sw.has(w.n));
  const opt = sel => '<option value="">Pick a word…</option>' + choices.map(w => `<option value="${w.n}" ${sel === w.n ? 'selected' : ''}>${esc(w.t)}</option>`).join('');
  const locked = W.status === 'submitted';
  d.innerHTML = `<h3>Story ${i + 1}${st ? `<small>Saved · ${st.score.total}/100</small>` : ''}</h3>
    <div class="row"><select id="a${i}" ${locked ? 'disabled' : ''}>${opt(st ? st.a : null)}</select><select id="b${i}" ${locked ? 'disabled' : ''}>${opt(st ? st.b : null)}</select></div>
    ${locked || !swapMax(c) ? '' : `<div class="row" style="margin-top:6px"><button class="btn btn-sm btn-ghost" id="sw${i}" type="button">No story for this word</button></div><div id="swb${i}"></div>`}
    <p class="preview" id="def${i}"></p>
    <textarea id="t${i}" placeholder="Tell what really happened. Use both words." ${locked ? 'readonly' : ''}>${esc(st ? st.text : '')}</textarea>
    <div class="meter" id="m${i}"></div><div id="h${i}" class="muted"></div><div class="preview" id="pv${i}"></div>
    ${locked ? '' : `<div class="row" style="margin-top:8px"><button class="btn btn-gold" id="save${i}" type="button">Save story ${i + 1}</button><span class="muted" id="wait${i}"></span></div>`}`;
  const ta = d.querySelector('textarea'), sa = d.querySelector('#a' + i), sb = d.querySelector('#b' + i);
  const term = s => s.value ? termByN(+s.value).t : '';
  function live() {
    const a = term(sa), b = term(sb);
    d.querySelector('#def' + i).innerHTML = [sa, sb].filter(s => s.value).map(s => { const w = termByN(+s.value); return `<b>${esc(w.t)}</b>: ${esc(w.d)}`; }).join('<br>');
    const sc = scoreStory(ta.value, a, b);
    d.querySelector('#m' + i).innerHTML = `<div class="${sc.length === 40 ? 'full' : ''}">Length ${sc.length}/40<br><small>${sc.words}/${R.minWords} words</small></div>
      <div class="${sc.used === 30 ? 'full' : ''}">Words ${sc.used}/30</div><div class="${sc.detail === 30 ? 'full' : ''}">Detail ${sc.detail}/30</div>`;
    const h = hints(sc, a, b);
    d.querySelector('#h' + i).innerHTML = h.length ? '💡 ' + h.map(esc).join('<br>💡 ') : '✅ Looks complete. <b>Estimated ' + sc.total + '/100</b>';
    d.querySelector('#pv' + i).innerHTML = ta.value.trim() ? highlight(ta.value, [a, b]) : '';
  }
  ['paste', 'drop'].forEach(ev => ta.addEventListener(ev, e => { e.preventDefault(); toast('Type your story yourself. Pasting is turned off here.'); }));
  ta.addEventListener('focus', () => {
    if (locked || openTimes[key]) return;
    openTimes[key] = (W.story_open && W.story_open[key]) ? Date.parse(W.story_open[key]) : Date.now();
    rpc('cw_story_open2', { p_unit: U.unit, p_ch: c, p_slot: i }).catch(() => {});
  });
  ta.addEventListener('input', live); sa.onchange = live; sb.onchange = live;
  if (!locked) {
    if (swapMax(c)) d.querySelector('#sw' + i).onclick = () => swapPrompt(c, i, sa, sb, d.querySelector('#swb' + i));
    d.querySelector('#save' + i).onclick = async () => {
      if (!sa.value || !sb.value) { toast('Pick 2 words first.'); return; }
      if (sa.value === sb.value) { toast('Pick 2 different words.'); return; }
      const btn = d.querySelector('#save' + i); btn.disabled = true;
      try { const r = await rpc('cw_story_save2', { p_unit: U.unit, p_ch: c, p_slot: i, p_a: +sa.value, p_b: +sb.value, p_text: ta.value });
        W = r.work; toast(`Story ${i + 1} saved: ${r.score.total}/100`); draw(); }
      catch (e) { toast(e.message); btn.disabled = false; }
    };
  }
  setTimeout(live, 0);
  return d;
}
setInterval(() => {
  if (!U || !W || typeof view.ch !== 'number') return;
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById('wait' + i); if (!el) continue;
    const key = view.ch + ':' + i;
    const t0 = openTimes[key] || (W.story_open && W.story_open[key] ? Date.parse(W.story_open[key]) : 0);
    const since = t0 ? (Date.now() - t0) / 1000 : 0;
    el.textContent = t0 && since < R.minSeconds ? `You can save in ${Math.ceil(R.minSeconds - since)}s. Take your time.` : '';
  }
}, 1000);
function swapPrompt(c, i, sa, sb, el) {
  const left = swapMax(c) - swapsIn(c).length;
  const picks = [sa, sb].filter(s => s.value);
  if (!picks.length) { toast('Pick the word you have no story for first.'); return; }
  if (left <= 0) { el.innerHTML = `<div class="swapbox">You've used the word swap for this chapter. Pick a word you can write about.</div>`; return; }
  el.innerHTML = `<div class="swapbox"><b>No story for which word?</b><div class="row" style="margin:6px 0">` +
    picks.map(s => `<label><input type="radio" name="swn${i}" value="${s.value}"> ${esc(termByN(+s.value).t)}</label>`).join(' ') +
    `</div><input type="text" id="swr${i}" placeholder="In at least 5 words, why don't you have a story for it?" style="width:100%">
    <div class="row" style="margin-top:6px"><button class="btn btn-sm btn-ink" id="swgo${i}">Swap it out</button><button class="btn btn-sm btn-ghost" id="swx${i}">Cancel</button></div></div>`;
  el.querySelector('#swx' + i).onclick = () => { el.innerHTML = ''; };
  el.querySelector('#swgo' + i).onclick = async () => {
    const n = (el.querySelector(`input[name=swn${i}]:checked`) || {}).value;
    if (!n) { toast('Pick which word.'); return; }
    try { const r = await rpc('cw_swap2', { p_unit: U.unit, p_ch: c, p_n: +n, p_reason: el.querySelector('#swr' + i).value }); W = r.work; toast('Word swapped out. Pick a different one.'); draw(); }
    catch (e) { toast(e.message); }
  };
}

// TURN IN + certificate
function paneDone() {
  const p = $('pane');
  const la = W.learn_avg, sa = W.story_avg, fin = W.final_score;

    const ok = fin != null && fin >= R.minFinal;

      <div class="grid3"><div>${la == null ? '—' : la + '%'}<small>Learn (best, avg)</small></div><div>${sa == null ? '—' : sa + '%'}<small>Story average</small></div><div>${fin == null ? '—' : fin + '%'}<small>Classwork score</small></div></div>
      <p class="muted">Classwork score = (Learn average + story average) ÷ 2. You need at least ${R.minFinal}% to turn it in. Your Unit Test is a separate grade (best so far: ${W.unit_best || 0}%).</p>
      ${ok ? '' : `<div class="banner b-bad">Your score is under ${R.minFinal}%. Retake Learn in a chapter or improve a story (check the 💡 hints).</div>`}
      <div class="row"><button class="btn btn-gold" id="submit" ${ok ? '' : 'disabled'}>Turn in Unit ${U.unit} Classwork</button></div>
      <p class="muted">Once you turn it in, your Learn scores and stories are locked. You can still retake the Unit Test.</p></div>`;
    $('submit').onclick = async () => {
      if (!confirm('Turn in Unit ' + U.unit + ' Classwork now? Learn and stories lock after this.')) return;
      $('submit').disabled = true;
      try { W = (await rpc('cw_submit', { p_unit: U.unit })).work; draw(); } catch (e) { toast(e.message); $('submit').disabled = false; }
    };
    return;
  }
  let r = null; try { r = JSON.parse(localStorage.getItem('dopp_remember') || 'null'); } catch (e) {}
  p.innerHTML = `<div class="cert"><div class="kicker" style="color:#8a6400">Certificate of Completion</div>
    <h2>Unit ${U.unit} Classwork</h2><p>${esc(U.title)} · Chapters ${U.chapters.join(', ')}</p>
    <p style="font-size:20px;font-weight:800">${esc(r && r.name || '')}</p>
    <div class="big">${W.final_score}%</div>
    <div class="grid3"><div>${W.learn_avg}%<small>Learn average</small></div><div>${W.story_avg}%<small>Story average</small></div><div>${W.unit_best || 0}%<small>Unit Test (separate)</small></div></div>
    <p class="muted">Turned in ${new Date(W.submitted_at).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })}</p></div>
    <div class="card" style="margin-top:14px"><b>Done!</b> Your score goes to Schoology automatically. If it ever doesn't show up, take a screenshot of this certificate and attach it to the Schoology "Unit ${U.unit} Classwork" assignment.
    ${W.unit_best >= R.unitPass ? '' : ' Don\'t forget the <b>Unit Test</b> (80% to pass).'}</div>`;
}

start();
})();
</script>
</body>
</html>
