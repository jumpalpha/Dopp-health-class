<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,#0a0618 70%) fixed;color:#f4efff;font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto;padding:10px 16px}
.top a{color:#FFD700;font-weight:800;text-decoration:none}
.top h1{font-family:Cinzel,serif;font-size:20px;color:#FFD700;text-shadow:0 2px 0 #000}
#game{padding:0 8px 16px}
</style>
<!-- PWA --><link rel="manifest" href="app/sprite_dodge.webmanifest"><link rel="apple-touch-icon" href="app/sprite_dodge-180.png"><meta name="apple-mobile-web-app-title" content="Sprite Dodge"><meta name="theme-color" content="#140c2e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><script src="pwa.js" defer></script><!-- /PWA -->

<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Sprite Dodge</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const W = 420, H = 620, TOP = 176, GOAL = 60;          // arena is y TOP..H-20
const BAD = ART.JUNK, GOOD = ART.HEALTHY;
const R = 14;                                           // player hit radius (smaller than the art — forgiving)
let hits = [], me, shots, cones, rains, pickups, boss, keys, target, drag, t, attackT, pickT, lives, inv, shieldT, bonus, wonFlag, survived;

function reset() {
  me = { x: W / 2, y: H - 90, mood: 'happy', moodT: 0 };
  shots = []; cones = []; rains = []; pickups = [];
  boss = { x: W / 2, y: 128, dir: 1, talk: '', talkT: 0, mouth: 0 };
  hits = []; keys = {}; target = null; drag = null; t = 0; attackT = 1.6; pickT = 4; lives = 3; inv = 0; shieldT = 0; bonus = 0; wonFlag = false; survived = 0;
}
function input(type) {
  if (['left', 'right', 'up', 'down'].includes(type)) { keys[type] = true; target = null; }
  else if (type.startsWith('release-')) keys[type.slice(8)] = false;
}
// mouse: sprite follows the cursor. touch: drag anywhere and the sprite moves with your finger (so your finger never covers it)
function pointer(type, x, y) {
  if (type === 'move') target = { x, y };
  else if (type === 'down') { drag = { x, y }; target = null; }
  else if (type === 'drag' && drag) { me.x += (x - drag.x) * 1.25; me.y += (y - drag.y) * 1.25; drag = { x, y }; }
  else if (type === 'up') drag = null;
}
const TAUNTS = ['Have a soda!', 'Fries for everyone!', 'Skip the veggies!', 'Snack attack!', 'Sugar rush!', 'More junk!'];
function say(A, s) { boss.talk = s; boss.talkT = 1.6; }

function attack(A) {
  const lv = Math.min(1, A.time / GOAL);                // 0 → 1 over the first minute
  const r = Math.random();
  if (r < 0.45) {                                       // aimed junk volley
    const n = 1 + Math.floor(lv * 2 + Math.random() * 1.2);
    const base = Math.atan2(me.y - boss.y, me.x - boss.x);
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * 0.28, sp = 130 + lv * 50;
      shots.push({ x: boss.x, y: boss.y + 30, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, kind: BAD[Math.floor(Math.random() * BAD.length)], rot: 0 });
    }
    boss.mouth = 0.4; A.sfx('swipe');
  } else if (r < 0.75) {                                 // telegraphed soda spray cone
    const a = Math.atan2(me.y - boss.y, me.x - boss.x) + (Math.random() - 0.5) * 0.3;
    cones.push({ ox: boss.x, oy: boss.y, a, half: 0.2 + lv * 0.06, warn: 1.35 - lv * 0.3, fire: 0.35 });
    say(A, 'Soda spray!');
  } else {                                              // junk rain in warned columns
    const n = 2 + Math.floor(lv * 2), cols = [];
    for (let i = 0; i < n; i++) { let x; do { x = 40 + Math.random() * (W - 80); } while (cols.some(c => Math.abs(c - x) < 70)); cols.push(x); }
    cols.forEach(x => rains.push({ x, warn: 1.15, y: TOP - 20, kind: BAD[Math.floor(Math.random() * BAD.length)], live: false }));
    say(A, 'Junk rain!');
  }
  if (Math.random() < 0.25) say(A, TAUNTS[Math.floor(Math.random() * TAUNTS.length)]);
  attackT = Math.max(1.3, 2.2 - lv * 0.9) * (0.8 + Math.random() * 0.4);
}
function hurt(A, why) {
  if (inv > 0 || shieldT > 0) return;
  hits.push(why);
  lives--; inv = 1.4; me.mood = 'sugar'; me.moodT = 1.2;
  A.sfx('hit'); A.shake(8, 0.25); A.particles.burst(me.x, me.y, '#FF8FA3', 16, 200, 4); A.float('−1 ❤', me.x, me.y - 40, '#FF8FA3');
  if (lives <= 0) A.gameOver();
}
function update(dt, A) {
  if (!me) return;
  t += dt;
  if (boss.talkT > 0) boss.talkT -= dt;
  boss.mouth = Math.max(0, boss.mouth - dt);
  [...shots, ...rains].forEach(s => s.rot = (s.rot || 0) + dt * 3);
  if (A.state !== 'play') { boss.x = W / 2 + Math.sin(t * 0.8) * 120; return; }
  if (me.moodT > 0 && (me.moodT -= dt) <= 0) me.mood = 'happy';
  inv = Math.max(0, inv - dt); shieldT = Math.max(0, shieldT - dt);

  // move
  const sp = 300;
  if (keys.left) me.x -= sp * dt; if (keys.right) me.x += sp * dt; if (keys.up) me.y -= sp * dt; if (keys.down) me.y += sp * dt;
  if (target) { const dx = target.x - me.x, dy = target.y - me.y, d = Math.hypot(dx, dy), step = Math.min(d, 420 * dt); if (d > 1) { me.x += dx / d * step; me.y += dy / d * step; } }
  me.x = Math.max(24, Math.min(W - 24, me.x)); me.y = Math.max(TOP + 20, Math.min(H - 34, me.y));

  // boss strolls
  if (!cones.length) boss.x += boss.dir * (50 + Math.min(1, A.time / GOAL) * 50) * dt;
  if (boss.x < 80 || boss.x > W - 80) boss.dir *= -1;

  // score: 10 points per second survived + bonuses
  survived = A.time;
  const s = Math.floor(survived * 10) + bonus; if (s !== A.score) A.setScore(s);
  if (!wonFlag && survived >= GOAL) { wonFlag = true; A.win('You out-dodged King Junk for a full minute!'); say(A, 'Nooo! Fine, eat a salad…'); }

  attackT -= dt; if (attackT <= 0) attack(A);

  // shots
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i]; s.x += s.vx * dt; s.y += s.vy * dt;
    if (Math.hypot(s.x - me.x, s.y - me.y) < R + 11) { shots.splice(i, 1); hurt(A, 'shot'); continue; }
    if (s.x < -30 || s.x > W + 30 || s.y > H + 30 || s.y < -30) shots.splice(i, 1);
  }
  // cones
  for (let i = cones.length - 1; i >= 0; i--) {
    const c = cones[i];
    if (c.warn > 0) { c.warn -= dt; if (c.warn <= 0) { A.sfx('pop'); A.shake(4, 0.15); boss.mouth = 0.5; } continue; }
    c.fire -= dt;
    const a = Math.atan2(me.y - c.oy, me.x - c.ox); let da = Math.abs(a - c.a); if (da > Math.PI) da = 2 * Math.PI - da;
    if (da < c.half) hurt(A, 'cone');
    if (c.fire <= 0) cones.splice(i, 1);
  }
  // rain
  for (let i = rains.length - 1; i >= 0; i--) {
    const r = rains[i];
    if (r.warn > 0) { r.warn -= dt; continue; }
    r.y += 440 * dt;
    if (Math.abs(r.x - me.x) < R + 14 && Math.abs(r.y - me.y) < R + 14) { rains.splice(i, 1); hurt(A, 'rain'); continue; }
    if (r.y > H + 30) rains.splice(i, 1);
  }
  // healthy pickups
  pickT -= dt;
  if (pickT <= 0) {
    const roll = Math.random(), kind = lives < 3 && roll < 0.25 ? 'heart' : roll < 0.3 ? 'shield' : GOOD[Math.floor(Math.random() * GOOD.length)];
    pickups.push({ x: 40 + Math.random() * (W - 80), y: TOP + 50 + Math.random() * (H - TOP - 110), kind, life: 6 });
    pickT = 2.5 + Math.random() * 2;
  }
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i]; p.life -= dt;
    if (Math.hypot(p.x - me.x, p.y - me.y) < R + 18) {
      pickups.splice(i, 1);
      if (p.kind === 'heart') { lives = Math.min(3, lives + 1); A.sfx('medal'); A.float('+1 ❤', p.x, p.y - 20, '#FF8FA3'); }
      else if (p.kind === 'shield') { shieldT = 5; A.sfx('medal'); A.toast('🛡 Immune boost! 5 seconds of safety'); }
      else { bonus += 25; A.sfx('coin'); A.float('+25', p.x, p.y - 20, '#7CFFB2'); A.particles.burst(p.x, p.y, '#7CFFB2', 8, 140, 3); }
      continue;
    }
    if (p.life <= 0) pickups.splice(i, 1);
  }
}

function drawBoss(ctx, A) {
  const x = boss.x, y = boss.y + Math.sin(t * 3) * 3;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, boss.y + 52, 46, 8, 0, 0, 7); ctx.fill();
  ART.draw(ctx, 'burger', x, y, 90, t);
  // angry eyes + mouth on the bun
  ctx.fillStyle = '#fff'; [-16, 16].forEach(dx => { ctx.beginPath(); ctx.arc(x + dx, y - 12, 8, 0, 7); ctx.fill(); });
  ctx.fillStyle = A.INK; [-16, 16].forEach(dx => { ctx.beginPath(); ctx.arc(x + dx + (me.x - x) / 90, y - 11 + (me.y - y) / 160, 4, 0, 7); ctx.fill(); });
  ctx.strokeStyle = A.INK; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x - 26, y - 26); ctx.lineTo(x - 8, y - 20); ctx.moveTo(x + 26, y - 26); ctx.lineTo(x + 8, y - 20); ctx.stroke();
  // crown
  ctx.beginPath(); ctx.moveTo(x - 28, y - 38); ctx.lineTo(x - 28, y - 62); ctx.lineTo(x - 14, y - 48); ctx.lineTo(x, y - 68); ctx.lineTo(x + 14, y - 48); ctx.lineTo(x + 28, y - 62); ctx.lineTo(x + 28, y - 38); ctx.closePath(); A.ink('#FFD700', 3);
  ctx.fillStyle = '#FF3B5C'; ctx.beginPath(); ctx.arc(x, y - 50, 4, 0, 7); ctx.fill();
  if (boss.talkT > 0) {
    ctx.font = '900 14px Nunito,sans-serif'; const w = ctx.measureText(boss.talk).width + 20, bx = Math.max(8, Math.min(W - w - 8, x + 50)), by = y - 70;
    A.rr(bx, by, w, 28, 12); A.ink('#fff', 3); ctx.fillStyle = A.INK; ctx.textAlign = 'left'; ctx.fillText(boss.talk, bx + 10, by + 19);
  }
}
function draw(ctx, A) {
  // castle hall
  ctx.fillStyle = '#2a1b4d'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#3a2766'; for (let y = 0; y < TOP; y += 26) for (let x = (y / 26 % 2) * 26; x < W; x += 52) ctx.fillRect(x, y, 48, 22);
  ctx.fillStyle = '#5b2a6e'; ctx.fillRect(0, TOP - 12, W, 12);
  for (let y = TOP; y < H; y += 44.4) for (let x = 0; x < W; x += 52.5) { ctx.fillStyle = ((x / 52.5 + (y - TOP) / 44.4) | 0) % 2 ? '#e9e0ff' : '#cdbff2'; ctx.fillRect(x, y, 52.5, 44.4); }
  ctx.fillStyle = 'rgba(42,27,77,.18)'; ctx.fillRect(0, TOP, W, H - TOP);
  // banners
  [[40, '#FF3B5C'], [W - 40, '#FF3B5C']].forEach(([x, c]) => { ctx.beginPath(); ctx.moveTo(x - 16, 20); ctx.lineTo(x + 16, 20); ctx.lineTo(x + 16, 96); ctx.lineTo(x, 84); ctx.lineTo(x - 16, 96); ctx.closePath(); A.ink(c, 3); ART.draw(ctx, 'soda', x, 50, 22, 0); });
  if (!me) return;
  // cone warnings / blasts
  cones.forEach(c => {
    const len = 900;
    ctx.beginPath(); ctx.moveTo(c.ox, c.oy); ctx.arc(c.ox, c.oy, len, c.a - c.half, c.a + c.half); ctx.closePath();
    if (c.warn > 0) { ctx.fillStyle = 'rgba(255,59,92,' + (0.12 + 0.12 * Math.sin(t * 24)) + ')'; ctx.fill(); ctx.strokeStyle = 'rgba(255,59,92,.7)'; ctx.setLineDash([10, 8]); ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.fillStyle = 'rgba(120,70,30,.55)'; ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 14; i++) { const d = 60 + ((i * 53 + t * 900) % 560), a = c.a + ((i * 37) % 10 / 10 - 0.5) * c.half * 1.6; ctx.beginPath(); ctx.arc(c.ox + Math.cos(a) * d, c.oy + Math.sin(a) * d, 4, 0, 7); ctx.fill(); } }
  });
  rains.forEach(r => {
    if (r.warn > 0) { ctx.fillStyle = 'rgba(255,59,92,' + (0.15 + 0.15 * Math.sin(t * 20)) + ')'; ctx.fillRect(r.x - 22, TOP, 44, H - TOP); ctx.fillStyle = '#FF3B5C'; ctx.font = '900 22px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', r.x, TOP + 28); }
    else { ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot); ART.draw(ctx, r.kind, 0, 0, 34, t); ctx.restore(); }
  });
  pickups.forEach(p => {
    if (p.life < 1.5 && Math.sin(t * 20) < 0) return;
    ctx.fillStyle = p.kind === 'shield' ? 'rgba(56,191,255,.3)' : 'rgba(0,229,160,.3)'; ctx.beginPath(); ctx.arc(p.x, p.y, 22 + Math.sin(t * 6) * 2, 0, 7); ctx.fill();
    ART.draw(ctx, p.kind, p.x, p.y + Math.sin(t * 4) * 3, 32, t);
  });
  drawBoss(ctx, A);
  shots.forEach(s => { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.fillStyle = 'rgba(255,59,92,.25)'; ctx.beginPath(); ctx.arc(0, 0, 19, 0, 7); ctx.fill(); ART.draw(ctx, s.kind, 0, 0, 30, t); ctx.restore(); });
  // player
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(me.x, me.y + 26, 22, 6, 0, 0, 7); ctx.fill();
  if (!(inv > 0 && Math.sin(t * 30) < 0)) A.drawHero(me.x, me.y, 84, 0, me.mood);
  if (shieldT > 0) { ctx.strokeStyle = 'rgba(56,191,255,' + (shieldT < 1.5 && Math.sin(t * 20) < 0 ? 0.2 : 0.85) + ')'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(me.x, me.y, 34, 0, 7); ctx.stroke(); }
  // HUD
  ctx.font = '900 16px Nunito,sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#FF3B5C'; ctx.lineWidth = 4; ctx.strokeStyle = A.INK;
  const hearts = '❤'.repeat(Math.max(0, lives)); ctx.fillText(hearts, 14, H - 10);
  const left = Math.max(0, GOAL - survived); ctx.textAlign = 'right'; ctx.font = '900 15px Nunito,sans-serif';
  const label = wonFlag ? '🏆 ' + Math.floor(survived) + 's' : '⏱ ' + Math.ceil(left) + 's to win';
  ctx.strokeText(label, W - 14, H - 10); ctx.fillStyle = '#FFD700'; ctx.fillText(label, W - 14, H - 10);
}

window.__dodge = () => ({ me, shots, cones, rains, pickups, boss, lives, R, hits, setT: v => { target = v; } });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Sprite Dodge', subtitle: 'Out-dodge King Junk!', W, H, reserveH: 70,
  storageKey: 'sprite_dodge', winText: 'You survived a full minute!', deathDelay: 800, overTitle: 'Junked!',
  medals: [{ at: 300, name: 'Bronze', icon: '🥉' }, { at: 700, name: 'Silver', icon: '🥈' }, { at: 1200, name: 'Gold', icon: '🥇' }, { at: 2000, name: 'Legend', icon: '💎' }],
  howTo: 'King Junk throws junk food at you! Dodge the flying snacks, step out of the <b style="color:#FF3B5C">red warning zones</b>, and grab fruit for bonus points.<br>🛡 = immune boost · ❤ = extra heart. <b>Survive 60 seconds</b> to win.',
  controls: 'Move mouse / drag finger anywhere · or arrow keys · P pause',
  facts: [
    'A can of regular soda has about 9–10 teaspoons of sugar.',
    'Sleep, exercise, and good food all help your immune system fight germs.',
    'Water is the best drink for thirst — it has zero sugar and zero calories.',
    'Fast food is okay sometimes. Healthy habits are about what you do most days.',
    'Fruits and vegetables help your body build a stronger immune system.'
  ],
  reset, update, draw, input, pointer
});
})();
</script>
