<style>
:root{--gold:#FFD700;--emerald:#00E5A0;--sky:#38BFFF;--crimson:#FF3B5C;--bg:#0a0618;--panel:#160f2e;--line:rgba(255,215,0,.25);--text:#f4efff;--dim:#b9b0d6}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,var(--bg) 60%) fixed;color:var(--text);font-family:Nunito,system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.cinzel{font-family:Cinzel,serif}
h1{color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px rgba(255,215,0,.35);font-size:clamp(26px,4vw,40px)}
.sub{color:var(--dim);margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
label{display:block;font-weight:800;margin-bottom:6px}
input[type=text],input[type=password],select{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid #4a3d78;background:#0b0716;color:var(--text)}
button{font:inherit;font-weight:900;font-size:17px;padding:12px 20px;border-radius:12px;border:0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-gold{background:var(--gold);color:#2a1d00}
.btn-em{background:var(--emerald);color:#03261a}
.btn-sky{background:var(--sky);color:#04202f}
.btn-ghost{background:transparent;color:var(--text);border:1px solid #5b4d8c}
.btn-red{background:transparent;color:var(--crimson);border:1px solid var(--crimson)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--crimson);font-weight:800;margin-top:10px;min-height:1.2em}
.hidden{display:none!important}
/* top bar during game */
.topbar{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.join{display:flex;gap:18px;align-items:center}
.join .code{font-family:Cinzel,serif;font-weight:900;font-size:clamp(40px,7vw,72px);letter-spacing:6px;color:var(--gold);text-shadow:0 3px 0 #000}
.join .how{font-size:18px;color:var(--dim);line-height:1.4}
.join .how b{color:var(--text)}
#qr{background:#fff;padding:8px;border-radius:10px;line-height:0}
.stat{font-size:20px;font-weight:800}
.stat b{color:var(--emerald);font-size:28px}
/* picker */
.picker-grid{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:760px){.picker-grid{grid-template-columns:1fr}}
.qlist{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:4px}
.qitem{text-align:left;background:#0f0a22;border:1px solid #3b2f66;color:var(--text);font-weight:700;font-size:16px;padding:12px 14px;border-radius:10px}
.qitem.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,0,.35)}
.qitem .tag{display:inline-block;font-size:12px;font-weight:900;padding:2px 8px;border-radius:99px;margin-right:6px;vertical-align:2px}
.tag.green{background:var(--emerald);color:#03261a}.tag.yellow{background:var(--gold);color:#2a1d00}.tag.red{background:var(--crimson);color:#fff}.tag.custom{background:var(--sky);color:#04202f}
.qitem .used{color:var(--dim);font-size:13px;margin-left:6px}
/* stage */
.stage-label{color:var(--dim);font-weight:800;letter-spacing:1px;text-transform:uppercase;font-size:14px}
.stage-q{font-size:clamp(28px,4.4vw,52px);font-weight:900;line-height:1.15;margin:10px 0 22px;text-shadow:0 2px 0 #000}
.note{background:rgba(255,59,92,.12);border-left:4px solid var(--crimson);padding:10px 14px;border-radius:8px;margin-bottom:16px;color:#ffd6de}
.bars{display:flex;flex-direction:column;gap:16px}
.bar{position:relative;background:#0b0716;border:1px solid #3b2f66;border-radius:14px;overflow:hidden;min-height:76px}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;transition:width .6s ease}
.bar.a .fill{background:linear-gradient(90deg,#1d7fb0,var(--sky))}
.bar.b .fill{background:linear-gradient(90deg,#b0213c,var(--crimson))}
.bar .lab{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;font-size:clamp(20px,2.6vw,30px);font-weight:900;text-shadow:0 2px 3px #000}
.bar .pct{font-family:Cinzel,serif;white-space:nowrap}
.hiddenres{font-size:24px;font-weight:800;color:var(--dim);padding:26px;text-align:center;border:1px dashed #4a3d78;border-radius:14px}
.shift{margin-top:18px;font-size:24px;font-weight:900;color:var(--gold);text-align:center}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.compare{grid-template-columns:1fr}}
.compare h3{font-family:Cinzel,serif;color:var(--dim);margin-bottom:10px}
.controls{margin-top:22px}
.check{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--dim)}
.check input{width:20px;height:20px}
.tiny{font-size:14px;color:var(--dim)}
a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">

<!-- ===== Setup ===== -->
<section id="setup">
  <h1>⚔️ Live Class Games</h1>
  <p class="sub">Teacher screen. Put this on the projector. Students join on their phones at <b>doppsclass.com/live.html</b>.</p>
  <div class="panel" style="max-width:520px">
    <label for="game">Game</label>
    <select id="game">
      <option value="pick_a_side">Pick a Side Live: class vote</option>
    </select>
    <div style="height:14px"></div>
    <label for="pass">Teacher passphrase</label>
    <input type="password" id="pass" autocomplete="current-password" placeholder="The phrase you set in Supabase">
    <div class="row" style="margin-top:14px"><button class="btn-gold" id="startBtn">Start game</button></div>
    <div class="err" id="setupErr"></div>
  </div>
</section>

<!-- ===== Game ===== -->
<section id="game-area" class="hidden">
  <div class="panel topbar">
    <div class="join">
      <div id="qr"></div>
      <div>
        <div class="how">Go to <b id="joinUrl">doppsclass.com/live.html</b><br>Game code:</div>
        <div class="code" id="code">------</div>
      </div>
    </div>
    <div>
      <div class="stat"><b id="players">0</b> joined</div>
      <div class="stat" id="votedLine"><b id="voted">0</b> voted</div>
    </div>
  </div>

  <!-- picker -->
  <div class="panel" id="picker">
    <h2 style="color:var(--gold)">Choose a question</h2>
    <div class="picker-grid" style="margin-top:14px">
      <div>
        <label for="set">Question set</label>
        <select id="set"></select>
        <div id="unlockBox" class="hidden" style="margin-top:12px">
          <label for="redPass">Red set passcode</label>
          <input type="password" id="redPass" autocomplete="off">
          <div class="row" style="margin-top:8px"><button class="btn-red" id="unlockBtn">Unlock</button></div>
          <div class="err" id="unlockErr"></div>
        </div>
        <div id="customBox" class="hidden" style="margin-top:12px">
          <label for="cq">Your question</label><input type="text" id="cq" maxlength="160">
          <div style="height:8px"></div>
          <label for="ca">Side A</label><input type="text" id="ca" maxlength="60">
          <div style="height:8px"></div>
          <label for="cb">Side B</label><input type="text" id="cb" maxlength="60">
        </div>
        <p class="tiny" style="margin-top:12px">Full talking points and sources: <a href="pick_a_side.html" target="_blank" rel="noopener">open Pick a Side</a> in another tab.</p>
      </div>
      <div class="qlist" id="qlist"></div>
    </div>
    <div class="row controls">
      <button class="btn-em" id="voteBtn" disabled>Start vote ▶</button>
      <label class="check"><input type="checkbox" id="hideLive" checked> Hide results until voting closes</label>
      <span style="flex:1"></span>
      <button class="btn-red" id="endBtn">End game</button>
    </div>
  </div>

  <!-- stage -->
  <div class="panel hidden" id="stage">
    <div class="stage-label" id="stageLabel"></div>
    <div class="stage-q" id="stageQ"></div>
    <div class="note hidden" id="stageNote"></div>
    <div id="results"></div>
    <div class="row controls">
      <button class="btn-gold" id="closeBtn">Close voting</button>
      <button class="btn-sky hidden" id="revoteBtn">Revote after discussion 🔁</button>
      <button class="btn-em hidden" id="nextBtn">Next question</button>
      <span style="flex:1"></span>
      <button class="btn-red" id="endBtn2">End game</button>
    </div>
  </div>
  <div class="err" id="gameErr"></div>
</section>

</div>

const RED_ITER = 200000;
let RED = null;

// ---------- state ----------
let S = null;            // {sid, tok, code}
let selected = null;     // question object chosen in picker
let current = null;      // {q, qi, revote}
let rounds = {};         // qi -> tally at close
let lastState = null, lastRes = null, pollTimer = null, busy = false;
const used = new Set();

function saveS(){ try { sessionStorage.setItem('live_host', JSON.stringify({S, current, rounds, used:[...used]})); } catch(e){} }
function loadS(){ try { const o = JSON.parse(sessionStorage.getItem('live_host') || 'null'); if (o && o.S){ S=o.S; current=o.current; rounds=o.rounds||{}; (o.used||[]).forEach(x=>used.add(x)); } } catch(e){} }
function clearS(){ S=null; current=null; rounds={}; used.clear(); try { sessionStorage.removeItem('live_host'); } catch(e){} }

// ---------- red set ----------
function b64ToBytes(b){ const s = atob(b); const a = new Uint8Array(s.length); for (let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
async function decryptRed(pass){
  const raw = b64ToBytes(RED_BLOB), salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:RED_ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data)));
}

// ---------- picker ----------
function buildSets(){
  const o = ['<option value="custom">✏️ Your own question</option>'];
  for (let n=1;n<=28;n++) o.push('<option value="'+n+'">Chapter '+n+': '+esc(CHAPTERS[n])+'</option>');
  o.push('<option value="bg">👥 Boys &amp; Girls series</option>');
  o.push('<option value="red">🔒 Red set (teacher passcode)</option>');
  $('set').innerHTML = o.join('');
  $('set').value = '1';
}
function setQuestions(v){
  if (v === 'red') return RED || [];
  if (v === 'bg') return QUESTIONS.filter(q => q.series === 'bg');
  const n = +v; return QUESTIONS.filter(q => !q.series && q.ch === n);
}
function renderList(){
  const v = $('set').value;
  $('unlockBox').classList.toggle('hidden', !(v === 'red' && !RED));
  $('customBox').classList.toggle('hidden', v !== 'custom');
  if (v === 'custom'){ $('qlist').innerHTML = '<p class="tiny">Type a question and two sides on the left, then press Start vote.</p>'; selected = null; updateVoteBtn(); return; }
  const qs = setQuestions(v);
  if (!qs.length){ $('qlist').innerHTML = '<p class="tiny">'+(v==='red' ? 'Enter the passcode to see the red set.' : 'No questions here.')+'</p>'; selected=null; updateVoteBtn(); return; }
  $('qlist').innerHTML = qs.map(q =>
    '<button type="button" class="qitem'+(selected && selected.id===q.id ? ' sel':'')+'" data-id="'+esc(q.id)+'">'+
    '<span class="tag '+q.light+'">'+q.light.toUpperCase()+'</span>'+esc(q.q)+
    (used.has(q.id) ? '<span class="used">✓ used</span>' : '')+'</button>').join('');
  $('qlist').querySelectorAll('.qitem').forEach(b => b.onclick = () => {
    selected = qs.find(q => q.id === b.dataset.id); renderList(); updateVoteBtn();
  });
}
function customQ(){
  const q = $('cq').value.trim(), a = $('ca').value.trim(), b = $('cb').value.trim();
  return q && a && b ? { id:'custom-'+Date.now(), light:'custom', q, a, b } : null;
}
function updateVoteBtn(){ $('voteBtn').disabled = !($('set').value === 'custom' ? customQ() : selected); }

// ---------- server calls ----------
async function rpc(name, args){
  const { data, error } = await db.rpc(name, args);
  if (error) throw new Error(error.message);
  return data;
}

async function startGame(){
  $('setupErr').textContent = '';
  if (!db){ $('setupErr').textContent = 'Could not load the game server. Check the internet connection.'; return; }
  const pass = $('pass').value;
  if (!pass){ $('setupErr').textContent = 'Enter your teacher passphrase.'; return; }
  $('startBtn').disabled = true;
  try {
    const rows = await rpc('create_live_session', { p_teacher_pass: pass, p_game_type: $('game').value, p_settings: {} });
    const r = rows[0];
    clearS(); S = { sid: r.session_id, tok: r.host_token, code: r.join_code };
    $('pass').value = '';
    saveS(); enterGame();
  } catch(e){
    $('setupErr').textContent = /passphrase/i.test(e.message) ? 'That passphrase is not right.' : 'Could not start: ' + e.message;
  } finally { $('startBtn').disabled = false; }
}

function joinUrl(){
  const base = location.href.replace(/[?#].*$/, '').replace(/live_host\.html$/, 'live.html');
  return base + '?code=' + S.code;
}

function enterGame(){
  $('setup').classList.add('hidden'); $('game-area').classList.remove('hidden');
  $('code').textContent = S.code;
  $('joinUrl').textContent = location.protocol === 'file:' ? 'live.html' : location.host + '/live.html';
  $('qr').innerHTML = '';
  if (window.QRCode) new QRCode($('qr'), { text: joinUrl(), width: 132, height: 132, colorDark:'#000', colorLight:'#fff' });
  else $('qr').classList.add('hidden');
  renderList(); updateVoteBtn();
  showView();
  poll(); clearInterval(pollTimer); pollTimer = setInterval(poll, 1500);
}

async function poll(){
  if (!S || busy) return;
  try {
    const [st, res] = await Promise.all([
      rpc('get_live_state', { p_session_id: S.sid }),
      rpc('host_get_results', { p_session_id: S.sid, p_host_token: S.tok })
    ]);
    if (!st || !res || st.phase === 'ended'){ gameGone(); return; }
    lastState = st; lastRes = res;
    $('gameErr').textContent = '';
    $('players').textContent = st.player_count;
    $('voted').textContent = st.phase === 'lobby' ? '–' : st.answer_count;
    showView();
  } catch(e){ $('gameErr').textContent = 'Connection problem, retrying… (' + e.message + ')'; }
}

function gameGone(){
  clearInterval(pollTimer); clearS();
  $('game-area').classList.add('hidden'); $('setup').classList.remove('hidden');
  $('setupErr').textContent = 'Game over. Start a new one whenever you are ready.';
}

// ---------- views ----------
function tallyOf(res){ const t = (res && res.tally) || {}; return { A: t.A || 0, B: t.B || 0 }; }
function barsHTML(q, t){
  const total = t.A + t.B, pa = total ? Math.round(100*t.A/total) : 0, pb = total ? 100 - pa : 0;
  return '<div class="bars">'+
    '<div class="bar a"><div class="fill" style="width:'+pa+'%"></div><div class="lab"><span>'+esc(q.a)+'</span><span class="pct">'+pa+'% · '+t.A+'</span></div></div>'+
    '<div class="bar b"><div class="fill" style="width:'+pb+'%"></div><div class="lab"><span>'+esc(q.b)+'</span><span class="pct">'+pb+'% · '+t.B+'</span></div></div></div>';
}
function pctA(t){ const n = t.A + t.B; return n ? Math.round(100*t.A/n) : null; }

function showView(){
  const phase = lastState ? lastState.phase : 'lobby';
  const onStage = current && (phase === 'question' || phase === 'reveal');
  $('picker').classList.toggle('hidden', !!onStage);
  $('stage').classList.toggle('hidden', !onStage);
  $('votedLine').classList.toggle('hidden', !onStage);
  if (!onStage) return;

  const q = current.q;
  $('stageLabel').textContent = (current.revote ? '🔁 Revote · ' : '') +
    (q.series === 'bg' ? 'Boys & Girls' : q.light === 'custom' ? 'Class question' : q.light === 'red' ? 'Red set' : 'Chapter ' + q.ch + ' · ' + (CHAPTERS[q.ch] || ''));
  $('stageQ').textContent = q.q;
  $('stageNote').classList.toggle('hidden', !q.note);
  if (q.note) $('stageNote').textContent = '🛑 Teacher note: ' + q.note;

  const t = tallyOf(lastRes);
  let html;
  if (phase === 'question'){
    html = $('hideLive').checked
      ? '<div class="hiddenres">🤫 Results hidden until voting closes · '+(t.A+t.B)+' of '+lastState.player_count+' voted</div>'
      : barsHTML(q, t);
  } else {
    const fin = rounds[current.qi] || t;
    if (current.revote && rounds[current.qi - 1]){
      const before = rounds[current.qi - 1], b = pctA(before), a = pctA(fin);
      let shift = '';
      if (b != null && a != null){
        const d = a - b;
        shift = d === 0 ? 'No change overall.'
          : '“' + esc(q.a) + '” went from <b>' + b + '%</b> to <b>' + a + '%</b> ' + (d > 0 ? '⬆' : '⬇');
      }
      html = '<div class="compare"><div><h3>Before discussion</h3>'+barsHTML(q, before)+'</div><div><h3>After discussion</h3>'+barsHTML(q, fin)+'</div></div>'+
             '<div class="shift">'+shift+'</div>';
    } else html = barsHTML(q, fin);
  }
  $('results').innerHTML = html;

  $('closeBtn').classList.toggle('hidden', phase !== 'question');
  $('revoteBtn').classList.toggle('hidden', !(phase === 'reveal' && !current.revote));
  $('nextBtn').classList.toggle('hidden', phase !== 'reveal');
}

// ---------- host actions ----------
async function act(fn){
  if (busy) return; busy = true;
  try { await fn(); } catch(e){ $('gameErr').textContent = e.message; }
  finally { busy = false; poll(); }
}
function nextIndex(){ return lastState ? Math.max(lastState.q_index, current ? current.qi : -1) + 1 : 0; }

async function startVote(q, revote){
  const qi = nextIndex();
  const payload = { prompt: q.q, choices: [q.a, q.b], light: q.light, revote: !!revote };
  const ok = await rpc('host_set_question', { p_session_id: S.sid, p_host_token: S.tok, p_q_index: qi,
    p_question: payload, p_answer_key: null, p_seconds: null });
  if (!ok) throw new Error('The server did not accept that. The game may have ended.');
  current = { q, qi, revote: !!revote }; used.add(q.id);
  lastState = Object.assign({}, lastState, { phase:'question', q_index: qi, answer_count: 0 });
  lastRes = Object.assign({}, lastRes, { tally:{} });
  saveS(); showView();
}

$('startBtn').onclick = startGame;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
$('set').onchange = () => { selected = null; renderList(); updateVoteBtn(); };
['cq','ca','cb'].forEach(id => $(id).addEventListener('input', updateVoteBtn));
$('unlockBtn').onclick = async () => {
  $('unlockErr').textContent = '';
  try { const d = await decryptRed($('redPass').value); RED = d.Q; $('redPass').value=''; renderList(); }
  catch(e){ $('unlockErr').textContent = 'Wrong passcode.'; }
};
$('voteBtn').onclick = () => act(async () => {
  const q = $('set').value === 'custom' ? customQ() : selected;
  if (q) await startVote(q, false);
});
$('closeBtn').onclick = () => act(async () => {
  const res = await rpc('host_get_results', { p_session_id: S.sid, p_host_token: S.tok });
  rounds[current.qi] = tallyOf(res);
  if (!await rpc('host_set_phase', { p_session_id: S.sid, p_host_token: S.tok, p_phase: 'reveal' })) throw new Error('Could not close voting.');
  lastState = Object.assign({}, lastState, { phase:'reveal' }); saveS(); showView();
});
$('revoteBtn').onclick = () => act(async () => { await startVote(current.q, true); });
$('nextBtn').onclick = () => act(async () => {
  await rpc('host_set_phase', { p_session_id: S.sid, p_host_token: S.tok, p_phase: 'lobby' });
  current = null; selected = null; lastState = Object.assign({}, lastState, { phase:'lobby' });
  saveS(); renderList(); updateVoteBtn(); showView();
});
async function endGame(){
  if (!confirmEnd()) return;
  await act(async () => { await rpc('host_set_phase', { p_session_id: S.sid, p_host_token: S.tok, p_phase: 'ended' }); });
  gameGone(); $('setupErr').textContent = 'Game ended.';
}
// two-tap confirm instead of a browser dialog
let endArmed = 0;
function confirmEnd(){
  const now = Date.now();
  if (now - endArmed < 4000) return true;
  endArmed = now; ['endBtn','endBtn2'].forEach(id => { $(id).textContent = 'Tap again to end'; });
  setTimeout(() => ['endBtn','endBtn2'].forEach(id => { $(id).textContent = 'End game'; }), 4000);
  return false;
}
$('endBtn').onclick = endGame; $('endBtn2').onclick = endGame;
$('hideLive').onchange = showView;

buildSets(); renderList();
loadS();
if (S) enterGame();
</script>
</body>
</html>
