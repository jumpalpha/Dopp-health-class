<script>

try { if (localStorage.getItem('sprite_climb_ver') !== '2') {
  ['sprite_climb_best', 'sprite_climb_wins'].forEach(k => localStorage.removeItem(k));
  const q = JSON.parse(localStorage.getItem('dopp_score_queue') || '{}'); Object.keys(q).forEach(k => { if (/\|sprite_climb$/.test(k)) delete q[k]; });

<script>
(() => {
const W = 420, H = 640;
// girders: {x0, x1, yL, yR}. Barrels roll downhill and drop off the open low end.
const P = [
  { x0: 0,  x1: 420, yL: 612, yR: 612 },   // 0 ground
  { x0: 40, x1: 420, yL: 534, yR: 516 },   // 1 rolls left, drops at x0
  { x0: 0,  x1: 380, yL: 432, yR: 450 },   // 2 rolls right, drops at x1
  { x0: 40, x1: 420, yL: 350, yR: 332 },   // 3 rolls left
  { x0: 0,  x1: 380, yL: 248, yR: 266 },   // 4 rolls right
  { x0: 0,  x1: 300, yL: 168, yR: 168 }    // 5 top: King Junk + Golden Apple
];
const LADDERS = [ { x: 370, a: 0, b: 1 }, { x: 80, a: 1, b: 2 }, { x: 330, a: 2, b: 3 }, { x: 200, a: 2, b: 3, broken: true }, { x: 90, a: 3, b: 4 }, { x: 250, a: 4, b: 5 } ];
const GOAL_X = 262;
const JUNK = ['soda', 'donut', 'burger', 'fries', 'cookie', 'candy'];
const TIPS = ['Climbing stairs is a great everyday workout.', 'Jumping builds strong bones.', 'Junk food every day adds up fast; balance is key.',
  'Broccoli is packed with vitamin C and fiber.', 'Strong legs and core help you climb, jump and balance.'];

// ---- physics (pixels, seconds) ----
const GRAV = 1500, JUMP_V = 410, WALK = 112, CLIMB = 90;
const SAFE_FALL = 64;          // falling farther than this (from the highest point) knocks you out
const COYOTE = 0.07, JUMP_BUF = 0.12;
const HB = { w: 7, top: 28, bot: 2 }, BR = 11;   // player half-width / height, barrel radius
let me, barrels, throwT, king, level, lives, keys, power, powerUp, banner, t, deadT, deathMsg, bonus, bonusT;
const py = (p, x) => p.yL + (p.yR - p.yL) * (x - p.x0) / (p.x1 - p.x0);
const on = (p, x) => x >= p.x0 && x <= p.x1;

function respawn() {
  me = { x: 30, y: P[0].yL, vx: 0, vy: 0, plat: 0, ground: true, ladder: null, face: 1, walk: 0, inv: 1.2, coyote: 0, jumpBuf: 0, peakY: P[0].yL, airVx: 0 };
  barrels = []; throwT = 1.2; power = 0; deadT = 0; deathMsg = '';
  powerUp = { x: 200, plat: 2, got: false, t: 0 };
  bonus = 5000; bonusT = 0;
}
function reset(A) { level = 1; lives = 3; keys = {}; t = 0; king = { throwAnim: 0 }; banner = 2; respawn(); }
function input(type, A) {
  if (type.startsWith('release-')) { keys[type.slice(8)] = false; return; }
  keys[type] = true;
  if (type === 'tap') me.jumpBuf = JUMP_BUF;   // pressed a hair early still counts
}
function nearLadder(x) { return LADDERS.find(l => !l.broken && Math.abs(l.x - x) < 7); }
function die(A, why) {
  if (deadT > 0) return;
  lives--; deadT = 1.6; deathMsg = why; me.ladder = null; A.sfx('hit'); A.shake(10, 0.3); A.flash(0.15);
  A.particles.burst(me.x, me.y - 16, '#FF8FA3', 22, 220, 4);
  if (lives <= 0) { A.gameOver(); return; }
  A.toast('💔 ' + why + ' — ' + lives + (lives === 1 ? ' life' : ' lives') + ' left', 2000);
}
function levelClear(A) {
  const pts = 1000 * level + bonus;
  A.addScore(pts); A.sfx('win');
  A.float('Golden Apple! +' + pts, W / 2, 300, '#FFD700');
  A.particles.burst(GOAL_X, P[5].yL - 20, '#FFD700', 40, 300, 5);
  if (level === 1) A.win('You grabbed the Golden Apple!');
  else A.toast('💡 ' + TIPS[level % TIPS.length], 2400);
  level++; banner = 2; respawn();
}
// circle (barrel) vs the player's body box
function hitsMe(b) {
  const cx = Math.max(me.x - HB.w, Math.min(b.x, me.x + HB.w)), cy = Math.max(me.y - HB.top, Math.min(b.y, me.y - HB.bot));
  return (b.x - cx) ** 2 + (b.y - cy) ** 2 < (BR - 1) ** 2;
}
function land(A, i, gy) {
  const fall = gy - me.peakY;
  me.y = gy; me.vy = 0; me.ground = true; me.plat = i; me.peakY = gy; me.airVx = 0;
  if (fall > SAFE_FALL) die(A, 'Fell too far');
}

function update(dt, A) {
  t += dt; king.throwAnim = Math.max(0, king.throwAnim - dt * 2);
  if (!me || A.state !== 'play') return;
  dt = Math.min(dt, 1 / 30);
  banner = Math.max(0, banner - dt);
  if (deadT > 0) { deadT -= dt; if (deadT <= 0 && A.state === 'play') respawn(); return; }
  power = Math.max(0, power - dt); me.inv = Math.max(0, me.inv - dt); me.jumpBuf = Math.max(0, me.jumpBuf - dt);
  // bonus clock: runs out = out of time
  bonusT += dt; if (bonusT >= 1.2) { bonusT -= 1.2; bonus = Math.max(0, bonus - 100); if (bonus === 0) { die(A, 'Out of time'); return; } }

  // ---- player ----
  const smashing = power > 0;   // holding the broccoli: no climbing or jumping (like the hammer)
  if (me.ladder) {
    const l = me.ladder, top = py(P[l.b], l.x), bot = py(P[l.a], l.x);
    me.x = l.x; me.vx = 0;
    if (keys.up) me.y -= CLIMB * dt; else if (keys.down) me.y += CLIMB * dt;
    me.walk += (keys.up || keys.down) ? dt * 10 : 0;
    me.jumpBuf = 0;   // no jumping off ladders
    if (me.y <= top) { me.y = top; me.ladder = null; me.plat = l.b; me.ground = true; me.peakY = top; }
    if (me.y >= bot) { me.y = bot; me.ladder = null; me.plat = l.a; me.ground = true; me.peakY = bot; }
  } else {
    if (me.ground) {
      me.vx = (keys.right ? WALK : 0) - (keys.left ? WALK : 0);
      if (me.vx) { me.face = Math.sign(me.vx); me.walk += dt * 12; }
      // grab a ladder: must line up with it
      const l = !smashing && nearLadder(me.x);
      if (l && ((keys.up && Math.abs(me.y - py(P[l.a], l.x)) < 4) || (keys.down && Math.abs(me.y - py(P[l.b], l.x)) < 4))) { me.ladder = l; me.ground = false; me.x = l.x; return; }
      // jump: direction is locked at takeoff, no steering in the air
      if (me.jumpBuf > 0 && !smashing) { me.jumpBuf = 0; me.vy = -JUMP_V; me.ground = false; me.airVx = me.vx; me.coyote = 0; me.peakY = me.y; A.sfx('jump'); }
    } else {
      me.vx = me.airVx;
      if (me.coyote > 0 && me.jumpBuf > 0 && !smashing) { me.jumpBuf = 0; me.vy = -JUMP_V; me.coyote = 0; me.peakY = me.y; A.sfx('jump'); }
    }
    me.coyote = Math.max(0, me.coyote - dt);
    const nx = me.x + me.vx * dt;
    if (nx < 9 || nx > W - 9) { me.x = Math.max(9, Math.min(W - 9, nx)); if (!me.ground) me.airVx = 0; } else me.x = nx;
    if (!me.ground) { me.vy += GRAV * dt; me.y += me.vy * dt; me.peakY = Math.min(me.peakY, me.y); }
    const p = P[me.plat];
    if (me.ground) {
      if (!on(p, me.x)) { me.ground = false; me.vy = 0; me.airVx = me.vx * 0.5; me.coyote = COYOTE; me.peakY = me.y; }   // walked off the edge
      else me.y = py(p, me.x);
    }
    if (!me.ground && me.vy >= 0) {
      for (let i = P.length - 1; i >= 0; i--) {
        const q = P[i]; if (!on(q, me.x)) continue;
        const gy = py(q, me.x);
        if (me.y >= gy - 1 && me.y - me.vy * dt <= gy + 2) { land(A, i, gy); if (deadT > 0) return; break; }
      }
    }
    if (me.y > H + 40) { die(A, 'Fell off'); return; }
  }
  // goal
  if (me.plat === 5 && me.ground && Math.abs(me.x - GOAL_X) < 16) { levelClear(A); return; }
  // power-up broccoli
  if (!powerUp.got && me.plat === powerUp.plat && me.ground && Math.abs(me.x - powerUp.x) < 14) {
    powerUp.got = true; power = 7; A.sfx('medal'); A.toast('🥦 Broccoli Power! Smash junk for 7 seconds — no jumping or climbing');
  }
  powerUp.t += dt;

  // ---- King Junk throws barrels ----
  throwT -= dt;
  if (throwT <= 0 && banner < 1.2) {
    king.throwAnim = 1;
    const wild = level >= 2 && Math.random() < 0.12 * (level - 1);
    barrels.push({ x: 86, y: P[5].yL - BR, vx: 0, vy: 0, plat: 5, dir: 1, kind: JUNK[Math.floor(Math.random() * JUNK.length)], rot: 0, ladder: null, scored: false, wild });
    throwT = Math.max(1.0, 2.5 - level * 0.35) + Math.random() * 1.0;
  }
  const speed = 118 + level * 20, ladderOdds = Math.min(0.55, 0.25 + level * 0.08);
  for (let i = barrels.length - 1; i >= 0; i--) {
    const b = barrels[i];
    if (b.ladder) {
      b.y += 150 * dt;
      if (b.y >= py(P[b.ladder.a], b.ladder.x) - BR) { b.plat = b.ladder.a; b.ladder = null; }
    } else if (b.plat != null) {
      const p = P[b.plat];
      b.dir = b.plat === 5 ? 1 : (p.yL > p.yR ? -1 : 1);
      b.x += b.dir * speed * dt; b.rot += b.dir * speed * dt / BR;
      if (!on(p, b.x)) { b.plat = null; b.vy = 0; b.vx = b.dir * speed * 0.5; }
      else {
        b.y = py(p, b.x) - BR;
        const l = LADDERS.find(l => l.b === b.plat && !l.broken && Math.abs(l.x - b.x) < 4);
        if (l && !b.triedL) { b.triedL = true; if (Math.random() < ladderOdds) { b.ladder = l; b.x = l.x; } }
        if (!l) b.triedL = false;
      }
      if (b.wild && b.plat != null && b.plat !== 5 && Math.random() < dt * 0.9) { b.plat = null; b.vy = -220; b.vx = (Math.random() < 0.5 ? -1 : 1) * 90; }   // wild bounce
    } else {
      b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      for (let k = P.length - 1; k >= 0; k--) { const q = P[k]; if (on(q, b.x) && b.vy > 0 && b.y + BR >= py(q, b.x) && b.y + BR <= py(q, b.x) + 16) { b.plat = k; b.y = py(q, b.x) - BR; A.sfx('point'); break; } }
    }
    if (b.y > H + 40 || b.x < -30 || b.x > W + 30 || (b.plat === 0 && b.x < 6)) { barrels.splice(i, 1); continue; }
    // collisions
    if (hitsMe(b)) {
      if (power > 0 && Math.abs(b.y - (me.y - 16)) < 30) { A.addScore(300); A.sfx('coin'); A.float('SMASH +300', b.x, b.y - 10, '#7CFFB2'); A.particles.burst(b.x, b.y, '#FFD23F', 16, 220, 4); barrels.splice(i, 1); continue; }
      if (me.inv <= 0) { die(A, 'Hit by junk food'); return; }
    }
    // cleared it: passed right under the feet while airborne
    if (!b.scored && !me.ground && !me.ladder && Math.abs(b.x - me.x) < 10 && me.y < b.y - BR && b.y - me.y < 70) { b.scored = true; A.addScore(100); A.sfx('coin'); A.float('+100', me.x, me.y - 50, '#FFD700'); }
  }
}

function draw(ctx, A) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#120a2e'); g.addColorStop(1, '#2b1660');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // city skyline
  ctx.fillStyle = '#1d1245';
  [[0, 90], [40, 140], [90, 70], [140, 160], [200, 110], [250, 180], [310, 90], [360, 150]].forEach(([x, h]) => ctx.fillRect(x, H - 40 - h, 46, h));
  ctx.fillStyle = 'rgba(255,224,102,.35)';
  for (let i = 0; i < 40; i++) ctx.fillRect((i * 53) % 400 + 6, H - 60 - (i * 37) % 150, 4, 5);
  if (!me) return;
  // ladders
  LADDERS.forEach(l => {
    const top = py(P[l.b], l.x), bot = py(P[l.a], l.x);
    ctx.strokeStyle = '#4CC4FF'; ctx.lineWidth = 3;
    const gapTop = l.broken ? top + 24 : top, gapBot = l.broken ? bot - 18 : bot;
    [-8, 8].forEach(dx => { ctx.beginPath(); ctx.moveTo(l.x + dx, top); ctx.lineTo(l.x + dx, gapTop); ctx.moveTo(l.x + dx, gapBot); ctx.lineTo(l.x + dx, bot); ctx.stroke(); });
    for (let y = top + 8; y < bot; y += 12) { if (l.broken && y > gapTop && y < gapBot) continue; ctx.beginPath(); ctx.moveTo(l.x - 8, y); ctx.lineTo(l.x + 8, y); ctx.stroke(); }
  });
  // girders
  P.forEach((p, i) => {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(p.x0, p.yL); ctx.lineTo(p.x1, p.yR); ctx.lineTo(p.x1, p.yR + 12); ctx.lineTo(p.x0, p.yL + 12); ctx.closePath();
    A.ink(i === 5 ? '#FFB300' : '#FF5C77', 2.5);
    ctx.strokeStyle = 'rgba(26,16,48,.55)'; ctx.lineWidth = 1.5;
    for (let x = p.x0 + 10; x < p.x1; x += 22) { const y = py(p, x); ctx.beginPath(); ctx.moveTo(x, y + 1); ctx.lineTo(x + 11, py(p, x + 11) + 11); ctx.lineTo(x + 22, py(p, x + 22) + 1); ctx.stroke(); }
    ctx.restore();
  });
  // goal: Golden Apple on a pedestal
  const gy = P[5].yL;
  A.rr(GOAL_X - 14, gy - 14, 28, 14, 4); A.ink('#b9b0d6', 2);
  ctx.fillStyle = 'rgba(255,215,0,.25)'; ctx.beginPath(); ctx.arc(GOAL_X, gy - 32, 22 + Math.sin(t * 4) * 3, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(GOAL_X, gy - 32 + Math.sin(t * 3) * 3); ART.draw(ctx, 'apple', 0, 0, 30, t); ctx.restore();
  ctx.fillStyle = '#FFD700'; ctx.globalCompositeOperation = 'source-atop'; ctx.globalCompositeOperation = 'source-over';
  // King Junk
  const kb = Math.sin(t * 3) * 3, ky = gy - 34 + kb;
  ctx.save(); ctx.translate(56, ky); ctx.rotate(king.throwAnim * 0.3);
  ART.draw(ctx, 'burger', 0, 0, 62, t);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-9, -12, 6, 0, 7); ctx.arc(9, -12, 6, 0, 7); ctx.fill(); ctx.strokeStyle = A.INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = A.INK; ctx.beginPath(); ctx.arc(-8, -11, 3, 0, 7); ctx.arc(10, -11, 3, 0, 7); ctx.fill();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-17, -22); ctx.lineTo(-4, -17); ctx.moveTo(17, -22); ctx.lineTo(4, -17); ctx.stroke();
  // crown
  ctx.beginPath(); ctx.moveTo(-14, -30); ctx.lineTo(-14, -40); ctx.lineTo(-7, -34); ctx.lineTo(0, -44); ctx.lineTo(7, -34); ctx.lineTo(14, -40); ctx.lineTo(14, -30); ctx.closePath(); A.ink('#FFD700', 2);
  ctx.restore();
  ctx.fillStyle = '#FF8FA3'; ctx.font = '900 11px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('KING JUNK', 56, gy + 26);
  // power-up
  if (!powerUp.got) { const x = powerUp.x, y = py(P[powerUp.plat], x) - 18 + Math.sin(powerUp.t * 4) * 3; ctx.fillStyle = 'rgba(124,255,178,.25)'; ctx.beginPath(); ctx.arc(x, y, 16, 0, 7); ctx.fill(); ART.draw(ctx, 'broccoli', x, y, 24); }
  // barrels (rolling junk food)
  barrels.forEach(b => { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ladder ? 0 : b.rot * 0.3); ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); A.ink('rgba(255,255,255,.18)', 1.5); ART.draw(ctx, b.kind, 0, 0, 24, t); ctx.restore(); });
  // player
  if (!(deadT <= 0 && me.inv > 0 && Math.floor(me.inv * 10) % 2)) {
    const bob = me.ground && me.vx ? Math.abs(Math.sin(me.walk)) * 2 : 0;
    if (me.ground && !me.ladder) { ctx.fillStyle = A.INK; const s = Math.sin(me.walk) * 5 * (me.vx ? 1 : 0); ctx.beginPath(); ctx.ellipse(me.x - 5 + s, me.y - 2, 5, 3.5, 0, 0, 7); ctx.ellipse(me.x + 5 - s, me.y - 2, 5, 3.5, 0, 0, 7); ctx.fill(); }
    ctx.save(); ctx.translate(me.x, me.y - 17 - bob); ctx.scale(me.face, 1);
    A.drawHero(0, 0, 36, deadT > 0 ? 1.4 : me.ladder ? Math.sin(me.walk) * 0.1 : 0, deadT > 0 ? 'ghost' : 'happy');
    ctx.restore();
    if (power > 0) { ctx.strokeStyle = 'rgba(124,255,178,' + (0.5 + Math.sin(t * 12) * 0.3) + ')'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(me.x, me.y - 17, 22, 0, 7); ctx.stroke(); }
  }
  // HUD
  ctx.textAlign = 'left'; ctx.font = '900 15px Nunito,sans-serif'; ctx.fillStyle = '#FF5C77';
  ctx.fillText('❤'.repeat(Math.max(0, lives)), 62, 80);
  ctx.textAlign = 'right'; ctx.fillStyle = '#b9b0d6'; ctx.fillText('Level ' + level, W - 62, 80);
  ctx.textAlign = 'center'; ctx.font = '900 14px Nunito,sans-serif'; ctx.fillStyle = bonus <= 1000 ? '#FF5C77' : '#FFD700'; ctx.fillText('BONUS ' + bonus, W / 2, 80);
  if (deadT > 0 && deathMsg) { ctx.font = '900 22px Nunito,sans-serif'; ctx.lineWidth = 5; ctx.strokeStyle = A.INK; ctx.strokeText(deathMsg + '!', W / 2, 300); ctx.fillStyle = '#FF8FA3'; ctx.fillText(deathMsg + '!', W / 2, 300); }
  if (power > 0) { ctx.textAlign = 'center'; ctx.fillStyle = '#7CFFB2'; ctx.fillText('🥦 SMASH ' + Math.ceil(power) + 's', W / 2, 100); }
  if (banner > 0 && A.state === 'play') {
    ctx.globalAlpha = Math.min(1, banner); ctx.textAlign = 'center'; ctx.font = '900 30px Cinzel,serif'; ctx.lineWidth = 6; ctx.strokeStyle = A.INK;
    const txt = level === 1 ? 'Climb to the Golden Apple!' : 'Level ' + level + '!';
    ctx.strokeText(txt, W / 2, 330); ctx.fillStyle = '#FFD700'; ctx.fillText(txt, W / 2, 330); ctx.globalAlpha = 1;
  }
}

window.__climb = () => ({ me, barrels, level, lives, P, LADDERS, GOAL_X, power, keys, bonus, deadT });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Sprite Climb', subtitle: 'Grab the Golden Apple from King Junk!', W, H, reserveH: 70,
  storageKey: 'sprite_climb', winText: 'You grabbed the Golden Apple!', deathDelay: 900,
  medals: [{ at: 3000, name: 'Bronze', icon: '🥉' }, { at: 6000, name: 'Silver', icon: '🥈' }, { at: 10000, name: 'Gold', icon: '🥇' }, { at: 15000, name: 'Legend', icon: '💎' }],
  howTo: 'Climb the girders and ladders to the <b>Golden Apple</b> before the <b>bonus</b> runs out.<br><b>Jump</b> over rolling junk food (+100) — jumps can\'t change direction mid-air. <b>Falling too far knocks you out</b>, so use the ladders! 🥦 Broccoli lets you <b>smash</b> junk, but you can\'t jump or climb while holding it.',
  controls: '← → walk · ↑ ↓ climb ladders · Space jump · P pause',
  overTitle: 'Knocked down!',
  facts: [
    'Climbing stairs burns about twice as many calories as walking on flat ground.',
    'Jumping and climbing build bone strength, especially during the teen years.',
    'Broccoli has vitamin C, vitamin K and fiber.',
    'Balance and coordination improve with practice, just like in games.',
    'Choosing whole foods over junk food most of the time keeps your energy steady.'
  ],
  reset, update, draw, input,
  pad: [{ label: '◀', type: 'left' }, { label: '▲', type: 'up' }, { label: '▼', type: 'down' }, { label: '▶', type: 'right' }, { label: 'JUMP', type: 'tap', wide: true }]
});
})();
</script>
