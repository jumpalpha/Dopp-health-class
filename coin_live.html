<!DOCTYPE html>
<html data-app-name="Coin Quest Live" lang="en">
<head>
<script src="local-guard.js"></script>
<meta charset="UTF-8">
<script src="dark_mode.js"></script>
<script src="term.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Quest Live — Dopp's Class</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="app/site-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--emerald:#00E5A0;--sky:#38BFFF;--crimson:#FF3B5C;--ink:#1A1030;--text:#F4EFFF;--dim:#b9b0d6;--card:rgba(255,255,255,.06);--border:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,#0a0618 70%) fixed;color:var(--text);font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1040px;margin:0 auto;padding:10px 16px;gap:10px}
.top a{color:var(--gold);font-weight:800;text-decoration:none;white-space:nowrap}
.top h1{font-family:Cinzel,serif;font-size:20px;color:var(--gold);text-shadow:0 2px 0 #000;text-align:center}
.wrap{max-width:1040px;margin:0 auto;padding:6px 16px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-block;font:900 18px Nunito,sans-serif;padding:14px 28px;border-radius:16px;border:3px solid var(--ink);background:var(--gold);color:#2a1d00;box-shadow:0 5px 0 var(--ink);text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--gold);border-color:rgba(255,215,0,.5);box-shadow:none}
/* start */
.intro{text-align:center;max-width:720px;margin:10px auto}
.intro .coin{font-size:72px;line-height:1;margin:6px 0;filter:drop-shadow(0 4px 0 #000)}
.intro h2{font-family:Cinzel,serif;font-size:clamp(28px,6vw,44px);color:var(--gold);text-shadow:0 3px 0 #000;margin-bottom:8px}
.intro p{color:var(--dim);font-size:17px;line-height:1.55;margin:8px 0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0;text-align:left}
.rules div{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:12px;font-size:14px;line-height:1.4}
.rules b{display:block;font-size:15px;color:var(--text);margin-bottom:2px}
.pick{margin:16px 0 6px;text-align:left}
.pick h3{font-size:16px;font-weight:900;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pick h3 span{display:flex;gap:6px}
.mini{font:800 13px Nunito,sans-serif;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,215,0,.5);background:transparent;color:var(--gold)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.chip{font:900 15px Nunito,sans-serif;padding:9px 0;border-radius:10px;border:2px solid var(--border);background:rgba(255,255,255,.05);color:var(--dim)}
.chip.on{border-color:var(--emerald);background:rgba(0,229,160,.18);color:#fff}
.chip.bonus{border-style:dashed}
.picknote{font-size:13px;color:var(--dim);margin-top:6px}
.best{margin:12px 0 16px;color:var(--emerald);font-weight:800}
/* play */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:12px}
.cash{font-family:Cinzel,serif;font-weight:900;font-size:clamp(26px,5vw,38px);color:var(--gold);text-shadow:0 2px 0 #000;position:relative;justify-self:start}
.goal .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--dim);margin-bottom:4px}
.goal .track{height:14px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.goal .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--gold));transition:width .4s}
.goal.done .fill{background:linear-gradient(90deg,var(--emerald),var(--gold))}
.clock{font-family:Cinzel,serif;font-weight:900;font-size:26px;color:var(--text);text-align:right}
.clock.low{color:var(--crimson)}
.play{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-weight:800;color:var(--dim);font-size:14px}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(56,191,255,.15);border:1px solid rgba(56,191,255,.4);color:#bfe8ff;font-size:13px}
.streak{color:var(--gold)}
.q{font-size:clamp(19px,3.4vw,25px);font-weight:900;line-height:1.3;margin:6px 0 16px}
.answers{display:grid;gap:10px}
.ans{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);font:800 17px Nunito,sans-serif;line-height:1.3;transition:transform .12s,border-color .12s,background .12s}
.ans:hover:not(:disabled){border-color:rgba(255,215,0,.6);background:rgba(255,215,0,.08);transform:translateY(-1px)}
.ans .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:14px}
.ans.right{border-color:var(--emerald);background:rgba(0,229,160,.16)}
.ans.wrong{border-color:var(--crimson);background:rgba(255,59,92,.16)}
.ans:disabled{cursor:default}
.why{margin-top:14px;padding:14px 16px;border-radius:14px;font-size:16px;line-height:1.45;background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.4)}
.why b{display:block;font-size:17px;margin-bottom:2px}
.nextrow{display:flex;justify-content:flex-end;margin-top:14px}
.pop{position:absolute;left:100%;top:4px;margin-left:10px;z-index:3;font:900 20px Nunito,sans-serif;pointer-events:none;animation:pop 1s ease-out forwards;white-space:nowrap}
.pop.plus{color:var(--emerald)}.pop.minus{color:var(--crimson)}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
/* shop */
.shop{background:linear-gradient(#2c1b55,#1a1035);border:1px solid var(--border);border-radius:18px;padding:12px;position:sticky;top:10px}
.shop h3{font-family:Cinzel,serif;color:var(--gold);font-size:16px;text-align:center;margin-bottom:8px}
.up{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:10px;margin-bottom:8px}
.up .t{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px}
.up .d{font-size:12.5px;color:var(--dim);margin:3px 0 6px;line-height:1.35}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.14)}
.pips i.on{background:var(--gold)}
.buy{width:100%;font:900 14px Nunito,sans-serif;padding:8px;border-radius:10px;border:2px solid var(--ink);background:var(--emerald);color:#03261a}
.buy:disabled{background:rgba(255,255,255,.1);color:var(--dim);border-color:transparent;cursor:default}
.buy.max{background:transparent;color:var(--gold);border-color:rgba(255,215,0,.4)}
.shopBtn{display:none}
/* results */
.res{text-align:center}
.res .big{font-family:Cinzel,serif;font-size:clamp(34px,8vw,56px);color:var(--gold);text-shadow:0 3px 0 #000;line-height:1.1}
.res .title{font-size:22px;font-weight:900;margin:6px 0 10px}
.res .title.win{color:var(--emerald)}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.stats span{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.cheer{max-width:640px;margin:6px auto 16px;color:var(--dim);font-size:16px;line-height:1.5}
.net{margin:12px auto;color:var(--dim);font-size:14px;max-width:560px}
.net a{color:var(--gold)}
.review{max-width:720px;margin:16px auto 0;text-align:left;display:grid;gap:10px}
.review h3{font-size:17px;font-weight:900;margin-top:8px}
.rv{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45}
.rv .rq{font-weight:900;margin-bottom:4px}
.rv .ra{color:var(--emerald);font-weight:800}
.rv .rx{color:var(--dim);font-size:14px;margin-top:3px}
@media (max-width:820px){
  .play{grid-template-columns:1fr}
  .shop{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:18px 18px 0 0;max-height:72vh;overflow:auto;z-index:20;transform:translateY(100%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
  .shop.open{transform:none}
  .shopBtn{display:block;grid-column:1/-1;grid-row:3;font:900 16px Nunito,sans-serif;padding:10px 16px;border-radius:12px;border:3px solid var(--ink);background:var(--gold);color:#2a1d00;box-shadow:0 4px 0 var(--ink)}
  .shopBtn .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--emerald);margin-left:8px;vertical-align:middle;box-shadow:0 0 0 3px rgba(0,229,160,.3)}
  .hud{grid-template-columns:1fr auto}
  .hud .goal{grid-column:1/-1;grid-row:2}
  .card{padding:16px}
}
</style>
<style>
.center{text-align:center;max-width:560px;margin:30px auto}
.center .emoji{font-size:64px;margin-bottom:8px}
.center .big{font-size:26px;font-weight:900;line-height:1.25}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;background:#0b0716;border:1px solid #4a3d78;font-weight:900;margin-top:12px}
.dim{color:var(--dim)}
.rank{font-weight:900;color:var(--sky);font-size:15px;text-align:right}
.teamrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.teamrow span{padding:5px 12px;border-radius:999px;border:1px solid;font-weight:900;font-size:14px;background:#0b0716}
.ans.picked{border-color:#fff}
@media(max-width:600px){#meName{display:none}.top h1{font-size:18px}}
.err{color:var(--crimson);font-weight:800;text-align:center;min-height:1.2em;margin-top:8px}
</style>
</head>
<body>
<div class="top"><a href="live.html" id="leaveTop">← Leave</a><h1>🪙 Coin Quest Live</h1><span class="dim" id="meName" style="font-weight:800"></span></div>
<div class="wrap">

  <div class="card center" id="lobbyView">
    <div class="emoji">🪙</div>
    <div class="big">You're in!</div>
    <div id="lobbyTeam"></div>
    <p class="dim" style="margin-top:12px;line-height:1.5">When your teacher starts the game, answer questions at your own pace. Right answers earn coins. Spend coins in the shop to earn faster. Most coins when time runs out wins!</p>
    <div class="pill" id="lobbyCount"></div>
  </div>

  <div class="hidden" id="playView">
    <div class="card hud">
      <div class="cash" id="cash">$0</div>
      <div class="goal" id="goal"><div class="lbl"><span id="goalL"></span><span class="rank" id="rankTxt"></span></div><div class="track"><div class="fill" id="goalFill"></div></div></div>
      <div class="clock" id="clock">-:--</div>
      <button class="shopBtn" id="shopBtn">🛒 Open the shop<span class="dot hidden" id="shopDot"></span></button>
    </div>
    <div class="play" style="margin-top:12px">
      <div class="card">
        <div class="qhead"><span id="qNum"></span><span class="tag" id="qTag"></span><span class="streak" id="streak"></span></div>
        <div class="q" id="qText"></div>
        <div class="answers" id="answers"></div>
        <div class="why hidden" id="why"></div>
        <div class="nextrow hidden" id="nextRow"><button class="btn" id="nextBtn">Got it ▶</button></div>
        <div class="err" id="playErr"></div>
      </div>
      <div class="shop" id="shop"><h3>🛒 Shop</h3><div id="ups"></div><button class="btn ghost hidden" id="closeShop" style="width:100%;margin-top:4px">Back to questions</button></div>
    </div>
  </div>

  <div class="card res hidden" id="endView">
    <div style="color:var(--dim);font-weight:800">Final coins</div>
    <div class="big" id="eCash"></div>
    <div class="title win" id="eTitle"></div>
    <div id="eTeams" class="teamrow"></div>
    <div class="stats" id="eStats"></div>
    <div class="cheer" id="eCheer"></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn" href="live.html" id="againLink">Join another game</a>
      <a class="btn ghost" href="coin_quest.html">🪙 Practice solo</a>
    </div>
  </div>
  <div class="err" id="netErr"></div>
</div>

<script src="vendor/supabase.js"></script>
<script>
(function () {
const SUPABASE_URL = 'https://gmeyamrlqfrabtslsweu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zClDCZZQEfC9DILpesPiHg_IcyRqW-c';
const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const money = n => '$' + Math.floor(n).toLocaleString();
const TEAMS = { 1:{ name:'Sky Knights', col:'#38BFFF' }, 2:{ name:'Crimson Guard', col:'#FF3B5C' }, 3:{ name:'Gold Lions', col:'#FFD700' }, 4:{ name:'Emerald Rangers', col:'#00E5A0' } };
// same values as the server (supabase/coin_live.sql) — used for display only; the server decides
const UPS = [
  { key: 'mpq', icon: '💰', name: 'Coins per Answer', desc: v => 'Earn ' + money(v) + ' for each right answer.', vals: [10, 25, 60, 150, 400, 1000, 2500], cost: [0, 50, 200, 700, 2500, 8000, 25000] },
  { key: 'mult', icon: '✨', name: 'Multiplier', desc: v => 'Every right answer pays ×' + v + '.', vals: [1, 1.5, 2, 3, 4], cost: [0, 100, 500, 2500, 10000] },
  { key: 'streak', icon: '🔥', name: 'Streak Bonus', desc: v => v ? '+' + money(v) + ' for each answer in your streak (up to 10).' : 'No bonus yet for answering right in a row.', vals: [0, 5, 15, 40, 100, 250], cost: [0, 40, 180, 700, 2500, 8000] },
  { key: 'ins', icon: '🛡️', name: 'Insurance', desc: v => v ? 'Wrong answers cost ' + Math.round(v * 100) + '% less.' : 'A wrong answer costs half of your Coins per Answer.', vals: [0, .25, .5, .75, 1], cost: [0, 60, 300, 1500, 6000] }
];

let P = null; try { P = JSON.parse(localStorage.getItem('live_player') || 'null'); } catch (e) {}
if (!P || !P.pid || !db) { location.replace('live.html'); return; }

let me = null, shownIdx = null, waiting = false, busy = false, deadline = 0, pollT = null, tickT = null, done = false;
async function rpc(name, args) { const { data, error } = await db.rpc(name, args); if (error) throw new Error(error.message); return data; }
const pa = () => ({ p_player_id: P.pid, p_player_token: P.tok });

function teamPill(t) { return t && TEAMS[t] ? '<div class="pill" style="border-color:' + TEAMS[t].col + ';color:' + TEAMS[t].col + '">⚔️ ' + TEAMS[t].name + '</div>' : ''; }
function teamRow(teams, mine) {
  if (!teams) return '';
  return Object.keys(teams).sort((a, b) => teams[b] - teams[a]).map(k => TEAMS[k] ?
    '<span style="border-color:' + TEAMS[k].col + ';color:' + TEAMS[k].col + '">' + (+k === mine ? '★ ' : '') + TEAMS[k].name + ' ' + money(teams[k]) + '</span>' : '').join('');
}
function show(id) { ['lobbyView', 'playView', 'endView'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }

function apply(v) {
  me = v;
  $('meName').textContent = v.nickname + (v.team && TEAMS[v.team] ? ' · ' + TEAMS[v.team].name : '');
  if (v.seconds_left != null) deadline = Date.now() + v.seconds_left * 1000;
  if (v.phase === 'ended' || (v.phase === 'question' && !v.running)) return finish();
  if (v.phase === 'lobby') {
    show('lobbyView');
    $('lobbyTeam').innerHTML = teamPill(v.team);
    $('lobbyCount').textContent = v.players + ' player' + (v.players === 1 ? '' : 's') + ' in the game';
    return;
  }
  show('playView');
  hud();
  if (!waiting && v.question && v.question.idx !== shownIdx) drawQ(v.question);
}
function hud() {
  const v = me; if (!v) return;
  $('cash').firstChild ? ($('cash').firstChild.nodeValue = money(v.cash)) : ($('cash').textContent = money(v.cash));
  $('rankTxt').textContent = '#' + v.rank + ' of ' + v.players;
  if (v.team && v.teams) {
    const tot = Object.values(v.teams).reduce((s, x) => s + +x, 0) || 1, mine = +(v.teams[v.team] || 0);
    $('goalL').innerHTML = '<span style="color:' + TEAMS[v.team].col + '">' + TEAMS[v.team].name + '</span> ' + money(mine);
    $('goalFill').style.width = Math.round(mine / tot * 100) + '%';
    $('goalFill').style.background = TEAMS[v.team].col;
  } else {
    $('goalL').textContent = 'Answered ' + v.answered + ' · ' + v.correct + ' right';
    $('goalFill').style.width = (v.players > 1 ? Math.round((v.players - v.rank) / (v.players - 1) * 100) : 100) + '%';
  }
  $('streak').textContent = v.streak >= 2 ? '🔥 ' + v.streak + ' in a row' : '';
  drawShop();
}
function clock() {
  const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  $('clock').textContent = deadline ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : '-:--';
  $('clock').classList.toggle('low', deadline && left <= 30);
  if (deadline && left <= 0 && me && me.phase === 'question' && !done) setTimeout(poll, 2500);
}
function pop(txt, cls) { const s = document.createElement('span'); s.className = 'pop ' + cls; s.textContent = txt; $('cash').appendChild(s); setTimeout(() => s.remove(), 1000); }

function drawQ(q) {
  shownIdx = q.idx;
  $('qNum').textContent = 'Question ' + (me.answered + 1);
  $('qTag').textContent = q.ch ? 'Chapter ' + q.ch : '';
  $('qText').textContent = q.prompt;
  const opts = shuffle((q.choices || []).slice());
  $('answers').innerHTML = opts.map((o, i) => '<button class="ans"><span class="k">' + (i + 1) + '</span><span></span></button>').join('');
  $('answers').querySelectorAll('.ans').forEach((b, i) => { b.dataset.a = opts[i]; b.lastChild.textContent = opts[i]; b.onclick = () => answer(b); });
  $('why').classList.add('hidden'); $('nextRow').classList.add('hidden'); $('playErr').textContent = '';
}
async function answer(b) {
  if (busy || waiting) return;
  const btns = $('answers').querySelectorAll('.ans'); if (btns[0].disabled) return;
  busy = true; btns.forEach(x => x.disabled = true); b.classList.add('picked');
  try {
    const r = await rpc('coin_answer', Object.assign(pa(), { p_idx: shownIdx, p_answer: b.dataset.a }));
    if (r.stale) { busy = false; shownIdx = null; return apply(r.me); }
    btns.forEach(x => { if (x.dataset.a === r.answer) x.classList.add('right'); });
    if (r.correct) {
      if (r.delta) pop('+' + money(r.delta), 'plus');
      me = r.me; hud();
      setTimeout(() => { busy = false; apply(me); }, 600);
    } else {
      b.classList.add('wrong');
      if (r.delta) pop('−' + money(-r.delta), 'minus');
      me = r.me; hud();
      $('why').innerHTML = '<b>The answer: ' + esc(r.answer) + '</b>' + esc(r.why || '');
      $('why').classList.remove('hidden'); $('nextRow').classList.remove('hidden');
      waiting = true; busy = false; $('nextBtn').disabled = true;
      setTimeout(() => { $('nextBtn').disabled = false; }, 1500);
    }
  } catch (e) {
    busy = false; btns.forEach(x => x.disabled = false);
    if (/Too fast/.test(e.message)) { setTimeout(() => answer(b), 700); return; }
    if (/Time is up/.test(e.message)) return poll();
    $('playErr').textContent = 'Did not send. Tap again.';
  }
}
$('nextBtn').onclick = () => { if ($('nextBtn').disabled) return; waiting = false; shownIdx = null; apply(me); };

function drawShop() {
  const lv = me.lv || {};
  $('ups').innerHTML = UPS.map(u => {
    const l = lv[u.key] || 0, maxed = l + 1 >= u.vals.length, c = maxed ? 0 : u.cost[l + 1];
    return '<div class="up"><div class="t"><span>' + u.icon + ' ' + u.name + '</span><span class="pips">' +
      u.vals.map((_, i) => '<i class="' + (i <= l ? 'on' : '') + '"></i>').join('') + '</span></div>' +
      '<div class="d">' + u.desc(u.vals[l]) + (maxed ? '' : '<br>Next: ' + u.desc(u.vals[l + 1]).replace(/\.$/, '') + '.') + '</div>' +
      (maxed ? '<button class="buy max" disabled>MAXED</button>' : '<button class="buy" data-k="' + u.key + '"' + (c > me.cash ? ' disabled' : '') + '>Buy for ' + money(c) + '</button>') + '</div>';
  }).join('');
  $('ups').querySelectorAll('.buy[data-k]').forEach(b => b.onclick = () => buy(b.dataset.k, b));
  $('shopDot').classList.toggle('hidden', !UPS.some(u => { const l = lv[u.key] || 0; return l + 1 < u.vals.length && u.cost[l + 1] <= me.cash; }));
}
async function buy(k, b) {
  b.disabled = true;
  try { const u = UPS.find(x => x.key === k), c = u.cost[(me.lv[k] || 0) + 1]; me = await rpc('coin_buy', Object.assign(pa(), { p_kind: k })); pop('−' + money(c), 'minus'); hud(); }
  catch (e) { $('playErr').textContent = /Not enough/.test(e.message) ? 'Not enough coins yet.' : /maxed/.test(e.message) ? '' : 'Could not buy. Try again.'; drawShop(); }
}
$('shopBtn').onclick = () => { $('shop').classList.add('open'); $('closeShop').classList.remove('hidden'); };
$('closeShop').onclick = () => $('shop').classList.remove('open');

function finish() {
  if (done) return; done = true;
  clearInterval(pollT); clearInterval(tickT);
  $('shop').classList.remove('open');
  show('endView');
  const v = me, pct = v.answered ? Math.round(v.correct / v.answered * 100) : 0;
  $('eCash').textContent = money(v.cash);
  $('eTitle').textContent = v.rank === 1 ? '🏆 1st place!' : '#' + v.rank + ' of ' + v.players;
  $('eTeams').innerHTML = v.team ? teamRow(v.teams, v.team) : '';
  $('eStats').innerHTML = '<span>✅ ' + v.correct + ' / ' + v.answered + ' right (' + pct + '%)</span><span>💰 ' + money(v.earned) + ' earned</span>' +
    (v.signed_in && v.correct ? '<span style="color:var(--emerald)">⭐ +' + Math.min(15, v.correct) * 5 + ' Verified XP</span>' : '');
  $('eCheer').textContent = v.signed_in ? 'Check the big screen for the final leaderboard.' : 'Join with your Quest login next time to earn XP.';
  try { localStorage.removeItem('live_player'); } catch (e) {}
}

async function poll() {
  if (done || busy) return;
  try { const v = await rpc('coin_me', pa()); $('netErr').textContent = ''; apply(v); }
  catch (e) {
    if (/Not in this game|Not a Coin Quest/.test(e.message)) { try { localStorage.removeItem('live_player'); } catch (x) {} location.replace('live.html'); return; }
    $('netErr').textContent = 'Connection trouble… retrying';
  }
}
$('leaveTop').onclick = () => { try { localStorage.removeItem('live_player'); } catch (e) {} };
document.addEventListener('keydown', e => {
  if ($('playView').classList.contains('hidden')) return;
  const btns = $('answers').querySelectorAll('.ans');
  if (/^[1-4]$/.test(e.key) && btns[0] && !btns[0].disabled) { const b = btns[+e.key - 1]; if (b) answer(b); }
  else if ((e.key === 'Enter' || e.key === ' ') && waiting && !$('nextBtn').disabled) { e.preventDefault(); $('nextBtn').click(); }
});
poll(); pollT = setInterval(poll, 2500); tickT = setInterval(clock, 250);
})();
</script>
</body>
