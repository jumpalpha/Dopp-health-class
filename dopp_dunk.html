<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Sprite Hoops</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const W = 420, H = 640, FLOOR = 596, BR = 16, G = 900, SHOTS = 10, NEED = 7;
const HOME = { x: 104, y: 528 };
const HABITS = [
  { name: 'All-Nighter', tip: 'Sleep is when your brain saves what you learned. Skipping it makes recall harder tomorrow.' },
  { name: 'Energy Drink #3', tip: 'Doctors advise teens to keep caffeine to about 100 mg a day or less. One big energy drink can be double that.' },
  { name: 'Doomscrolling', tip: 'Screen light late at night delays melatonin, the hormone that makes you sleepy.' },
  { name: 'Skipping Breakfast', tip: 'Your brain runs on glucose. Breakfast helps focus and mood in morning classes.' },
  { name: 'Zero Water', tip: 'Even mild dehydration can cause headaches and make it harder to focus.' },
  { name: 'Phone in Bed', tip: 'Keeping the phone out of the bedroom is one of the easiest ways to sleep better.' },
  { name: 'Stress Snacking', tip: 'Stress hormones can trigger cravings for sugar and fat. A walk or deep breaths can help instead.' },
  { name: 'No Sunscreen', tip: 'Sun damage adds up over a lifetime. Sunscreen helps prevent skin cancer.' },
  { name: 'Ghosting Friends', tip: 'Strong friendships are linked to better mood and less stress. Reach out!' },
  { name: 'Vaping', tip: 'Most vapes contain nicotine, which is highly addictive and harms the developing teen brain.' },
  { name: 'No Sleep Schedule', tip: 'Going to bed and waking at the same times helps your body clock and your energy.' },
  { name: 'Zero Veggies', tip: 'Vegetables give you fiber and vitamins your gut and immune system need.' },
  { name: 'Skipping Lunch', tip: 'An empty tank by afternoon makes it harder to focus and easier to get cranky.' },
  { name: '6 Hours of Sleep', tip: 'Teens need about 8–10 hours of sleep a night to feel and perform their best.' },
  { name: 'Bottling It Up', tip: 'Talking about feelings with someone you trust helps you handle stress.' },
  { name: 'All-Day Sitting', tip: 'Teens need about 60 minutes of movement a day. Even short walks count.' }
];
const results = [];   // each shot's result, for the dots
let shot, made, streak, pool, ball, phase, bin, drag, aim, ptrTap, endT, touched, t, msg, msgT, trail;

function newBin(i) {
  const hard = i >= 7, med = i >= 3;
  return { x0: 250 + Math.random() * 90, y: 300 + Math.random() * 150, amp: hard ? 70 : med ? 40 : 0, spd: hard ? 1.6 : 1.1, ph: Math.random() * 6, x: 0, half: 36 };
}
function reset() {
  results.length = 0; shot = 0; made = 0; streak = 0; t = 0; msg = ''; msgT = 0; trail = [];
  pool = HABITS.slice().sort(() => Math.random() - 0.5).slice(0, SHOTS);
  aim = { a: -0.95, p: 640 }; drag = null; ptrTap = false;
  nextShot(true);
}
function nextShot(first) {
  if (!first) shot++;
  ball = { x: HOME.x, y: HOME.y, vx: 0, vy: 0 }; phase = 'aim'; touched = false; endT = 0; trail = [];
  bin = newBin(shot); bin.x = bin.x0;
}
function launch(vx, vy, A) {
  const sp = Math.hypot(vx, vy), k = sp > 980 ? 980 / sp : 1;
  ball.vx = vx * k; ball.vy = vy * k; phase = 'fly'; endT = 0; A.sfx('swipe');
}
function input(type, A) {
  if (phase !== 'aim') return;
  if (type === 'tap') { if (ptrTap) { ptrTap = false; return; } launch(Math.cos(aim.a) * aim.p, Math.sin(aim.a) * aim.p, A); return; }
  if (type === 'left') aim.a = Math.max(-1.45, aim.a - 0.06);
  if (type === 'right') aim.a = Math.min(-0.15, aim.a + 0.06);
  if (type === 'up') aim.p = Math.min(980, aim.p + 25);
  if (type === 'down') aim.p = Math.max(300, aim.p - 25);
  if (['left', 'right', 'up', 'down'].includes(type)) drag = null;
}
// pull back anywhere and let go — like a slingshot
function pointer(type, x, y, A) {
  if (type === 'down') { ptrTap = true; if (phase === 'aim') drag = { sx: x, sy: y, x, y }; }
  else if (type === 'drag' && drag) { drag.x = x; drag.y = y; }
  else if (type === 'up' && drag) {
    const dx = drag.sx - drag.x, dy = drag.sy - drag.y; drag = null;
    if (Math.hypot(dx, dy) > 18 && phase === 'aim') launch(dx * 4.4, dy * 4.4, A);
  }
}
function curVel() {
  if (drag) return { vx: (drag.sx - drag.x) * 4.4, vy: (drag.sy - drag.y) * 4.4 };
  return { vx: Math.cos(aim.a) * aim.p, vy: Math.sin(aim.a) * aim.p };
}
// collision helpers
function hitPoint(px, py, pr, bounce, A) {
  const dx = ball.x - px, dy = ball.y - py, d = Math.hypot(dx, dy), m = BR + pr;
  if (d >= m || d === 0) return false;
  const nx = dx / d, ny = dy / d; ball.x = px + nx * m; ball.y = py + ny * m;
  const vn = ball.vx * nx + ball.vy * ny; if (vn < 0) { ball.vx -= (1 + bounce) * vn * nx; ball.vy -= (1 + bounce) * vn * ny; if (Math.abs(vn) > 120) A.sfx('pop'); }
  touched = true; return true;
}
function hitSeg(x1, y1, x2, y2, A) {
  const lx = x2 - x1, ly = y2 - y1, L2 = lx * lx + ly * ly;
  const u = Math.max(0, Math.min(1, ((ball.x - x1) * lx + (ball.y - y1) * ly) / L2));
  return hitPoint(x1 + lx * u, y1 + ly * u, 3, 0.45, A);
}
function binWalls() {
  const b = bin, top = b.y, bot = b.y + 92;
  return [[b.x - b.half, top, b.x - b.half + 6, bot], [b.x + b.half, top, b.x + b.half - 6, bot]];
}
function finish(A, dunk) {
  phase = 'done'; endT = 0; results[shot] = dunk;
  const h = pool[shot];
  if (dunk) {
    made++; streak++;
    const swish = !touched, pts = 100 + (swish ? 50 : 0) + 25 * (streak - 1);
    A.addScore(pts); A.sfx('coin'); A.particles.burst(bin.x, bin.y, '#7CFFB2', 22, 220, 4);
    A.float((swish ? 'Swish! ' : 'Dunk! ') + '+' + pts, bin.x, bin.y - 30, swish ? '#FFD700' : '#7CFFB2');
    msg = '🗑 Trashed: ' + h.name + ' — ' + h.tip; msgT = 3.2;
    if (made === NEED) A.win('You trashed ' + NEED + ' bad habits!');
  } else {
    streak = 0; A.sfx('hit'); A.float('Miss!', ball.x < 0 ? 40 : ball.x > W ? W - 40 : ball.x, Math.min(FLOOR - 30, Math.max(200, ball.y)), '#FF8FA3');
    msg = '😬 ' + h.name + ' got away. ' + h.tip; msgT = 3.2;
  }
}
function update(dt, A) {
  if (!ball) return;
  t += dt; msgT = Math.max(0, msgT - dt);
  if (bin.amp) bin.x = bin.x0 + Math.sin(t * bin.spd + bin.ph) * bin.amp;
  bin.x = Math.max(bin.half + 12, Math.min(W - bin.half - 12, bin.x));
  if (A.state !== 'play') return;
  if (phase === 'fly') {
    const steps = 4, h = dt / steps;
    for (let s = 0; s < steps && phase === 'fly'; s++) {
      ball.vy += G * h; ball.x += ball.vx * h; ball.y += ball.vy * h;
      const b = bin;
      // rim posts + can walls
      hitPoint(b.x - b.half, b.y, 5, 0.55, A); hitPoint(b.x + b.half, b.y, 5, 0.55, A);
      binWalls().forEach(w => hitSeg(...w, A));
      // inside the can and falling = dunk
      if (Math.abs(ball.x - b.x) < b.half - 8 && ball.y > b.y + 14 && ball.y < b.y + 92 && ball.vy > 0) { finish(A, true); break; }
      // shelf under the can
      if (ball.y + BR > b.y + 98 && ball.y < b.y + 112 && Math.abs(ball.x - b.x) < b.half + 22 && ball.vy > 0) { ball.y = b.y + 98 - BR; ball.vy *= -0.45; ball.vx *= 0.8; touched = true; }
      if (ball.y + BR > FLOOR) { ball.y = FLOOR - BR; ball.vy *= -0.5; ball.vx *= 0.75; }
      if (ball.x - BR < 0 && ball.vx < 0) { ball.x = BR; ball.vx *= -0.6; touched = true; }
    }
    if (phase === 'fly') {
      trail.push({ x: ball.x, y: ball.y }); if (trail.length > 14) trail.shift();
      endT += dt;
      const resting = ball.y > FLOOR - BR - 2 && Math.abs(ball.vy) < 60 && Math.abs(ball.vx) < 40;
      if (ball.x > W + 40 || endT > 4.5 || resting) finish(A, false);
    }
  } else if (phase === 'done') {
    endT += dt;
    if (endT > 1.1) { if (shot + 1 >= SHOTS) { phase = 'over'; A.gameOver(true); } else nextShot(); }
  }
}

function drawBall(ctx, A, x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); A.ink('#FF6B3D', 3);
  ctx.strokeStyle = A.INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
  ctx.beginPath(); ctx.arc(x - r * 1.3, y, r * 0.9, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(x + r * 1.3, y, r * 0.9, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
}
function tag(ctx, A, text, x, y, col) {
  ctx.font = '900 13px Nunito,sans-serif'; const w = ctx.measureText(text).width + 16;
  const bx = Math.max(6, Math.min(W - w - 6, x - w / 2));
  A.rr(bx, y - 12, w, 24, 10); A.ink(col || '#fff', 2.5); ctx.fillStyle = A.INK; ctx.textAlign = 'center'; ctx.fillText(text, bx + w / 2, y + 5);
}
function wrap(ctx, text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  words.forEach(w => { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; });
  if (line) lines.push(line); return lines;
}
function draw(ctx, A) {
  // gym at dusk
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2b1c55'); g.addColorStop(1, '#4a2f7a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.05)'; for (let x = 0; x < W; x += 60) ctx.fillRect(x, 0, 30, FLOOR);
  ctx.fillStyle = '#c98b4e'; ctx.fillRect(0, FLOOR, W, H - FLOOR); ctx.fillStyle = '#b07640'; for (let x = 0; x < W; x += 42) ctx.fillRect(x, FLOOR, 2, H - FLOOR);
  ctx.fillStyle = '#FFD700'; ctx.fillRect(0, FLOOR, W, 4);
  if (!ball) return;
  // shot dots
  for (let i = 0; i < SHOTS; i++) {
    const x = W / 2 - (SHOTS - 1) * 13 + i * 26, y = 94;
    ctx.beginPath(); ctx.arc(x, y, 8, 0, 7);
    A.ink(results[i] === true ? '#00E5A0' : results[i] === false ? '#FF3B5C' : i === shot ? '#FFD700' : '#5b4a8a', 2.5);
  }
  ctx.font = '900 14px Nunito,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText('Dunked ' + made + ' / ' + NEED + ' to win', W / 2, 124);
  // can + shelf
  const b = bin;
  ctx.fillStyle = '#7a5230'; A.rr(b.x - b.half - 22, b.y + 98, (b.half + 22) * 2, 12, 4); A.ink('#8a5a2b', 2.5);
  if (b.y + 110 < FLOOR) { ctx.fillStyle = '#5a3a20'; ctx.fillRect(b.x - 3, b.y + 110, 6, FLOOR - b.y - 110); }
  ctx.beginPath(); ctx.moveTo(b.x - b.half, b.y); ctx.lineTo(b.x + b.half, b.y); ctx.lineTo(b.x + b.half - 6, b.y + 98); ctx.lineTo(b.x - b.half + 6, b.y + 98); ctx.closePath(); A.ink('#3a9c6a', 3);
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 3; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(b.x + i * 14, b.y + 14); ctx.lineTo(b.x + i * 12, b.y + 88); ctx.stroke(); }
  A.rr(b.x - b.half - 6, b.y - 6, (b.half + 6) * 2, 10, 5); A.ink('#2c7a52', 3);
  if (b.amp) { ctx.fillStyle = '#FFD700'; ctx.font = '900 12px Nunito,sans-serif'; ctx.fillText('◀ moving ▶', b.x, b.y + 128 > FLOOR - 8 ? b.y - 16 : b.y + 128); }
  // aim preview (first part of the arc only)
  if (phase === 'aim' && A.state === 'play') {
    const v = curVel(), sp = Math.hypot(v.vx, v.vy), k = sp > 980 ? 980 / sp : 1;
    if (drag ? Math.hypot(drag.sx - drag.x, drag.sy - drag.y) > 18 : true) {
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (let i = 1; i <= 9; i++) { const tt = i * 0.045; ctx.beginPath(); ctx.arc(ball.x + v.vx * k * tt, ball.y + v.vy * k * tt + 0.5 * G * tt * tt, 4 - i * 0.25, 0, 7); ctx.fill(); }
    }
    if (drag) { ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(drag.sx, drag.sy); ctx.lineTo(drag.x, drag.y); ctx.stroke(); ctx.setLineDash([]); }
  }
  // sprite
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(70, FLOOR - 2, 30, 6, 0, 0, 7); ctx.fill();
  A.drawHero(70, FLOOR - 40, 100, 0, phase === 'done' ? (results[shot] ? 'happy' : 'tired') : 'happy');
  // trail + ball
  trail.forEach((p, i) => { ctx.fillStyle = 'rgba(255,140,90,' + (i / trail.length * 0.35) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, BR * i / trail.length, 0, 7); ctx.fill(); });
  if (!((phase === 'done' || phase === 'over') && results[shot])) drawBall(ctx, A, ball.x, ball.y, BR);
  if (phase === 'aim' || phase === 'fly') tag(ctx, A, pool[shot].name, Math.min(W - 60, Math.max(60, ball.x)), Math.max(150, ball.y - 34), '#FFB3C1');
  // message
  if (msgT > 0) {
    ctx.font = '800 14px Nunito,sans-serif'; const lines = wrap(ctx, msg, W - 60), hh = lines.length * 19 + 16;
    ctx.globalAlpha = Math.min(1, msgT * 2); A.rr(16, 146, W - 32, hh, 12); A.ink('rgba(20,12,44,.92)', 2.5);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; lines.forEach((l, i) => ctx.fillText(l, 30, 168 + i * 19)); ctx.globalAlpha = 1;
  }
}

window.__hoops = () => ({ t, ball, bin, phase, shot, made, G, BR, launch: (vx, vy) => launch(vx, vy, window.game || { sfx() {} }) });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Sprite Hoops', subtitle: 'Trash those bad habits!', W, H, reserveH: 70,
  storageKey: 'sprite_hoops', winText: 'You trashed 7 bad habits!', deathDelay: 600, overTitle: 'Season Over!',
  medals: [{ at: 300, name: 'Bronze', icon: '🥉' }, { at: 700, name: 'Silver', icon: '🥈' }, { at: 1100, name: 'Gold', icon: '🥇' }, { at: 1600, name: 'Legend', icon: '💎' }],
  howTo: '<b>Pull back</b> anywhere and let go to shoot each bad habit into the trash can. No rim = <b>Swish +50</b>. Dunks in a row earn a streak bonus.<br>10 shots — <b>dunk 7</b> to win. The can starts moving later!',
  controls: 'Drag back & release · or ← → aim, ↑ ↓ power, Space shoot · P pause',
  facts: [
    'Swapping one bad habit for a better one works better than just trying to stop.',
    'Habits are easier to change when you change your surroundings, like charging your phone outside your room.',
    'It takes many weeks of repeating a new habit before it feels automatic.',
    'Teens need about 8–10 hours of sleep each night.',
    'Small, specific goals ("drink a water bottle at lunch") stick better than big vague ones.'
  ],
  reset, update, draw, input, pointer
});
})();
</script>
