<title>Habit Breaker — Dopp's Arcade</title>
<meta name="description" content="Bounce the energy orb and smash a wall of bad habits with your Wellness Sprite.">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2305070F%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2746%27%20font-size%3D%2736%27%20text-anchor%3D%27middle%27%20fill%3D%27%23FFD700%27%3E%26%239876%3B%3C%2Ftext%3E%3C%2Fsvg%3E">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,#0a0618 70%) fixed;color:#f4efff;font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto;padding:10px 16px}
.top a{color:#FFD700;font-weight:800;text-decoration:none}
.top h1{font-family:Cinzel,serif;font-size:20px;color:#FFD700;text-shadow:0 2px 0 #000}
#game{padding:0 8px 16px}
</style>
<!-- PWA --><link rel="manifest" href="app/habit_breaker.webmanifest"><link rel="apple-touch-icon" href="app/habit_breaker-180.png"><meta name="apple-mobile-web-app-title" content="Habit Break"><meta name="theme-color" content="#140c2e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><script src="pwa.js" defer></script><!-- /PWA -->

<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Habit Breaker</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const W = 420, H = 640, PY = 586, BR = 8;          // paddle y, ball radius
const COLS = 8, BW = 48, BH = 26, GAP = 3, TOP = 96, LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
const ROWS_STYLE = [
  { food: 'soda', color: '#FF5C77', habit: 'Too much soda' },
  { food: 'candy', color: '#FF7AB6', habit: 'Candy binge' },
  { food: 'fries', color: '#FF9F43', habit: 'Fried food' },
  { food: 'donut', color: '#8FE07A', habit: 'Sugary breakfast' },
  { food: 'cookie', color: '#B57CFF', habit: 'Late-night snacks' },
  { food: 'burger', color: '#4CC4FF', habit: 'Fast food' }
];
const TIPS = ['Swapping soda for water cuts a lot of added sugar.', 'Teens need 8 to 10 hours of sleep a night.', 'A protein-rich breakfast helps you focus.',
  'Baked or grilled beats fried for heart health.', 'Screens off an hour before bed helps you sleep better.', 'Moving 60 minutes a day keeps your heart strong.'];
const POWERS = { wide: { art: 'broccoli', name: 'Broccoli Power: wide paddle!' }, multi: { art: 'water', name: 'Hydration splash: 3 balls!' }, slow: { art: 'banana', name: 'Banana calm: slower ball!' }, life: { art: 'heart', name: 'Extra life!' } };

let paddle, balls, bricks, drops, lives, level, keys, launchHint, slowT, wideT, aimX, bricksLeft, newLevel;

function buildLevel(n) {
  bricks = [];
  const rows = Math.min(6, 4 + n);
  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
    // level 2+: carve a pattern so layouts differ
    if (n % 3 === 2 && (r + c) % 4 === 0 && r > 0) continue;
    if (n % 3 === 0 && n > 0 && Math.abs(c - 3.5) < 1 && r < 2) continue;
    const st = ROWS_STYLE[r % ROWS_STYLE.length];
    const tough = n >= 2 && r < 2;
    bricks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), w: BW, h: BH, hp: tough ? 2 : 1, max: tough ? 2 : 1,
      gold: Math.random() < 0.12, food: st.food, color: st.color, habit: st.habit, hit: 0 });
  }
  bricksLeft = bricks.length;
}
function newBall(stuck) { return { x: paddle.x, y: PY - 14 - BR, vx: 0, vy: 0, stuck, trail: [] }; }
function speed() { return Math.min(560, 340 + level * 30 + (A_time() * 2)) * (slowT > 0 ? 0.7 : 1); }
let A_ref = null; const A_time = () => (A_ref ? Math.min(60, A_ref.time) : 0);

function reset(A) {
  A_ref = A;
  paddle = { x: W / 2, w: 86, t: 0 }; level = 1; lives = 3; keys = { l: false, r: false };
  drops = []; slowT = 0; wideT = 0; aimX = null; launchHint = 1;
  buildLevel(level); balls = [newBall(true)];
}
function launch(A) {
  balls.forEach(b => { if (b.stuck) { b.stuck = false; const a = -Math.PI / 2 + (Math.random() - 0.5) * 0.6; b.vx = Math.cos(a) * speed(); b.vy = Math.sin(a) * speed(); A.sfx('jump'); } });
  launchHint = 0;
}
function input(type, A) {
  if (type === 'left') keys.l = true; else if (type === 'release-left') keys.l = false;
  else if (type === 'right') keys.r = true; else if (type === 'release-right') keys.r = false;
  else if (type === 'tap' || type === 'up') launch(A);
}
function pointer(type, x, y, A) {
  aimX = x;
  if (type === 'up') launch(A);
}

function hitBrick(b, br, A) {
  br.hp--; br.hit = 0.15;
  if (br.hp > 0) { A.sfx('point'); return; }
  const cx = br.x + br.w / 2, cy = br.y + br.h / 2;
  A.addScore(br.gold ? 50 : 10 * level); A.sfx('coin');
  A.particles.burst(cx, cy, br.color, 12, 200, 4);
  if (Math.random() < 0.18) A.float(br.habit + ' busted!', cx, cy, '#fff');
  if (br.gold) {
    const keysP = Object.keys(POWERS); let k = keysP[Math.floor(Math.random() * keysP.length)];
    if (k === 'life' && lives >= 5) k = 'wide';
    drops.push({ x: cx, y: cy, k, t: 0 });
    A.toast('💡 ' + TIPS[Math.floor(Math.random() * TIPS.length)], 2200);
  }
  bricksLeft = bricks.filter(x => x.hp > 0).length;
  if (bricksLeft <= 0) levelClear(A);
}
function levelClear(A) {
  A.addScore(100 * level); A.sfx('win');
  A.float('Level ' + level + ' clear! +' + 100 * level, W / 2, 320, '#FFD700');
  if (level === 2) A.win('You broke two walls of bad habits!');
  level++; buildLevel(level); drops = []; newLevel = true;
  balls = [newBall(true)]; launchHint = 1;
}
function lose(A) {
  lives--;
  A.sfx('hit'); A.shake(8, 0.25);
  if (lives <= 0) { A.gameOver(); return; }
  A.toast('💔 ' + lives + (lives === 1 ? ' life' : ' lives') + ' left');
  balls = [newBall(true)]; launchHint = 1; wideT = 0;
}

function update(dt, A) {
  if (!paddle) return;
  paddle.t += dt;
  if (A.state !== 'play') { if (A.state === 'menu') paddle.x = W / 2 + Math.sin(paddle.t) * 80; balls.forEach(b => { if (b.stuck) b.x = paddle.x; }); return; }
  slowT = Math.max(0, slowT - dt); wideT = Math.max(0, wideT - dt);
  bricksLeft = bricks.filter(x => x.hp > 0).length;
  const tw = wideT > 0 ? 130 : 86; paddle.w += (tw - paddle.w) * Math.min(1, dt * 8);
  // paddle: pointer follows finger/mouse, keys slide
  if (keys.l) { paddle.x -= 480 * dt; aimX = null; }
  if (keys.r) { paddle.x += 480 * dt; aimX = null; }
  if (aimX != null) paddle.x += (aimX - paddle.x) * Math.min(1, dt * 18);
  paddle.x = Math.max(paddle.w / 2 + 4, Math.min(W - paddle.w / 2 - 4, paddle.x));

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (b.stuck) { b.x = paddle.x; b.y = PY - 14 - BR; continue; }
    // keep speed in line with level/power-ups
    // last few blocks glow and gently pull the orb toward them, so the end of a level never drags
    if (bricksLeft <= 3 && b.vy < 0) {
      let tgt = null, bd = 1e9; bricks.forEach(br => { if (br.hp > 0) { const d = Math.abs(br.x + br.w / 2 - b.x); if (d < bd) { bd = d; tgt = br; } } });
      if (tgt) b.vx += Math.sign(tgt.x + tgt.w / 2 - b.x) * 260 * dt;
    }
    const sp = speed(), cur = Math.hypot(b.vx, b.vy) || 1; b.vx *= sp / cur; b.vy *= sp / cur;
    if (Math.abs(b.vy) < sp * 0.3) { b.vy = Math.sign(b.vy || -1) * sp * 0.3; b.vx = Math.sign(b.vx) * Math.sqrt(sp * sp - b.vy * b.vy); }
    const steps = Math.ceil(sp * dt / 4);
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
      if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); }
      if (b.x > W - BR) { b.x = W - BR; b.vx = -Math.abs(b.vx); }
      if (b.y < 64 + BR) { b.y = 64 + BR; b.vy = Math.abs(b.vy); }
      // paddle
      if (b.vy > 0 && b.y + BR >= PY - 8 && b.y < PY + 6 && Math.abs(b.x - paddle.x) < paddle.w / 2 + BR) {
        const off = (b.x - paddle.x) / (paddle.w / 2);
        const a = -Math.PI / 2 + off * 1.05;
        b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.y = PY - 8 - BR;
        A.sfx('flap'); paddle.bump = 1;
      }
      // bricks
      for (const br of bricks) {
        if (br.hp <= 0) continue;
        const nx = Math.max(br.x, Math.min(b.x, br.x + br.w)), ny = Math.max(br.y, Math.min(b.y, br.y + br.h));
        const dx = b.x - nx, dy = b.y - ny;
        if (dx * dx + dy * dy <= BR * BR) {
          if (Math.abs(dx) > Math.abs(dy)) b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
          else b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
          if (dx === 0 && dy === 0) b.vy = -b.vy;
          hitBrick(b, br, A);
          break;
        }
      }
      if (A.state !== 'play' || newLevel) { newLevel = false; return; }
    }
    b.trail.push([b.x, b.y]); if (b.trail.length > 8) b.trail.shift();
    if (b.y > H + 20) balls.splice(i, 1);
  }
  if (!balls.length) { lose(A); return; }
  bricks.forEach(br => { if (br.hit > 0) br.hit -= dt; });

  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.y += 150 * dt; d.t += dt;
    if (d.y > H + 20) { drops.splice(i, 1); continue; }
    if (d.y > PY - 20 && d.y < PY + 14 && Math.abs(d.x - paddle.x) < paddle.w / 2 + 12) {
      drops.splice(i, 1); A.sfx('medal'); A.toast(POWERS[d.k].name); A.particles.burst(d.x, PY, '#7CFFB2', 16, 200, 4);
      if (d.k === 'wide') wideT = 12;
      if (d.k === 'slow') slowT = 8;
      if (d.k === 'life') lives++;
      if (d.k === 'multi') {
        const src = balls.find(b => !b.stuck) || balls[0];
        if (src.stuck) launch(A);
        [-0.5, 0.5].forEach(da => { const nb = { x: src.x, y: src.y, stuck: false, trail: [] }; const a = Math.atan2(src.vy, src.vx) + da; nb.vx = Math.cos(a) * speed(); nb.vy = Math.sin(a) * speed(); balls.push(nb); });
      }
    }
  }
}

function draw(ctx, A) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1d1050'); g.addColorStop(0.6, '#2b1660'); g.addColorStop(1, '#3a1f6e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // soft stars
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.arc((i * 97) % W, (i * 53) % 560 + 60, (i % 3) * 0.5 + 0.5, 0, 7); ctx.fill(); }
  // top bar: lives + level
  ctx.font = '900 14px Nunito,sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#b9b0d6';
  for (let i = 0; i < lives; i++) ART.draw(ctx, 'heart', 70 + i * 22, 74, 18);
  ctx.textAlign = 'right'; ctx.fillText('Level ' + level, W - 64, 79);

  if (!bricks) return;
  // bricks
  bricks.forEach(br => {
    if (br.hp <= 0) return;
    const j = br.hit > 0 ? 2 : 0;
    if (bricksLeft <= 3) { ctx.fillStyle = 'rgba(255,240,150,' + (0.25 + Math.sin(paddle.t * 6) * 0.15) + ')'; ctx.beginPath(); A.rr(br.x - 6, br.y - 6, br.w + 12, br.h + 12, 10); ctx.fill(); }
    A.rr(br.x - j / 2, br.y - j / 2, br.w + j, br.h + j, 7); A.ink(br.gold ? '#FFB300' : br.color, 2.5);
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(br.x + 5, br.y + 4, br.w - 10, 4);
    if (br.max > 1 && br.hp === 1) { ctx.strokeStyle = 'rgba(26,16,48,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(br.x + 10, br.y + 4); ctx.lineTo(br.x + 20, br.y + 14); ctx.lineTo(br.x + 16, br.y + 22); ctx.stroke(); }
    if (br.max > 1 && br.hp === 2) { ctx.strokeStyle = A.INK; ctx.lineWidth = 2; ctx.strokeRect(br.x + 3, br.y + 3, br.w - 6, br.h - 6); }
    if (br.gold) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.globalAlpha = 0.6 + Math.sin(paddle.t * 6 + br.x) * 0.4;
      A.rr(br.x + 3, br.y + 3, br.w - 6, br.h - 6, 5); ctx.stroke(); ctx.globalAlpha = 1;
      ART.draw(ctx, 'star', br.x + br.w / 2, br.y + br.h / 2, 18 + Math.sin(paddle.t * 6 + br.x) * 2);
    }
    else ART.draw(ctx, br.food, br.x + br.w / 2, br.y + br.h / 2 + 1, 18);
  });
  // power-up drops
  drops.forEach(d => {
    ctx.fillStyle = 'rgba(124,255,178,.25)'; ctx.beginPath(); ctx.arc(d.x, d.y, 18 + Math.sin(d.t * 8) * 2, 0, 7); ctx.fill();
    ART.draw(ctx, POWERS[d.k].art, d.x, d.y, 24, d.t);
  });
  // balls (glowing energy orbs)
  balls.forEach(b => {
    b.trail.forEach(([x, y], i) => { ctx.globalAlpha = i / b.trail.length * 0.4; ctx.fillStyle = '#7CFFB2'; ctx.beginPath(); ctx.arc(x, y, BR * i / b.trail.length, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(124,255,178,.3)'; ctx.beginPath(); ctx.arc(b.x, b.y, BR + 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, 7); A.ink('#E9FFF4', 2.5);
    ctx.fillStyle = '#3FCB6B'; ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, 3, 0, 7); ctx.fill();
  });
  // paddle: a skateboard with your sprite riding it
  const pw = paddle.w, bump = (paddle.bump || 0); paddle.bump = Math.max(0, bump - 0.08);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(paddle.x, PY + 18, pw / 2, 5, 0, 0, 7); ctx.fill();
  A.rr(paddle.x - pw / 2, PY - 8, pw, 14, 7); A.ink(wideT > 0 ? '#3FCB6B' : '#FFD700', 3);
  ctx.fillStyle = '#1A1030'; [-pw / 2 + 14, pw / 2 - 14].forEach(dx => { ctx.beginPath(); ctx.arc(paddle.x + dx, PY + 9, 5, 0, 7); ctx.fill(); });
  const mood = A.state === 'dying' || A.state === 'over' ? 'ghost' : (slowT > 0 ? 'tired' : 'happy');
  A.drawHero(paddle.x, PY - 30 + bump * 4, 46, 0, mood);
  if (launchHint && A.state === 'play' && balls.some(b => b.stuck)) {
    ctx.fillStyle = '#fff'; ctx.font = '900 16px Nunito,sans-serif'; ctx.textAlign = 'center';
    ctx.globalAlpha = 0.6 + Math.sin(paddle.t * 5) * 0.4; ctx.fillText('Tap or press Space to launch', W / 2, PY - 70); ctx.globalAlpha = 1;
  }
}

window.__brk = () => ({ paddle, balls, bricks, lives, level, drops, bricksLeft, aim: x => { aimX = x; } });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Habit Breaker', subtitle: 'Smash the wall of bad habits!', W, H, reserveH: 70,
  storageKey: 'habit_breaker', winText: 'You broke two walls of bad habits!', deathDelay: 900,
  medals: [{ at: 400, name: 'Bronze', icon: '🥉' }, { at: 1000, name: 'Silver', icon: '🥈' }, { at: 2000, name: 'Gold', icon: '🥇' }, { at: 3500, name: 'Legend', icon: '💎' }],
  howTo: 'Bounce the energy orb to break every habit block.<br>Gold ⭐ blocks drop power-ups. <b>Clear 2 walls</b> to win!',
  controls: 'Move mouse / drag finger · or ← → · Space or tap to launch · P pause',
  overTitle: 'Out of lives!',
  facts: [
    'It takes about 2 months on average to build a new habit, so keep at it.',
    'Replacing a bad habit with a better one works better than just stopping.',
    'A 12 oz can of soda has about 39 grams of sugar.',
    'Getting enough sleep makes it easier to make healthy choices.',
    'Small changes, like a daily walk, add up to big health gains.'
  ],
  reset, update, draw, input, pointer,
  pad: [{ label: '◀', type: 'left', wide: true }, { label: '🚀', type: 'up' }, { label: '▶', type: 'right', wide: true }]
});
})();
</script>
