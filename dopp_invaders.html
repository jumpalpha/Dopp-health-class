<!DOCTYPE html>
<html data-app-name="Germ Invaders" lang="en">
<head>
<meta charset="UTF-8">
<script src="term.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Germ Invaders — Dopp's Arcade</title>
<meta name="description" content="Defend your health! Your Wellness Sprite blasts germs, junk food and stress clouds with water.">
<link rel="canonical" href="https://doppsclass.com/dopp_invaders.html">
<link rel="icon" type="image/png" href="app/site-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#22134a 0%,#0a0618 70%) fixed;color:#f4efff;font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto;padding:10px 16px}
.top a{color:#FFD700;font-weight:800;text-decoration:none}
.top h1{font-family:Cinzel,serif;font-size:20px;color:#FFD700;text-shadow:0 2px 0 #000}
#game{padding:0 8px 16px}
</style>
<!-- PWA --><link rel="manifest" href="app/germ_invaders.webmanifest"><link rel="apple-touch-icon" href="app/germ_invaders-180.png"><meta name="apple-mobile-web-app-title" content="Invaders"><meta name="theme-color" content="#140c2e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><script src="pwa.js" defer></script><!-- /PWA -->
</head>
<body>
<div class="top"><a href="arcade.html">← Arcade</a><h1>Germ Invaders</h1><a href="pet.html">🌱 My Sprite</a></div>
<div id="game"></div>
<script src="pet_sprite.js"></script>
<script src="arcade_art.js"></script>
<script src="arcade_kit.js"></script>
<script>
(() => {
const W = 420, H = 640, PY = 584, COLS = 7, ROWS = 4, SX = 50, SY = 44;
const ROW_KIND = [
  { art: 'virus', pts: 30, name: 'germ' },
  { art: 'stress', pts: 20, name: 'stress cloud' },
  { art: 'soda', pts: 10, name: 'soda' },
  { art: 'donut', pts: 10, name: 'donut' }
];
const TIPS = ['Washing your hands for 20 seconds stops lots of germs.', 'Deep breathing can calm a stress cloud fast.',
  'Water beats soda for hydration every time.', 'Sleep helps your immune system fight germs.', 'Exercise is a great stress buster.'];
const POWERS = { shield: { art: 'shield', name: 'Immune shield!' }, spread: { art: 'water', name: 'Triple splash!' }, life: { art: 'heart', name: 'Extra life!' } };

let hero, foes, shots, bombs, drops, fx, dir, stepT, wave, lives, keys, aimX, fireT, spreadT, shieldOn, invT, waveBanner, stars;

function buildWave() {
  foes = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    foes.push({ c, r, x: 50 + c * SX, y: 104 + r * SY, kind: ROW_KIND[r], alive: true, t: Math.random() * 6 });
  dir = 1; stepT = 0; waveBanner = 2;
}
function reset(A) {
  hero = { x: W / 2, t: 0 }; shots = []; bombs = []; drops = [];
  wave = 1; lives = 3; keys = { l: false, r: false }; aimX = null; fireT = 0; spreadT = 0; shieldOn = false; invT = 0;
  stars = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 20 + Math.random() * 60, r: Math.random() * 1.6 + 0.3 }));
  buildWave();
}
function input(type, A) {
  if (type === 'left') keys.l = true; else if (type === 'release-left') keys.l = false;
  else if (type === 'right') keys.r = true; else if (type === 'release-right') keys.r = false;
}
function pointer(type, x) { aimX = x; }

function hurt(A) {
  if (invT > 0) return;
  if (shieldOn) { shieldOn = false; invT = 1; A.sfx('point'); A.toast('🛡 Shield blocked it!'); return; }
  lives--; invT = 1.8; A.sfx('hit'); A.shake(10, 0.3); A.flash(0.15);
  A.particles.burst(hero.x, PY - 10, '#FF8FA3', 18, 220, 4);
  if (lives <= 0) { A.gameOver(); return; }
  A.toast('💔 ' + lives + (lives === 1 ? ' life' : ' lives') + ' left');
}

function update(dt, A) {
  if (!hero) return;
  hero.t += dt;
  stars.forEach(s => { s.y += s.s * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
  foes.forEach(f => f.t += dt);
  if (A.state !== 'play') { if (A.state === 'menu') hero.x = W / 2 + Math.sin(hero.t) * 90; return; }
  invT = Math.max(0, invT - dt); spreadT = Math.max(0, spreadT - dt); waveBanner = Math.max(0, waveBanner - dt);

  // move
  if (keys.l) { hero.x -= 300 * dt; aimX = null; }
  if (keys.r) { hero.x += 300 * dt; aimX = null; }
  if (aimX != null) hero.x += (aimX - hero.x) * Math.min(1, dt * 14);
  hero.x = Math.max(24, Math.min(W - 24, hero.x));

  // auto-fire water drops
  fireT -= dt;
  if (fireT <= 0 && waveBanner < 1.2) {
    fireT = 0.32;
    const spread = spreadT > 0 ? [-0.22, 0, 0.22] : [0];
    spread.forEach(a => shots.push({ x: hero.x, y: PY - 30, vx: Math.sin(a) * 520, vy: -Math.cos(a) * 520 }));
    A.sfx('flap');
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i]; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y < 50 || s.x < 0 || s.x > W) { shots.splice(i, 1); continue; }
    const hit = foes.find(f => f.alive && Math.abs(f.x - s.x) < 18 && Math.abs(f.y - s.y) < 18);
    if (hit) {
      hit.alive = false; shots.splice(i, 1);
      A.addScore(hit.kind.pts * wave); A.sfx('coin');
      A.particles.burst(hit.x, hit.y, hit.kind.art === 'virus' ? '#B8F15A' : hit.kind.art === 'stress' ? '#b9b0d6' : '#FF8FC7', 14, 200, 4);
      if (Math.random() < 0.09) { const k = Object.keys(POWERS); let p = k[Math.floor(Math.random() * k.length)]; if (p === 'life' && lives >= 5) p = 'spread'; drops.push({ x: hit.x, y: hit.y, k: p, t: 0 }); }
    }
  }

  // formation marches, speeding up as it thins out
  const alive = foes.filter(f => f.alive);
  if (!alive.length) {
    A.addScore(200 * wave); A.sfx('win');
    A.float('Wave ' + wave + ' cleared! +' + 200 * wave, W / 2, 320, '#FFD700');
    if (wave === 3) A.win('Three waves defeated!');
    else A.toast('💡 ' + TIPS[wave % TIPS.length], 2400);
    wave++; bombs = []; buildWave(); return;
  }
  const speed = (18 + (COLS * ROWS - alive.length) * 2.2) * (1 + (wave - 1) * 0.25);
  let edge = false;
  alive.forEach(f => { f.x += dir * speed * dt; if (f.x < 22 || f.x > W - 22) edge = true; });
  if (edge) { dir = -dir; alive.forEach(f => { f.x += dir * speed * dt * 2; f.y += 16; }); }
  if (alive.some(f => f.y > PY - 40)) { lives = 0; hurt(A); A.gameOver(); return; }

  // bombs from the lowest foe in a random column
  const rate = 0.6 + wave * 0.35;
  if (Math.random() < rate * dt && waveBanner < 1) {
    const cols = [...new Set(alive.map(f => f.c))], c = cols[Math.floor(Math.random() * cols.length)];
    const low = alive.filter(f => f.c === c).sort((a, b) => b.y - a.y)[0];
    bombs.push({ x: low.x, y: low.y + 16, vy: 170 + wave * 25, kind: low.kind.art === 'virus' ? 'germ' : 'sugar', t: 0 });
  }
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i]; b.y += b.vy * dt; b.t += dt;
    if (b.y > H) { bombs.splice(i, 1); continue; }
    if (Math.abs(b.x - hero.x) < 20 && Math.abs(b.y - (PY - 14)) < 20) { bombs.splice(i, 1); hurt(A); if (A.state !== 'play') return; }
  }
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.y += 120 * dt; d.t += dt;
    if (d.y > H) { drops.splice(i, 1); continue; }
    if (Math.abs(d.x - hero.x) < 26 && Math.abs(d.y - (PY - 14)) < 26) {
      drops.splice(i, 1); A.sfx('medal'); A.toast(POWERS[d.k].name);
      if (d.k === 'shield') shieldOn = true; if (d.k === 'spread') spreadT = 10; if (d.k === 'life') lives++;
    }
  }
}

function draw(ctx, A) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d0626'); g.addColorStop(0.7, '#1f1050'); g.addColorStop(1, '#3a1f6e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!hero) return;
  stars.forEach(s => { ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + s.r / 3) + ')'; ctx.fillRect(s.x, s.y, s.r, s.r * 2); });
  // ground: a healthy planet horizon
  ctx.fillStyle = '#2f9a55'; ctx.beginPath(); ctx.ellipse(W / 2, H + 300, 420, 340, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = A.INK; ctx.lineWidth = 3; ctx.stroke();
  // HUD
  for (let i = 0; i < lives; i++) ART.draw(ctx, 'heart', 70 + i * 22, 74, 18);
  ctx.fillStyle = '#b9b0d6'; ctx.font = '900 14px Nunito,sans-serif'; ctx.textAlign = 'right'; ctx.fillText('Wave ' + wave + (wave <= 3 ? ' / 3' : ''), W - 64, 79);
  if (spreadT > 0) { ctx.textAlign = 'left'; ctx.fillStyle = '#7fd5ff'; ctx.fillText('💧×3 ' + Math.ceil(spreadT) + 's', 14, H - 12); }

  // foes
  foes.forEach(f => { if (f.alive) ART.draw(ctx, f.kind.art, f.x, f.y + Math.sin(f.t * 3) * 2, 34, f.t); });
  // bombs
  bombs.forEach(b => {
    if (b.kind === 'germ') { ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 7); A.ink('#B8F15A', 2); }
    else { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.t * 6); A.rr(-6, -6, 12, 12, 2); A.ink('#fff', 2); ctx.restore(); }
  });
  // power-ups
  drops.forEach(d => { ctx.fillStyle = 'rgba(124,255,178,.25)'; ctx.beginPath(); ctx.arc(d.x, d.y, 18, 0, 7); ctx.fill(); ART.draw(ctx, POWERS[d.k].art, d.x, d.y, 24, d.t); });
  // shots
  shots.forEach(s => ART.draw(ctx, 'water', s.x, s.y, 13));
  // hero
  const blink = invT > 0 && Math.floor(invT * 12) % 2;
  if (!blink) {
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(hero.x, PY + 18, 22, 5, 0, 0, 7); ctx.fill();
    A.drawHero(hero.x, PY - 8, 56, (keys.l ? -0.12 : keys.r ? 0.12 : 0), A.state === 'dying' || A.state === 'over' ? 'ghost' : 'happy');
    if (shieldOn) { ctx.strokeStyle = 'rgba(127,213,255,.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hero.x, PY - 8, 36 + Math.sin(hero.t * 6) * 2, 0, 7); ctx.stroke(); }
  }
  if (waveBanner > 0 && A.state === 'play') {
    ctx.globalAlpha = Math.min(1, waveBanner); ctx.textAlign = 'center';
    ctx.font = '900 34px Cinzel,serif'; ctx.lineWidth = 6; ctx.strokeStyle = A.INK; ctx.strokeText('WAVE ' + wave, W / 2, 330); ctx.fillStyle = '#FFD700'; ctx.fillText('WAVE ' + wave, W / 2, 330);
    ctx.globalAlpha = 1;
  }
}

window.__inv = () => ({ hero, foes, bombs, drops, lives, wave, aim: x => { aimX = x; } });   // used by automated playtests
window.game = Arcade({
  mount: '#game', title: 'Germ Invaders', subtitle: 'Defend your health!', W, H, reserveH: 70,
  storageKey: 'germ_invaders', winText: 'Three waves defeated!', deathDelay: 900,
  medals: [{ at: 800, name: 'Bronze', icon: '🥉' }, { at: 2500, name: 'Silver', icon: '🥈' }, { at: 5000, name: 'Gold', icon: '🥇' }, { at: 9000, name: 'Legend', icon: '💎' }],
  howTo: 'Your sprite sprays water automatically.<br><b>Move</b> to aim and dodge. <b>Beat 3 waves</b> to win!',
  controls: 'Move mouse / drag finger · or ← → · P pause',
  overTitle: 'Overrun!',
  facts: [
    'Handwashing with soap is one of the best ways to stop germs from spreading.',
    'Vaccines train your immune system to recognize germs before you get sick.',
    'Chronic stress can weaken your immune system, so take time to recharge.',
    'Covering coughs and sneezes protects the people around you.',
    'Getting 8 to 10 hours of sleep helps your body fight infections.'
  ],
  reset, update, draw, input, pointer,
  pad: [{ label: '◀', type: 'left', wide: true }, { label: '▶', type: 'right', wide: true }]
});
})();
</script>
</body>
</html>
